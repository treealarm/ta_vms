# A roi-clip profile: the command line, written down.
#
#   ./integration/scripts/roi-clip.sh -c my-profile.yaml
#   ./integration/scripts/roi-clip.sh -c my-profile.yaml other-clip.mp4 --crf 36
#
# Every key here is one of roi-clip.sh's flags, and a flag given on the command line wins over the
# value in the file, so a profile is a starting point rather than a cage. Only the keys you care
# about need to be present; delete the rest and the built-in defaults apply.
#
# Copy this file rather than editing it in place -- it is the documented example, not your profile.

# What to convert, and where the result goes. `out` names the file exactly and takes its directory;
# `outdir` instead keeps the source's name and appends .roi.mp4. Give one or the other.
input: /mnt/wdblue/seenaptec/media_trash/samples/dataset/video1.mp4
out: /mnt/wdblue/seenaptec/media_trash/samples/dataset/video1_compressed.mp4
# outdir: /tmp/roi-clip/video1

# What to look for. Detection costs a pass over the frame per class family, so ask for what you
# will actually look at. Plates are found on vehicle crops, so naming license_plate implies
# vehicle detection whether or not you list it.
classes: [vehicle, license_plate]
detect_fps: 2          # inference passes per second of content; 0 means every frame
min_confidence: 0.5

# How the bits get spent — product model, not a lab "boost".
#
# ROI encoding does not make objects better than the source. It keeps them closer to the
# source while the rest of the frame is allowed to get worse. Under today's CQP/CRF path
# that means: a fairly high `crf` (the crush), §11 importance for how much each class is
# worth (omit `qp` so the model runs), and a positive `background_qp` (crush the rest).
# `qp_at_zero` / `qp_at_one` set the importance→QP line; the values below are the product
# point (plate −12, vehicle −6). The library default without them is the §12 example (−10/−4).
# Codec and GOP default to the source. Explicit `qp:` rows turn the model off for those kinds.
crf: 36
background_qp: 14
pad: 0.02
qp_at_zero: 3
qp_at_one: -12
# qp:                        # only if you want to bypass §11 for named kinds
#   license_plate: -12
#   vehicle: -6

# Which encoder does the work. vaapi is the default wherever /dev/dri exists; qsv is the same
# silicon but crashes the service on this machine (see docs/stream-mode-hw.md).
encoder: vaapi
codec: same
# gop:               # omit to keep the source's keyframe interval
# preset: balanced

# Regions as rectangles, or as a mask when the driver's region budget is too small for the scene
# (VA-API takes eight). A mask costs no budget but cannot express a per-region quantizer as
# precisely -- see docs/stream-mode-hw.md.
regions: boxes
# max_regions: 8
# mask_scale: 8

# What happens when it is done: roi | source | both | none.
play: roi
# player: mpv
thickness: 3
# keep: true           # leave the encoder service's log next to the result

# Where the detector's models live, when they are not in <video_a>/models.
# model_path: /mnt/wdblue/tests/video_a/models

syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

package vms.map;

// The map: VmsMap owns the object tree, geometry, spaces and plans, states, events, values, tracks,
// diagrams, rights and files, and this is how every other service and the web reach it. Spaces and
// calibrations arrived with M2; the reads, the effective-rights model and the Watch stream with
// M3. Every read that can return more than one node takes the caller's identity, because the same
// rights rule must decide what leaves the service and what web_srv is allowed to show.
//
// One tree: `objects` holds every node. What a node is, is said by its side rows — a diagram
// (`Diagram`), a drawn figure (`Figure`), a space (`Space`), a camera placement
// (`CameraPlacement`) — never by a type column. Ids are UUID strings; an empty one on input means
// "assign one", and the response carries it back.
//
// Changes to spaces, plans, landmarks, placements and calibrations are announced on the
// `map-config-changed` topic, payload {"object_ids": ["..."], "camera_ids": ["..."]}: the nodes
// that changed, and the cameras whose spatial model did. An empty `camera_ids` means "everything";
// an empty `object_ids` means no node in particular. The event is addressing only — a subscriber
// re-reads what it needs.
//
// The message forms follow Square's producer protocol (tracks.proto there): the same fields and
// the same meaning, without its `Proto` prefix.

service MapService {
  // Objects and their place in the tree. UpdateObjects creates or renames a node and moves it
  // under another parent; the response carries the ids of the nodes that had none.
  rpc UpdateObjects(ObjectList) returns (ObjectList);
  rpc UpdateProperties(ObjectPropertiesList) returns (OperationStatus);
  // How a node is drawn: colour, icon, rotation, caption. Separate from the properties because
  // these are the map's own fields, not arbitrary data the editor happens to keep.
  rpc UpdateVisual(VisualList) returns (OperationStatus);
  // Geometry of the nodes drawn on a canvas: a point, a polyline or a polygon, in the coordinates
  // of the nearest canvas ancestor.
  rpc UpdateFigures(Figures) returns (Figures);
  // Removes the nodes and everything under them, with their states, alarms, events, tracks,
  // rights, geometry and diagrams, in one transaction.
  rpc DeleteObjects(ObjectIds) returns (OperationStatus);

  // ── Maps & plans ── spaces, plans, placements, landmarks and calibrations. A space is a tree
  // node with its own row; where things stand is `geo_objects`; the message section says how.
  rpc ListSpaces(google.protobuf.Empty) returns (ListSpacesResponse);
  rpc GetSpace(SpaceRequest) returns (GetSpaceResponse);
  // Creates the space when id is empty; returns what was stored.
  rpc UpsertSpace(Space) returns (Space);
  // Takes the nested spaces with it, and everything placed in any of them.
  rpc RemoveSpace(SpaceRequest) returns (OperationStatus);
  // Streamed both ways because a plan image does not fit in one message: Dapr service invocation
  // caps a gRPC message at 4 MiB, and the caller's channel cannot be configured past that.
  rpc UploadSpacePlan(stream SpacePlanUploadChunk) returns (Space);
  rpc GetSpacePlanImage(GetSpacePlanImageRequest) returns (stream SpacePlanImageChunk);
  // Re-aligns a plan without sending the image again.
  rpc SetSpacePlanCorners(SetSpacePlanCornersRequest) returns (Space);
  rpc RemoveSpacePlan(SpaceRequest) returns (OperationStatus);
  rpc ListCameraPlacements(google.protobuf.Empty) returns (ListCameraPlacementsResponse);
  // Where the camera really stands, with the space that is in. Aiming goes by it.
  rpc GetReferencePlacement(CameraRequest) returns (GetReferencePlacementResponse);
  rpc UpsertCameraPlacement(CameraPlacement) returns (OperationStatus);
  rpc RemoveCameraPlacement(CameraPlacementRequest) returns (OperationStatus);
  rpc ListLandmarks(SpaceRequest) returns (ListLandmarksResponse);
  rpc UpsertLandmark(Landmark) returns (Landmark);
  rpc RemoveLandmark(LandmarkRequest) returns (OperationStatus);
  rpc GetPtzGeoObservations(CameraRequest) returns (PtzGeoObservations);
  // Replaces the camera's observations whole, like a slave binding's points: one observation
  // changes what every other one is checked against.
  rpc SetPtzGeoObservations(PtzGeoObservations) returns (OperationStatus);
  rpc GetGroundObservations(CameraRequest) returns (GroundObservations);
  // Replaces the camera's ground marks whole, as SetPtzGeoObservations does.
  rpc SetGroundObservations(GroundObservations) returns (OperationStatus);
  // Everything needed to aim one camera through world coordinates, in one round trip.
  rpc GetCameraSpatialModel(CameraRequest) returns (CameraSpatialModelResponse);
  // The models of every camera with ground marks whose reference placement shares geometry with
  // the given space: the cameras whose detections can be shown there.
  rpc ListCameraSpatialModels(SpaceRequest) returns (ListCameraSpatialModelsResponse);

  // ── Reads ── the tree, states, events, values, tracks, diagrams, rights and levels. Every read
  // that can return more than one node carries the caller's identity: VmsMap applies the same
  // rights rule it computes for web_srv, so a node the caller may not see never leaves the service.
  rpc GetByParent(GetByParentRequest) returns (GetByParentResponse);
  rpc GetByIds(GetByIdsRequest) returns (Figures);
  rpc GetMarkersByIds(GetByIdsRequest) returns (MarkerList);
  // Figures inside a box, on a zoom layer, or by property. Above a thousand figures the answer is
  // clustered by zoom layer, exactly as Square's map did.
  rpc GetByBox(GetByBoxRequest) returns (Figures);
  rpc GetByName(GetByNameRequest) returns (MarkerList);
  // Admin → Nodes searches the logical tree without descending it: a node's name, a part's token,
  // or a camera id. The tree is loaded a level at a time, so a token in an unopened server would
  // otherwise be unfindable. Capped, and filtered by the caller's rights like every multi-node read.
  rpc SearchDeviceNodes(SearchDeviceNodesRequest) returns (MarkerList);
  rpc GetByParams(GetByParamsRequest) returns (Figures);
  // One node with its properties and the zoom range of its layer.
  rpc GetObjProps(GetObjPropsRequest) returns (ObjProps);
  // A node with owner_id set: it shows the owner's states and values but has a place of its own.
  rpc CreateReplica(CreateReplicaRequest) returns (Marker);

  rpc GetStates(GetStatesRequest) returns (ObjectStateList);
  // States, alarm counters and descriptions in one answer, the way the map paints a set of nodes.
  rpc GetVisualStates(GetStatesRequest) returns (VisualStates);
  // The alarm counters of the named nodes. An empty list asks for every alarmed node the caller
  // may see: the operator's alarm list is not a set of ids the browser already knows.
  rpc GetAlarmedStates(GetStatesRequest) returns (AlarmStateList);
  // The effective arming of one device node: an input's own setting when it has one, otherwise the
  // nearest armed property of the space the camera stands in, otherwise the camera's own arming.
  rpc GetNodeArming(GetNodeArmingRequest) returns (GetNodeArmingResponse);
  rpc GetStateDescriptions(GetStateDescriptionsRequest) returns (StateDescriptionList);

  // The operator's alarm entity, independent of the ALARM state: a row with a status, an
  // acknowledgement and a close reason. GetAlarms answers two keyset pages, open and recently
  // closed, each with its own cursor; the state stays the way the map paints it.
  rpc GetAlarms(GetAlarmsRequest) returns (AlarmList);
  // The acknowledgement, close and raise transitions. Their refusals are gRPC statuses:
  // PERMISSION_DENIED without the right, FAILED_PRECONDITION for a transition the table forbids,
  // NOT_FOUND for an unknown alarm.
  rpc AcknowledgeAlarm(AcknowledgeAlarmRequest) returns (Alarm);
  rpc CloseAlarm(CloseAlarmRequest) returns (Alarm);
  rpc RaiseAlarm(RaiseAlarmRequest) returns (Alarm);

  rpc GetEventsByFilter(GetEventsByFilterRequest) returns (EventList);
  // One event by id. The event router trusts the journal, not the bus: map-event-created carries
  // an id and nothing else, and GetEventsByFilter has no "by id" filter — start_id is a cursor.
  rpc GetEvent(GetEventRequest) returns (Event);

  rpc GetTracksByFilter(GetTracksByFilterRequest) returns (TrackPointList);
  rpc GetTracksByBox(GetTracksByBoxRequest) returns (TrackPointList);

  rpc GetValuesByOwners(GetValuesByOwnersRequest) returns (ValueList);

  rpc GetDiagramContent(GetDiagramContentRequest) returns (DiagramContent);
  rpc GetDiagramsByIds(GetByIdsRequest) returns (DiagramList);
  rpc GetDiagramTypes(GetDiagramTypesRequest) returns (DiagramTypeList);

  rpc GetLevels(google.protobuf.Empty) returns (LevelList);
  rpc GetLevel(GetLevelRequest) returns (GetLevelResponse);
  // The zoom-level dictionary is part of the map's editing surface: a new layer gets a name and a
  // zoom range, and a level that is no longer wanted is removed with its id.
  rpc UpdateLevels(LevelList) returns (LevelList);
  rpc DeleteLevels(ObjectIds) returns (OperationStatus);

  // Rights as stored, the expanded effective set for one caller, and the dictionary the editor
  // reads to know which actions a node kind accepts.
  rpc GetRights(ObjectIds) returns (RightList);
  rpc GetEffectiveRights(EffectiveRightsRequest) returns (EffectiveRightsResponse);
  rpc GetRightActions(google.protobuf.Empty) returns (RightActionTable);
  rpc GetRightsMode(google.protobuf.Empty) returns (RightsModeResponse);
  rpc SetRightsMode(SetRightsModeRequest) returns (OperationStatus);

  // Changes to what one caller watches: a box, a set of ids, or their values. One stream per
  // client; the service coalesces every stream in the process into one poll per second. The
  // subscription is in the request, not a second stream: Dapr service invocation proxies a
  // server-streaming call but not a bidirectional one, and the web reaches VmsMap through Dapr.
  // A client that changes what it follows opens a new stream.
  rpc Watch(WatchRequest) returns (stream WatchMessage);

  rpc UpdateStates(ObjectStateList) returns (OperationStatus);
  // The dictionary of state names: description, colour and whether the state is an alarm.
  rpc UpdateStateDescriptions(StateDescriptionList) returns (OperationStatus);

  rpc UpdateEvents(EventList) returns (OperationStatus);

  rpc UpdateValues(ValueList) returns (OperationStatus);
  rpc DeleteValues(ObjectIds) returns (OperationStatus);

  rpc UpdateTracks(TrackPointList) returns (OperationStatus);

  // Mnemoschemes and their types. A type's regions are fractions of its rectangle; a diagram
  // carries its own rectangle on the parent canvas. Both return the ids assigned to new rows.
  rpc UpdateDiagrams(DiagramList) returns (DiagramList);
  rpc DeleteDiagrams(ObjectIds) returns (OperationStatus);
  rpc UpdateDiagramTypes(DiagramTypeList) returns (DiagramTypeList);
  rpc DeleteDiagramTypes(ObjectIds) returns (OperationStatus);

  // The demo world. The world is code in VmsMap, installed through the ordinary services under a
  // registry of what it owns, so a second install updates it and a removal deletes only it. Its
  // video wall is VmsCfg's (CfgService.InstallDemo); web_srv calls both and merges the reports.
  rpc InstallDemo(InstallDemoRequest) returns (DemoReport);
  rpc RemoveDemo(InstallDemoRequest) returns (DemoReport);
  rpc GetDemoStatus(InstallDemoRequest) returns (DemoStatus);

  // Rights are rows on tree nodes, inherited downwards from the moment M3 reads them: a subject
  // is a Keycloak role name or a user name, an action comes from the open set the node kind
  // allows (view, edit, and for a camera view_live, view_archive, ptz, control, export).
  rpc UpdateRights(RightList) returns (OperationStatus);
  rpc DeleteRights(RightKeyList) returns (OperationStatus);

  // Files live in the database, not on a volume: VmsMap is replicable and a local file would tie
  // a row to one instance. Uploads are streamed in chunks; the first one carries the MIME type.
  rpc PutFile(stream FileUploadChunk) returns (FileInfo);
  rpc GetFile(FileRequest) returns (stream FileChunk);
  rpc GetFileInfo(FileRequest) returns (FileInfo);
}

message OperationStatus {
  bool success = 1;
  string message = 2;
}

// ── Objects and properties ─────────────────────────────────────────────────────

message Object {
  string id = 1;
  optional string parent_id = 2;
  // Set on a replica: the node whose states, values and events this one shows. A replica has its
  // own geometry and place, but no states of its own.
  optional string owner_id = 3;
  string name = 4;
}

message ObjectList {
  repeated Object objects = 1;
}

message ObjectIds {
  repeated string ids = 1;
}

// Who is asking. The web is the only caller that fills it in: username and Keycloak roles decide
// what a read may return, and `unrestricted` is set when the deployment runs without
// authentication at all (KEYCLOAK_URL empty), where there is no identity to scope anything to.
message Caller {
  string username = 1;
  repeated string roles = 2;
  bool unrestricted = 3;
}

// One node of the tree as the map and the tree view read it. `camera_id` is set only on a camera
// node or a picture of one; it is how the browser opens live video for the node it drew.
message Marker {
  string id = 1;
  string parent_id = 2;
  string owner_id = 3;
  string name = 4;
  bool has_children = 5;
  string camera_id = 6;
  // The database's xmin, which changes whenever the row does. The watch stream diffs by it.
  uint32 version = 7;
  // What kind of node this is (RightActions.NodeKind): a space, a diagram, a landmark, a camera,
  // a figure or a plain object. It is the node's side row, not a stored type; a replica answers
  // with its owner's kind.
  string node_kind = 8;
}

message MarkerList {
  repeated Marker markers = 1;
}

message GetByParentRequest {
  // Empty asks for the roots.
  string parent_id = 1;
  string start_id = 2;
  string end_id = 3;
  int32 count = 4;
  Caller caller = 5;
}

message GetByParentResponse {
  string parent_id = 1;
  // The chain from the root down to the parent, so the browser can draw breadcrumbs.
  repeated Marker parents = 2;
  repeated Marker children = 3;
  string start_id = 4;
  string end_id = 5;
}

message GetByIdsRequest {
  repeated string ids = 1;
  Caller caller = 2;
}

message GetByNameRequest {
  string name = 1;
  Caller caller = 2;
}

message SearchDeviceNodesRequest {
  // A name fragment, a part token, or a camera id. Two characters at least: one letter would
  // return the whole tree's worth of matches up to the cap.
  string query = 1;
  // Capped at 50 by the service; 0 means the default (50).
  int32 limit = 2;
  Caller caller = 3;
}

message PropertyFilter {
  string prop_name = 1;
  string str_val = 2;
}

message GetByParamsRequest {
  repeated PropertyFilter props = 1;
  string start_id = 2;
  int32 forward = 3;
  int32 count = 4;
  Caller caller = 5;
}

// An area of the map, optionally narrowed to a zoom layer, a set of ids or a zone. Mirrors
// Square's BoxDTO: `wn` is the north-west corner and `es` the south-east one. A `canvas_id`
// replaces the rectangle with the canvas itself: everything drawn in that space's coordinates,
// whatever its depth in the tree.
message Box {
  Coordinate wn = 1;
  Coordinate es = 2;
  optional double zoom = 3;
  repeated string ids = 4;
  optional int32 count = 5;
  repeated Geometry zone = 6;
  bool not_in_zone = 7;
  // The space (or mnemoscheme) whose canvas is asked for. Empty means the rectangle is used.
  string canvas_id = 8;
}

message GetByBoxRequest {
  Box box = 1;
  repeated PropertyFilter property_filter = 2;
  Caller caller = 3;
}

message GetObjPropsRequest {
  string id = 1;
  Caller caller = 2;
}

message ObjProps {
  Marker marker = 1;
  repeated ExtraProperty extra_props = 2;
  // The zoom range of the node's layer, when its figure has one.
  optional int32 zoom_min = 3;
  optional int32 zoom_max = 4;
  // How the node is drawn. Empty when it has no visual row.
  Visual visual = 5;
}

message CreateReplicaRequest {
  string owner_id = 1;
  string parent_id = 2;
  // Empty copies the owner's name.
  string name = 3;
  Caller caller = 4;
}

message ExtraProperty {
  string prop_name = 1;
  string str_val = 2;
  // How the editor renders the value (VisualTypes in the domain): text, colour, number, map, ...
  string visual_type = 3;
}

message ObjectProperties {
  string id = 1;
  repeated ExtraProperty properties = 2;
}

message ObjectPropertiesList {
  repeated ObjectProperties objects = 1;
  // False merges the sent properties into the existing set, true replaces it. Square's producer
  // protocol had the same switch and its callers rely on merge.
  bool replace_props = 2;
}

message Visual {
  string object_id = 1;
  string color = 2;
  // A small icon; plan pictures and diagram backgrounds are `FileUploadChunk`s instead.
  bytes image = 3;
  int32 image_width = 4;
  int32 image_height = 5;
  // Degrees clockwise from north for a camera (its heading), or from upright for an icon.
  optional double rotation_deg = 6;
  string text = 7;
}

message VisualList {
  repeated Visual visuals = 1;
}

// ── Geometry ───────────────────────────────────────────────────────────────────

message Coordinate {
  double lat = 1;
  double lon = 2;
}

message Geometry {
  repeated Coordinate coord = 1;
  // "Point", "Polygon" or "LineString". A polygon's ring is closed here: the first coordinate is
  // repeated at the end.
  string type = 2;
}

message Figure {
  string id = 1;
  optional string parent_id = 2;
  string name = 3;
  Geometry geometry = 4;
  // A point may be drawn as a circle of this radius, in metres.
  optional double radius = 5;
  // The scale layer this node becomes visible at; empty means always.
  optional string zoom_level = 6;
  repeated ExtraProperty extra_props = 7;
  // Read-only, filled by GetByIds and GetByBox; ignored by UpdateFigures. A picture of a camera
  // is a replica with owner_id set, and camera_id names the camera whose live video it opens.
  optional string owner_id = 8;
  bool has_children = 9;
  string camera_id = 10;
  uint32 version = 11;
  // What kind of node this is; see Marker.node_kind.
  string node_kind = 12;
  // How the node is drawn: colour, icon, rotation and caption.
  Visual visual = 13;
}

message Figures {
  repeated Figure figs = 1;
  // Also record a track point for every figure, as Square's producer protocol did.
  bool add_tracks = 2;
}

message GeoObject {
  optional string id = 1;
  Geometry location = 2;
  optional double radius = 3;
  optional string zoom_level = 4;
}

// ── Maps & plans ──────────────────────────────────────────────────────────────
//
// Where cameras and reference points are. A space is a tree node: its name and parent are the
// object's, its own row says what kind of world it is. A nested plan's footprint is its figure on
// the parent canvas; a plan picture is a table of its own so that listing spaces never reads the
// bytes. Every position is WGS84 plus a height in metres above the floor of its space; a space's
// floor is elevation_m above the ground.
//
// Two spaces share geometry when they are the same space or both have real coordinates: only then
// can a camera be aimed at a point, or calibrated on a landmark, in the other. A plan in made-up
// coordinates stores WGS84 made up around (0, 0).
//
// A camera is one node of the tree; its id is derived from the camera id. The reference placement
// is where it really stands -- aiming, calibration and master/slave go by it. Its other placements
// are pictures: replicas of that node, drawn in another space, with their own geometry but no
// states of their own.

enum SpaceKind {
  // A real map: map tiles underneath, real coordinates. Only ever a root.
  SPACE_KIND_MAP  = 0;
  // A plan drawn on its own picture (a metric grid until it has one). A root, or nested.
  SPACE_KIND_PLAN = 1;
}

// A rectangle, by its south-west and north-east corners.
message GeoBounds {
  Coordinate south_west = 1;
  Coordinate north_east = 2;
}

// Three corners of a plan image in its space. Three are enough for an affine placement --
// position, scale, rotation, skew -- and a fourth would only over-determine it.
message PlanCorners {
  Coordinate top_left    = 1;
  Coordinate top_right   = 2;
  Coordinate bottom_left = 3;
}

// Everything about a plan image except its bytes.
message SpacePlan {
  PlanCorners corners   = 1;
  uint32      width_px  = 2;
  uint32      height_px = 3;
  string      mime      = 4;
  // Changes whenever the image does; also its HTTP ETag.
  string      etag      = 5;
}

message Space {
  // The node's id as well: a space is a node of the tree.
  string    id               = 1;
  // Empty for a root.
  string    parent_id        = 2;
  string    name             = 3;
  SpaceKind kind             = 4;
  // Always true for a map.
  bool      real_coordinates = 5;
  // Order among siblings: the floors of a building, bottom to top.
  int32     ordinal          = 6;
  double    elevation_m      = 7;
  // What the space shows when it is opened.
  GeoBounds view             = 8;
  // Where it lies on its parent, in the parent's coordinates; empty when none is drawn.
  repeated Coordinate footprint = 9;
  // Absent when there is no plan image. Ignored by UpsertSpace: the plan has its own RPCs.
  SpacePlan plan             = 10;
}

message SpaceRequest {
  string space_id = 1;
}

message GetSpaceResponse {
  bool  found = 1;
  Space space = 2;
}

message ListSpacesResponse {
  repeated Space spaces = 1;
}

message SpacePlanUploadHeader {
  string      space_id  = 1;
  PlanCorners corners   = 2;
  uint32      width_px  = 3;
  uint32      height_px = 4;
  string      mime      = 5;
}

// The first message carries the header, every later one a piece of the image.
message SpacePlanUploadChunk {
  oneof part {
    SpacePlanUploadHeader header = 1;
    bytes                 data   = 2;
  }
}

message GetSpacePlanImageRequest {
  string space_id = 1;
  // The ETags the caller holds, unquoted and without W/ (HTTP If-None-Match may list several, or
  // "*"). When one still matches, the stream is the header alone, saying so.
  repeated string if_none_match = 2;
}

message SpacePlanImageHeader {
  string mime         = 1;
  string etag         = 2;
  bool   not_modified = 3;
}

// The first message carries the header, every later one a piece of the image. A space with no
// plan answers NOT_FOUND.
message SpacePlanImageChunk {
  oneof part {
    SpacePlanImageHeader header = 1;
    bytes                 data   = 2;
  }
}

message SetSpacePlanCornersRequest {
  string      space_id = 1;
  PlanCorners corners  = 2;
}

// One camera, by its id in VmsCfg. The map never creates cameras; it places them.
message CameraRequest {
  string camera_id = 1;
}

// A camera drawn in one space. A camera may be drawn in several; the reference placement is where
// it really stands -- aiming, calibration and master/slave go by it -- and the rest are pictures
// of it, replicas of the same node. A camera's first placement becomes its reference.
message CameraPlacement {
  string camera_id    = 1;
  string space_id     = 2;
  bool   is_reference = 3;
  double lat          = 4;
  double lon          = 5;
  double height_m     = 6;
  // Compass bearing of the optical axis: 0 = north, clockwise. It is the same number the map
  // draws a camera icon rotated by.
  double heading_deg  = 7;
  // Only draw the view cone; nothing is aimed through them.
  double hfov_deg     = 8;
  double range_m      = 9;
}

message CameraPlacementRequest {
  string camera_id = 1;
  string space_id  = 2;
}

message ListCameraPlacementsResponse {
  repeated CameraPlacement placements = 1;
}

message GetReferencePlacementResponse {
  bool            found     = 1;
  CameraPlacement placement = 2;
  Space           space     = 3;
}

// A named point with a known position, used to calibrate cameras. Operators never see these.
// A landmark is a tree node too: its name and space are the object's.
message Landmark {
  string id       = 1;
  string space_id = 2;
  string name     = 3;
  double lat      = 4;
  double lon      = 5;
  double height_m = 6;
}

message LandmarkRequest {
  string landmark_id = 1;
}

message ListLandmarksResponse {
  repeated Landmark landmarks = 1;
}

// Where a PTZ camera pointed when it was centred on a landmark, in the camera's own pan/tilt space,
// uninterpreted -- as PtzSlaveBindingPoint does it, and for the same reason.
message PtzGeoObservation {
  string landmark_id = 1;
  float  pan         = 2;
  float  tilt        = 3;
  // The zoom a slave uses for an object at this landmark's distance, when the operator recorded
  // one -- in the camera's own zoom units, like pan and tilt. Recorded apart from them: pan and
  // tilt are best taken zoomed right in on the landmark, the framing zoom is how a person there
  // should look.
  optional float zoom = 4;
}

message PtzGeoObservations {
  string camera_id = 1;
  repeated PtzGeoObservation observations = 2;
}

// An observation together with where its landmark is.
message GeoObservation {
  string landmark_id   = 1;
  string landmark_name = 2;
  double lat           = 3;
  double lon           = 4;
  // Above the ground: the landmark's space elevation plus its own height.
  double height_above_ground_m = 5;
  float  pan           = 6;
  float  tilt          = 7;
  optional float zoom  = 8;  // see PtzGeoObservation.zoom
}

// Where a landmark stands on the ground in a fixed camera's picture, normalised to 0..1 across the
// frame (0, 0 top left) -- the convention of detection boxes. Its foot is marked, not its height.
message GroundObservation {
  string landmark_id = 1;
  float  x           = 2;
  float  y           = 3;
}

message GroundObservations {
  string camera_id = 1;
  repeated GroundObservation observations = 2;
}

// A ground mark together with where its landmark stands.
message GeoGroundObservation {
  string landmark_id   = 1;
  string landmark_name = 2;
  double lat           = 3;
  double lon           = 4;
  // The elevation of the landmark's space: an image-to-ground fit maps one floor, so marks on
  // different floors cannot be fitted together.
  double floor_elevation_m = 5;
  float  x             = 6;
  float  y             = 7;
}

message CameraSpatialModelResponse {
  // False when the camera has no reference placement. Without one nothing can be aimed through it.
  bool            found     = 1;
  CameraPlacement placement = 2;
  // The space the camera really stands in.
  Space           space     = 3;
  // Only observations of landmarks in a space that shares geometry with the camera's: one taken
  // before the camera moved to an unrelated plan describes a place it can no longer see.
  repeated GeoObservation observations = 4;
  // Ground marks, filtered by the same rule.
  repeated GeoGroundObservation ground_observations = 5;
}

message ListCameraSpatialModelsResponse {
  repeated CameraSpatialModelResponse models = 1;
}

// ── States and alarms ─────────────────────────────────────────────────────────

message ObjectState {
  string id = 1;
  // The full current set for the object, not a delta: the write replaces what is stored.
  repeated string states = 2;
  google.protobuf.Timestamp timestamp = 3;
  // The row's xmin; ignored on writes and used by the watch stream to tell a change from a poll.
  uint32 version = 4;
}

message ObjectStateList {
  repeated ObjectState states = 1;
}

message StateDescription {
  string id = 1;
  string state = 2;
  string state_descr = 3;
  string state_color = 4;
  // A state with this flag raised puts the object — and, through children_alarms, all its
  // ancestors — into alarm.
  bool alarm = 5;
}

message StateDescriptionList {
  repeated StateDescription descriptions = 1;
}

message GetStatesRequest {
  repeated string ids = 1;
  Caller caller = 2;
}

// The alarm counters of the nodes themselves. `children_alarms` is how many direct children are
// alarmed, which is what raises the colour all the way up the tree.
message AlarmState {
  string id = 1;
  bool alarm = 2;
  int32 children_alarms = 3;
  uint32 version = 4;
}

// What a device node's arming currently resolves to, and where the answer came from. `source` is
// "explicit" for the part's own arm_mode, "space" for an armed property inherited from the space
// of the camera's reference replica, and "camera" for the camera's own armed flag.
message NodeArming {
  string object_id = 1;
  bool   armed     = 2;
  string source    = 3;
}

message GetNodeArmingRequest {
  string object_id = 1;
}

message GetNodeArmingResponse {
  // False when the id is not a device node; arming has no meaning for a space or a server.
  bool found        = 1;
  NodeArming arming = 2;
}

message AlarmStateList {
  repeated AlarmState states = 1;
}

// ── The alarm entity ─────────────────────────────────────────────────────────────────────────

// One operator-facing alarm. It sits on top of the ALARM state rather than replacing it: the state
// says "there is something wrong here now", this row says "somebody has to deal with it".
// `cleared_at` is when the condition went away, `closed_at` when the alarm was dealt with; a
// `returned` alarm has the first and not the second.
message Alarm {
  string id = 1;
  string object_id = 2;
  // The definition the alarm was raised under, from VmsCfg. Empty when the cache did not know it:
  // the raise still happens, with severity 'warning'.
  string definition_id = 3;
  // The VmsCfg event_subscriptions row a subscription-sourced alarm belongs to; empty for the
  // sensor and retention sources.
  string subscription_id = 4;
  string source = 5;       // "sensor" | "retention" | "subscription"
  string dedup_key = 6;
  // Whether the physical condition still holds. Acknowledgement does not change it.
  bool condition_active = 7;
  string status = 8;       // "active" | "acknowledged" | "returned" | "closed"
  string severity = 9;     // "warning" | "critical"
  google.protobuf.Timestamp raised_at = 10;
  optional google.protobuf.Timestamp cleared_at = 11;
  // Retention only: when the episode is projected to end.
  optional google.protobuf.Timestamp expected_end_ts = 12;
  optional google.protobuf.Timestamp acknowledged_at = 13;
  string acknowledged_by = 14;
  string ack_comment = 15;
  optional google.protobuf.Timestamp closed_at = 16;
  // "returned_to_normal", "acknowledged_after_normal", "auto_returned_to_normal", "device_gone",
  // "false_alarm" or "other".
  string close_reason = 17;
  string close_comment = 18;
  string closed_by = 19;   // the operator's name, or "system"
  string source_event_id = 20;

  // Whether this caller may acknowledge the row now: the `acknowledge` right, not closed, and
  // either the condition is gone or the node is disarmed. The browser never guesses this.
  bool can_ack = 21;
  // The node's name and its camera id, so a list row needs no second read.
  string object_name = 22;
  string camera_id = 23;
}

// A keyset position: the last row of the previous page. Open pages order by (raised_at, id), the
// closed ones by (closed_at, id); the service fills the pair from the branch it is paging.
message AlarmCursor {
  google.protobuf.Timestamp after = 1;
  string after_id = 2;
}

message GetAlarmsRequest {
  Caller caller = 1;
  // Rows per page per branch; 0 means 100.
  int32 page_size = 2;
  // Empty starts at the newest.
  AlarmCursor open_after = 3;
  AlarmCursor closed_after = 4;
  // How far back the closed branch reads; 0 means 15 minutes.
  int32 closed_window_minutes = 5;
}

message AlarmPage {
  repeated Alarm alarms = 1;
  bool has_more = 2;
  AlarmCursor next = 3;
}

message AlarmList {
  AlarmPage open = 1;
  AlarmPage closed = 2;
}

message AcknowledgeAlarmRequest {
  string id = 1;
  Caller caller = 2;
  string comment = 3;
}

// `reason` is "false_alarm" or "other": a manual close is only ever of an alarm whose condition is
// already gone, and it says whether the alarm was real.
message CloseAlarmRequest {
  string id = 1;
  Caller caller = 2;
  string reason = 3;
  string comment = 4;
}

// The system's own raise, and the way a transition can be replayed. The adapters inside VmsMap call
// the store directly; this exists for the alarm entity to be testable from outside.
message RaiseAlarmRequest {
  string object_id = 1;
  string source = 2;        // "sensor" | "retention" | "subscription"
  string dedup_key = 3;
  // Empty takes the severity of the definition, or "warning" when the definition is unknown.
  string severity = 4;
  optional google.protobuf.Timestamp expected_end_ts = 5;
  string source_event_id = 6;
  Caller caller = 7;
  // The VmsCfg event_subscriptions row a subscription-sourced alarm belongs to. Empty for the
  // sensor and retention sources.
  string subscription_id = 8;
}

// What the map paints a set of nodes from: their states, their alarm counters and the dictionary
// that turns state names into colours and descriptions.
message VisualStates {
  repeated AlarmState alarmed_objects = 1;
  repeated ObjectState states = 2;
  repeated StateDescription states_descr = 3;
}

message GetStateDescriptionsRequest {
  // Empty returns the whole dictionary.
  repeated string states = 1;
}

// ── Events ────────────────────────────────────────────────────────────────────

message Event {
  google.protobuf.Timestamp timestamp = 1;
  // Empty means "assign one"; the stored id is not returned by this call.
  string id = 2;
  string object_id = 3;
  string event_name = 4;
  int32 event_priority = 5;
  string param0 = 6;
  string param1 = 7;
  repeated ExtraProperty extra_props = 8;
}

message EventList {
  repeated Event events = 1;
}

message GetEventsByFilterRequest {
  google.protobuf.Timestamp time_start = 1;
  google.protobuf.Timestamp time_end = 2;
  // The named nodes and everything below them. Empty means the whole journal.
  repeated string objects = 3;
  // Only events carrying an image property (`visual_type = "image_fs"`).
  bool images_only = 4;
  string param0 = 5;
  string param1 = 6;
  // Keyset cursor: the id of the last event the caller has. The next page starts strictly after
  // it in the chosen direction, so an insert between pages cannot hide a row.
  string start_id = 7;
  int32 count = 8;
  // Only "timestamp" is sortable; it is the key the pagination uses.
  string sort_key = 9;
  string sort_order = 10;
  Caller caller = 11;
}

// The id of one journal row. NotFound means the event is gone — a camera deleted with its history
// takes its events with it — and the router drops the notification.
message GetEventRequest {
  string id = 1;
}

// ── Values and tracks ─────────────────────────────────────────────────────────

message ValueType {
  oneof value {
    double double_value = 1;
    int32 int_value = 2;
    string string_value = 3;
  }
}

message Value {
  string id = 1;
  // The object this value belongs to; a replica never owns values.
  string owner_id = 2;
  string name = 3;
  ValueType value = 4;
  // The row's xmin; ignored on writes and used by the watch stream.
  uint32 version = 5;
}

message ValueList {
  repeated Value values = 1;
}

message GetValuesByOwnersRequest {
  // A replica answers with its owner's values, with owner_id rewritten to the replica.
  repeated string ids = 1;
  Caller caller = 2;
}

message TrackPoint {
  string id = 1;
  GeoObject figure = 2;
  google.protobuf.Timestamp timestamp = 3;
  repeated ExtraProperty extra_props = 4;
}

message TrackPointList {
  repeated TrackPoint tracks = 1;
}

message GetTracksByFilterRequest {
  google.protobuf.Timestamp time_start = 1;
  google.protobuf.Timestamp time_end = 2;
  repeated PropertyFilter property_filter = 3;
  string start_id = 4;
  int32 forward = 5;
  int32 count = 6;
  Caller caller = 7;
}

message GetTracksByBoxRequest {
  Box box = 1;
  google.protobuf.Timestamp time_start = 2;
  google.protobuf.Timestamp time_end = 3;
  // Negative means newest first.
  int32 sort = 4;
  Caller caller = 5;
}

// ── Diagrams ──────────────────────────────────────────────────────────────────

message DiagramCoordinate {
  double top = 1;
  double left = 2;
  double width = 3;
  double height = 4;
  // Degrees clockwise; absent means upright. The browser rotates the image by it.
  optional double rotation = 5;
}

message Diagram {
  string id = 1;
  // The diagram's own canvas: where and how big it is drawn when it is opened. It keeps this
  // rectangle even when a region of its parent gives it its place there.
  DiagramCoordinate geometry = 2;
  // The region of the parent's diagram type this node sits in; the region then gives its place
  // in the parent. Not a replacement for the geometry above.
  string region_id = 3;
  // The id of a DiagramType, not its name: a rename must not orphan the diagrams of a type.
  string dgr_type = 4;
  // A row of `files`, not a path on a volume (see PutFile).
  string file_id = 5;
}

message DiagramList {
  repeated Diagram diagrams = 1;
}

message DiagramTypeRegion {
  string region_key = 1;
  DiagramCoordinate geometry = 2;
  // Free-form styling of the region, as the editor left it.
  map<string, string> styles = 3;
}

message DiagramType {
  string id = 1;
  string name = 2;
  // Background image: a row of `files`.
  string file_id = 3;
  repeated DiagramTypeRegion regions = 4;
}

message DiagramTypeList {
  repeated DiagramType diagram_types = 1;
}

message GetDiagramContentRequest {
  string diagram_id = 1;
  // How many levels of children to include: 0 is the diagram alone, 3 is the deepest a
  // mnemoscheme nests.
  int32 depth = 2;
  Caller caller = 3;
}

message DiagramContent {
  string diagram_id = 1;
  int32 depth = 2;
  repeated Marker children = 3;
  repeated Diagram content = 4;
  repeated DiagramType dgr_types = 5;
  repeated Marker parents = 6;
  // The drawings of the diagram and of the children it carries, by object id.
  repeated Visual visuals = 7;
}

message GetDiagramTypesRequest {
  repeated string ids = 1;
  repeated string names = 2;
  // Substring filter on the name, for the editor's picker.
  string filter = 3;
  string start_id = 4;
  bool forward = 5;
  int32 count = 6;
}

// ── Levels ────────────────────────────────────────────────────────────────────

message Level {
  string id = 1;
  string zoom_level = 2;
  int32 zoom_min = 3;
  int32 zoom_max = 4;
}

message LevelList {
  repeated Level levels = 1;
}

message GetLevelRequest {
  string zoom_level = 1;
}

message GetLevelResponse {
  bool found = 1;
  Level level = 2;
}

// ── Rights ────────────────────────────────────────────────────────────────────

message Right {
  string object_id = 1;
  // A Keycloak role name or a user name.
  string subject = 2;
  // view, edit, and for a camera view_live, view_archive, ptz, control, export.
  string action = 3;
}

message RightList {
  repeated Right rights = 1;
}

message RightKey {
  string object_id = 1;
  string subject = 2;
  string action = 3;
}

message RightKeyList {
  repeated RightKey keys = 1;
}

enum RightsMode {
  // A node with no rights rows on itself or its ancestors is open to everyone.
  RIGHTS_MODE_OPEN = 0;
  // Only the rows decide; a node with none is invisible.
  RIGHTS_MODE_ENFORCED = 1;
}

message RightsModeResponse {
  RightsMode mode = 1;
}

message SetRightsModeRequest {
  RightsMode mode = 1;
}

// The actions that apply to one node, after inheritance. `camera_id` is set for a camera node so
// the web can map its per-camera checks onto the tree without recomputing the node id.
message NodeRights {
  string object_id = 1;
  string camera_id = 2;
  repeated string actions = 3;
}

message EffectiveRightsRequest {
  Caller caller = 1;
}

message EffectiveRightsResponse {
  RightsMode mode = 1;
  // The admin role has every action without a row; the web does not have to expand the tree.
  bool admin = 2;
  // Only nodes that inherit at least one action. In open mode, a node absent from this list is
  // open; in enforced mode it is invisible.
  repeated NodeRights nodes = 3;
}

message RightActionEntry {
  // The node kind, as the tree says it: space, landmark, camera, diagram, figure, object.
  string node_kind = 1;
  repeated string actions = 2;
}

message RightActionTable {
  repeated RightActionEntry entries = 1;
}

// ── Watch ────────────────────────────────────────────────────────────────────

message WatchBox {
  Box box = 1;
}

message WatchIds {
  repeated string ids = 1;
}

message WatchRequest {
  oneof command {
    // The box to follow; replaces any previous one.
    WatchBox set_box = 1;
    // The exact set of nodes to follow; replaces any previous box or set.
    WatchIds set_ids = 2;
  }
  Caller caller = 4;
  // Stream the values of the followed nodes as well. A call carries exactly one command — a
  // change of scope is a new stream — so this is a property of the scope, not a command.
  bool values = 5;
}

message WatchItem {
  string object_id = 1;
  // Set for a camera node or a picture of one.
  string camera_id = 2;
}

// Square's map protocol, kept by name so the client's handling does not change:
// set_ids2update, set_ids2delete, set_visual_states, on_values_changed.
message WatchMessage {
  string action = 1;
  repeated WatchItem items = 2;
}

// ── Files ─────────────────────────────────────────────────────────────────────

message FileUploadChunk {
  // Set on the first chunk; the rest may leave it empty.
  string mime = 1;
  bytes data = 2;
}

message FileChunk {
  bytes data = 1;
}

message FileRequest {
  string id = 1;
}

message FileInfo {
  string id = 1;
  string mime = 2;
  uint64 size = 3;
  string etag = 4;
}

// ── Demo world ────────────────────────────────────────────────────────────────

message InstallDemoRequest {
  // The world to install, as the demo flag names it: "umd-datacenter" today.
  string demo_key = 1;
}

message DemoReport {
  string demo_key = 1;
  int32 version = 2;
  int32 created = 3;
  int32 updated = 4;
  int32 removed = 5;
  // Cameras the deployment does not have yet. The world is valid without them and a later
  // install places them once they are provisioned.
  repeated string skipped_cameras = 6;
}

message DemoStatus {
  string demo_key = 1;
  bool installed = 2;
  int32 version = 3;
  // How many rows the registry says the installed world owns.
  int32 entities = 4;
}

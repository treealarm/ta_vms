syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

package vms.map;

// The map: VmsMap owns the object tree, geometry, spaces and plans, states, events, values, tracks,
// diagrams, rights and files, and this is how every other service and the web reach it. Reads
// arrive with the milestones that need them: spaces and calibrations came with M2, states, events
// and the Watch stream with M3.
//
// One tree: `objects` holds every node. What a node is, is said by its side rows — a diagram
// (`Diagram`), a drawn figure (`Figure`), a space (`Space`), a camera placement
// (`CameraPlacement`) — never by a type column. Ids are UUID strings; an empty one on input means
// "assign one", and the response carries it back.
//
// Changes to spaces, plans, landmarks, placements and calibrations are announced on the
// `map-config-changed` topic, payload {"object_ids": ["..."], "camera_ids": ["..."]}: the nodes
// that changed, and the cameras whose spatial model did. An empty `camera_ids` means "everything";
// an empty `object_ids` means no node in particular. The event is addressing only — a subscriber
// re-reads what it needs.
//
// The message forms follow Square's producer protocol (tracks.proto there): the same fields and
// the same meaning, without its `Proto` prefix.

service MapService {
  // Objects and their place in the tree. UpdateObjects creates or renames a node and moves it
  // under another parent; the response carries the ids of the nodes that had none.
  rpc UpdateObjects(ObjectList) returns (ObjectList);
  rpc UpdateProperties(ObjectPropertiesList) returns (OperationStatus);
  // How a node is drawn: colour, icon, rotation, caption. Separate from the properties because
  // these are the map's own fields, not arbitrary data the editor happens to keep.
  rpc UpdateVisual(VisualList) returns (OperationStatus);
  // Geometry of the nodes drawn on a canvas: a point, a polyline or a polygon, in the coordinates
  // of the nearest canvas ancestor.
  rpc UpdateFigures(Figures) returns (Figures);
  // Removes the nodes and everything under them, with their states, alarms, events, tracks,
  // rights, geometry and diagrams, in one transaction.
  rpc DeleteObjects(ObjectIds) returns (OperationStatus);

  // ── Maps & plans ── spaces, plans, placements, landmarks and calibrations. A space is a tree
  // node with its own row; where things stand is `geo_objects`; the message section says how.
  rpc ListSpaces(google.protobuf.Empty) returns (ListSpacesResponse);
  rpc GetSpace(SpaceRequest) returns (GetSpaceResponse);
  // Creates the space when id is empty; returns what was stored.
  rpc UpsertSpace(Space) returns (Space);
  // Takes the nested spaces with it, and everything placed in any of them.
  rpc RemoveSpace(SpaceRequest) returns (OperationStatus);
  // Streamed both ways because a plan image does not fit in one message: Dapr service invocation
  // caps a gRPC message at 4 MiB, and the caller's channel cannot be configured past that.
  rpc UploadSpacePlan(stream SpacePlanUploadChunk) returns (Space);
  rpc GetSpacePlanImage(GetSpacePlanImageRequest) returns (stream SpacePlanImageChunk);
  // Re-aligns a plan without sending the image again.
  rpc SetSpacePlanCorners(SetSpacePlanCornersRequest) returns (Space);
  rpc RemoveSpacePlan(SpaceRequest) returns (OperationStatus);
  rpc ListCameraPlacements(google.protobuf.Empty) returns (ListCameraPlacementsResponse);
  // Where the camera really stands, with the space that is in. Aiming goes by it.
  rpc GetReferencePlacement(CameraRequest) returns (GetReferencePlacementResponse);
  rpc UpsertCameraPlacement(CameraPlacement) returns (OperationStatus);
  rpc RemoveCameraPlacement(CameraPlacementRequest) returns (OperationStatus);
  rpc ListLandmarks(SpaceRequest) returns (ListLandmarksResponse);
  rpc UpsertLandmark(Landmark) returns (Landmark);
  rpc RemoveLandmark(LandmarkRequest) returns (OperationStatus);
  rpc GetPtzGeoObservations(CameraRequest) returns (PtzGeoObservations);
  // Replaces the camera's observations whole, like a slave binding's points: one observation
  // changes what every other one is checked against.
  rpc SetPtzGeoObservations(PtzGeoObservations) returns (OperationStatus);
  rpc GetGroundObservations(CameraRequest) returns (GroundObservations);
  // Replaces the camera's ground marks whole, as SetPtzGeoObservations does.
  rpc SetGroundObservations(GroundObservations) returns (OperationStatus);
  // Everything needed to aim one camera through world coordinates, in one round trip.
  rpc GetCameraSpatialModel(CameraRequest) returns (CameraSpatialModelResponse);
  // The models of every camera with ground marks whose reference placement shares geometry with
  // the given space: the cameras whose detections can be shown there.
  rpc ListCameraSpatialModels(SpaceRequest) returns (ListCameraSpatialModelsResponse);

  rpc UpdateStates(ObjectStateList) returns (OperationStatus);
  // The dictionary of state names: description, colour and whether the state is an alarm.
  rpc UpdateStateDescriptions(StateDescriptionList) returns (OperationStatus);

  rpc UpdateEvents(EventList) returns (OperationStatus);

  rpc UpdateValues(ValueList) returns (OperationStatus);
  rpc DeleteValues(ObjectIds) returns (OperationStatus);

  rpc UpdateTracks(TrackPointList) returns (OperationStatus);

  // Mnemoschemes and their types. A type's regions are fractions of its rectangle; a diagram
  // carries its own rectangle on the parent canvas. Both return the ids assigned to new rows.
  rpc UpdateDiagrams(DiagramList) returns (DiagramList);
  rpc DeleteDiagrams(ObjectIds) returns (OperationStatus);
  rpc UpdateDiagramTypes(DiagramTypeList) returns (DiagramTypeList);
  rpc DeleteDiagramTypes(ObjectIds) returns (OperationStatus);

  // Rights are rows on tree nodes, inherited downwards from the moment M3 reads them: a subject
  // is a Keycloak role name or a user name, an action comes from the open set the node kind
  // allows (view, edit, and for a camera view_live, view_archive, ptz, control, export).
  rpc UpdateRights(RightList) returns (OperationStatus);
  rpc DeleteRights(RightKeyList) returns (OperationStatus);

  // Files live in the database, not on a volume: VmsMap is replicable and a local file would tie
  // a row to one instance. Uploads are streamed in chunks; the first one carries the MIME type.
  rpc PutFile(stream FileUploadChunk) returns (FileInfo);
  rpc GetFile(FileRequest) returns (stream FileChunk);
  rpc GetFileInfo(FileRequest) returns (FileInfo);
}

message OperationStatus {
  bool success = 1;
  string message = 2;
}

// ── Objects and properties ─────────────────────────────────────────────────────

message Object {
  string id = 1;
  optional string parent_id = 2;
  // Set on a replica: the node whose states, values and events this one shows. A replica has its
  // own geometry and place, but no states of its own.
  optional string owner_id = 3;
  string name = 4;
}

message ObjectList {
  repeated Object objects = 1;
}

message ObjectIds {
  repeated string ids = 1;
}

message ExtraProperty {
  string prop_name = 1;
  string str_val = 2;
  // How the editor renders the value (VisualTypes in the domain): text, colour, number, map, ...
  string visual_type = 3;
}

message ObjectProperties {
  string id = 1;
  repeated ExtraProperty properties = 2;
}

message ObjectPropertiesList {
  repeated ObjectProperties objects = 1;
  // False merges the sent properties into the existing set, true replaces it. Square's producer
  // protocol had the same switch and its callers rely on merge.
  bool replace_props = 2;
}

message Visual {
  string object_id = 1;
  string color = 2;
  // A small icon; plan pictures and diagram backgrounds are `FileUploadChunk`s instead.
  bytes image = 3;
  int32 image_width = 4;
  int32 image_height = 5;
  // Degrees clockwise from north for a camera (its heading), or from upright for an icon.
  optional double rotation_deg = 6;
  string text = 7;
}

message VisualList {
  repeated Visual visuals = 1;
}

// ── Geometry ───────────────────────────────────────────────────────────────────

message Coordinate {
  double lat = 1;
  double lon = 2;
}

message Geometry {
  repeated Coordinate coord = 1;
  // "Point", "Polygon" or "LineString". A polygon's ring is closed here: the first coordinate is
  // repeated at the end.
  string type = 2;
}

message Figure {
  string id = 1;
  optional string parent_id = 2;
  string name = 3;
  Geometry geometry = 4;
  // A point may be drawn as a circle of this radius, in metres.
  optional double radius = 5;
  // The scale layer this node becomes visible at; empty means always.
  optional string zoom_level = 6;
  repeated ExtraProperty extra_props = 7;
}

message Figures {
  repeated Figure figs = 1;
  // Also record a track point for every figure, as Square's producer protocol did.
  bool add_tracks = 2;
}

message GeoObject {
  optional string id = 1;
  Geometry location = 2;
  optional double radius = 3;
  optional string zoom_level = 4;
}

// ── Maps & plans ──────────────────────────────────────────────────────────────
//
// Where cameras and reference points are. A space is a tree node: its name and parent are the
// object's, its own row says what kind of world it is. A nested plan's footprint is its figure on
// the parent canvas; a plan picture is a table of its own so that listing spaces never reads the
// bytes. Every position is WGS84 plus a height in metres above the floor of its space; a space's
// floor is elevation_m above the ground.
//
// Two spaces share geometry when they are the same space or both have real coordinates: only then
// can a camera be aimed at a point, or calibrated on a landmark, in the other. A plan in made-up
// coordinates stores WGS84 made up around (0, 0).
//
// A camera is one node of the tree; its id is derived from the camera id. The reference placement
// is where it really stands -- aiming, calibration and master/slave go by it. Its other placements
// are pictures: replicas of that node, drawn in another space, with their own geometry but no
// states of their own.

enum SpaceKind {
  // A real map: map tiles underneath, real coordinates. Only ever a root.
  SPACE_KIND_MAP  = 0;
  // A plan drawn on its own picture (a metric grid until it has one). A root, or nested.
  SPACE_KIND_PLAN = 1;
}

// A rectangle, by its south-west and north-east corners.
message GeoBounds {
  Coordinate south_west = 1;
  Coordinate north_east = 2;
}

// Three corners of a plan image in its space. Three are enough for an affine placement --
// position, scale, rotation, skew -- and a fourth would only over-determine it.
message PlanCorners {
  Coordinate top_left    = 1;
  Coordinate top_right   = 2;
  Coordinate bottom_left = 3;
}

// Everything about a plan image except its bytes.
message SpacePlan {
  PlanCorners corners   = 1;
  uint32      width_px  = 2;
  uint32      height_px = 3;
  string      mime      = 4;
  // Changes whenever the image does; also its HTTP ETag.
  string      etag      = 5;
}

message Space {
  // The node's id as well: a space is a node of the tree.
  string    id               = 1;
  // Empty for a root.
  string    parent_id        = 2;
  string    name             = 3;
  SpaceKind kind             = 4;
  // Always true for a map.
  bool      real_coordinates = 5;
  // Order among siblings: the floors of a building, bottom to top.
  int32     ordinal          = 6;
  double    elevation_m      = 7;
  // What the space shows when it is opened.
  GeoBounds view             = 8;
  // Where it lies on its parent, in the parent's coordinates; empty when none is drawn.
  repeated Coordinate footprint = 9;
  // Absent when there is no plan image. Ignored by UpsertSpace: the plan has its own RPCs.
  SpacePlan plan             = 10;
}

message SpaceRequest {
  string space_id = 1;
}

message GetSpaceResponse {
  bool  found = 1;
  Space space = 2;
}

message ListSpacesResponse {
  repeated Space spaces = 1;
}

message SpacePlanUploadHeader {
  string      space_id  = 1;
  PlanCorners corners   = 2;
  uint32      width_px  = 3;
  uint32      height_px = 4;
  string      mime      = 5;
}

// The first message carries the header, every later one a piece of the image.
message SpacePlanUploadChunk {
  oneof part {
    SpacePlanUploadHeader header = 1;
    bytes                 data   = 2;
  }
}

message GetSpacePlanImageRequest {
  string space_id = 1;
  // The ETags the caller holds, unquoted and without W/ (HTTP If-None-Match may list several, or
  // "*"). When one still matches, the stream is the header alone, saying so.
  repeated string if_none_match = 2;
}

message SpacePlanImageHeader {
  string mime         = 1;
  string etag         = 2;
  bool   not_modified = 3;
}

// The first message carries the header, every later one a piece of the image. A space with no
// plan answers NOT_FOUND.
message SpacePlanImageChunk {
  oneof part {
    SpacePlanImageHeader header = 1;
    bytes                 data   = 2;
  }
}

message SetSpacePlanCornersRequest {
  string      space_id = 1;
  PlanCorners corners  = 2;
}

// One camera, by its id in VmsCfg. The map never creates cameras; it places them.
message CameraRequest {
  string camera_id = 1;
}

// A camera drawn in one space. A camera may be drawn in several; the reference placement is where
// it really stands -- aiming, calibration and master/slave go by it -- and the rest are pictures
// of it, replicas of the same node. A camera's first placement becomes its reference.
message CameraPlacement {
  string camera_id    = 1;
  string space_id     = 2;
  bool   is_reference = 3;
  double lat          = 4;
  double lon          = 5;
  double height_m     = 6;
  // Compass bearing of the optical axis: 0 = north, clockwise. It is the same number the map
  // draws a camera icon rotated by.
  double heading_deg  = 7;
  // Only draw the view cone; nothing is aimed through them.
  double hfov_deg     = 8;
  double range_m      = 9;
}

message CameraPlacementRequest {
  string camera_id = 1;
  string space_id  = 2;
}

message ListCameraPlacementsResponse {
  repeated CameraPlacement placements = 1;
}

message GetReferencePlacementResponse {
  bool            found     = 1;
  CameraPlacement placement = 2;
  Space           space     = 3;
}

// A named point with a known position, used to calibrate cameras. Operators never see these.
// A landmark is a tree node too: its name and space are the object's.
message Landmark {
  string id       = 1;
  string space_id = 2;
  string name     = 3;
  double lat      = 4;
  double lon      = 5;
  double height_m = 6;
}

message LandmarkRequest {
  string landmark_id = 1;
}

message ListLandmarksResponse {
  repeated Landmark landmarks = 1;
}

// Where a PTZ camera pointed when it was centred on a landmark, in the camera's own pan/tilt space,
// uninterpreted -- as PtzSlaveBindingPoint does it, and for the same reason.
message PtzGeoObservation {
  string landmark_id = 1;
  float  pan         = 2;
  float  tilt        = 3;
  // The zoom a slave uses for an object at this landmark's distance, when the operator recorded
  // one -- in the camera's own zoom units, like pan and tilt. Recorded apart from them: pan and
  // tilt are best taken zoomed right in on the landmark, the framing zoom is how a person there
  // should look.
  optional float zoom = 4;
}

message PtzGeoObservations {
  string camera_id = 1;
  repeated PtzGeoObservation observations = 2;
}

// An observation together with where its landmark is.
message GeoObservation {
  string landmark_id   = 1;
  string landmark_name = 2;
  double lat           = 3;
  double lon           = 4;
  // Above the ground: the landmark's space elevation plus its own height.
  double height_above_ground_m = 5;
  float  pan           = 6;
  float  tilt          = 7;
  optional float zoom  = 8;  // see PtzGeoObservation.zoom
}

// Where a landmark stands on the ground in a fixed camera's picture, normalised to 0..1 across the
// frame (0, 0 top left) -- the convention of detection boxes. Its foot is marked, not its height.
message GroundObservation {
  string landmark_id = 1;
  float  x           = 2;
  float  y           = 3;
}

message GroundObservations {
  string camera_id = 1;
  repeated GroundObservation observations = 2;
}

// A ground mark together with where its landmark stands.
message GeoGroundObservation {
  string landmark_id   = 1;
  string landmark_name = 2;
  double lat           = 3;
  double lon           = 4;
  // The elevation of the landmark's space: an image-to-ground fit maps one floor, so marks on
  // different floors cannot be fitted together.
  double floor_elevation_m = 5;
  float  x             = 6;
  float  y             = 7;
}

message CameraSpatialModelResponse {
  // False when the camera has no reference placement. Without one nothing can be aimed through it.
  bool            found     = 1;
  CameraPlacement placement = 2;
  // The space the camera really stands in.
  Space           space     = 3;
  // Only observations of landmarks in a space that shares geometry with the camera's: one taken
  // before the camera moved to an unrelated plan describes a place it can no longer see.
  repeated GeoObservation observations = 4;
  // Ground marks, filtered by the same rule.
  repeated GeoGroundObservation ground_observations = 5;
}

message ListCameraSpatialModelsResponse {
  repeated CameraSpatialModelResponse models = 1;
}

// ── States and alarms ─────────────────────────────────────────────────────────

message ObjectState {
  string id = 1;
  // The full current set for the object, not a delta: the write replaces what is stored.
  repeated string states = 2;
  google.protobuf.Timestamp timestamp = 3;
}

message ObjectStateList {
  repeated ObjectState states = 1;
}

message StateDescription {
  string id = 1;
  string state = 2;
  string state_descr = 3;
  string state_color = 4;
  // A state with this flag raised puts the object — and, through children_alarms, all its
  // ancestors — into alarm.
  bool alarm = 5;
}

message StateDescriptionList {
  repeated StateDescription descriptions = 1;
}

// ── Events ────────────────────────────────────────────────────────────────────

message Event {
  google.protobuf.Timestamp timestamp = 1;
  // Empty means "assign one"; the stored id is not returned by this call.
  string id = 2;
  string object_id = 3;
  string event_name = 4;
  int32 event_priority = 5;
  string param0 = 6;
  string param1 = 7;
  repeated ExtraProperty extra_props = 8;
}

message EventList {
  repeated Event events = 1;
}

// ── Values and tracks ─────────────────────────────────────────────────────────

message ValueType {
  oneof value {
    double double_value = 1;
    int32 int_value = 2;
    string string_value = 3;
  }
}

message Value {
  string id = 1;
  // The object this value belongs to; a replica never owns values.
  string owner_id = 2;
  string name = 3;
  ValueType value = 4;
}

message ValueList {
  repeated Value values = 1;
}

message TrackPoint {
  string id = 1;
  GeoObject figure = 2;
  google.protobuf.Timestamp timestamp = 3;
  repeated ExtraProperty extra_props = 4;
}

message TrackPointList {
  repeated TrackPoint tracks = 1;
}

// ── Diagrams ──────────────────────────────────────────────────────────────────

message DiagramCoordinate {
  double top = 1;
  double left = 2;
  double width = 3;
  double height = 4;
  // Degrees clockwise; absent means upright. The browser rotates the image by it.
  optional double rotation = 5;
}

message Diagram {
  string id = 1;
  DiagramCoordinate geometry = 2;
  // The region of the parent's diagram type this node sits in. A node with a region has no
  // geometry of its own.
  string region_id = 3;
  // The id of a DiagramType, not its name: a rename must not orphan the diagrams of a type.
  string dgr_type = 4;
  // A row of `files`, not a path on a volume (see PutFile).
  string file_id = 5;
}

message DiagramList {
  repeated Diagram diagrams = 1;
}

message DiagramTypeRegion {
  string region_key = 1;
  DiagramCoordinate geometry = 2;
  // Free-form styling of the region, as the editor left it.
  map<string, string> styles = 3;
}

message DiagramType {
  string id = 1;
  string name = 2;
  // Background image: a row of `files`.
  string file_id = 3;
  repeated DiagramTypeRegion regions = 4;
}

message DiagramTypeList {
  repeated DiagramType diagram_types = 1;
}

// ── Rights ────────────────────────────────────────────────────────────────────

message Right {
  string object_id = 1;
  // A Keycloak role name or a user name.
  string subject = 2;
  // view, edit, and for a camera view_live, view_archive, ptz, control, export.
  string action = 3;
}

message RightList {
  repeated Right rights = 1;
}

message RightKey {
  string object_id = 1;
  string subject = 2;
  string action = 3;
}

message RightKeyList {
  repeated RightKey keys = 1;
}

// ── Files ─────────────────────────────────────────────────────────────────────

message FileUploadChunk {
  // Set on the first chunk; the rest may leave it empty.
  string mime = 1;
  bytes data = 2;
}

message FileChunk {
  bytes data = 1;
}

message FileRequest {
  string id = 1;
}

message FileInfo {
  string id = 1;
  string mime = 2;
  uint64 size = 3;
  string etag = 4;
}

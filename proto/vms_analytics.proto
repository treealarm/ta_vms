syntax = "proto3";

import "google/protobuf/timestamp.proto";

package vms.analytics;

// VmsAnalytics' own outward-facing API (internal to ta_vms) — not to be confused with
// the vendored analytics.proto contract copied from the video_a repository, which VmsAnalytics
// consumes as a client (see dotnet/VmsAnalytics/proto/analytics.proto).
service VmsAnalyticsService {
  rpc ListDetections(ListDetectionsRequest) returns (ListDetectionsResponse);
  // Crop JPEG of a detection, read from the storage volume it was saved to.
  rpc GetDetectionCrop(GetDetectionCropRequest) returns (GetDetectionCropResponse);
  // Multi-camera forensic search by appearance similarity. Exactly one probe must be set.
  rpc SearchSimilarDetections(SearchSimilarDetectionsRequest) returns (SearchSimilarDetectionsResponse);
  // Debug: recent detection events from the in-memory ring buffer (mirrors VmsFs GetFsActivity) —
  // includes bbox and, when the watch has attach_debug_crops enabled, a JPEG of the object.
  rpc GetAnalyticsActivity(GetAnalyticsActivityRequest) returns (GetAnalyticsActivityResponse);
  // Live detection stream for the "bbox over live video" overlay. Emits every above-threshold
  // detection as it arrives (armed or not, debounced or not) so the overlay tracks smoothly.
  // crop_jpeg is never populated on this stream. Ends when the caller cancels. An empty camera_id
  // means "all cameras" — the frontend multiplexes one stream for the whole monitor.
  rpc StreamCameraDetections(StreamCameraDetectionsRequest) returns (stream AnalyticsActivityEntry);
  // Scene Description the camera produced itself, already parsed and normalized by VmsOnvif (see
  // PushMetadataDocuments in onvif.proto for the raw end of that path). Fed into the same live
  // overlay as the CV pipeline. Batched by the caller so a chatty camera costs a few RPCs per
  // second rather than one per frame.
  rpc PushOnvifDetections(OnvifDetectionBatch) returns (PushOnvifDetectionsResponse);
  // Live ONVIF events (motion, tamper, line/field crossings) forwarded by VmsOnvif from its
  // pull-point subscriptions. Cameras whose analytics only does cell motion have no geometry to
  // draw — an event is the only thing they can say, so the monitor shows it as text instead.
  rpc PushOnvifEvents(OnvifEventBatch) returns (PushOnvifEventsResponse);
  // The events above, fanned out to the monitor. Same shape as StreamCameraDetections: an empty
  // camera_id means "all cameras", and the frontend multiplexes one stream for the whole grid.
  rpc StreamCameraEvents(StreamCameraEventsRequest) returns (stream LiveEvent);
  // Stateless background-motion estimate between two JPEG snapshots (proxied to video_a).
  rpc EstimateGlobalMotion(EstimateGlobalMotionRequest) returns (EstimateGlobalMotionResponse);
}

// The coarse taxonomy every box is drawn as, shared by both producers. The CV detector emits the
// first four; ANIMAL only ever comes from a camera's own analytics (it is part of ONVIF's
// tt:ClassType, which video_a has no model for). Finer classes a camera may report — "Truck",
// "Bicycle", "Bag" — are free-form in ONVIF and cannot be enumerated; they fold into the nearest
// kind here and keep their own wording in `label`.
enum DetectionKind {
  DETECTION_KIND_UNSPECIFIED = 0;
  PERSON = 1;
  FACE = 2;
  VEHICLE = 3;
  LICENSE_PLATE = 4;
  ANIMAL = 5;
}

message Detection {
  int64 id = 2;                // detections.id — addresses the crop via GetDetectionCrop
  string camera_id = 1;
  int64 track_id = 3;
  DetectionKind kind = 4;
  float confidence = 5;
  google.protobuf.Timestamp detected_at = 6;
  string event_id = 7;         // retention_events.event_id — the GROUP this detection belongs to
  optional string plate_text = 8;
  bool has_crop = 9;
  string event_uuid = 10;      // retention_events.event_uuid — the specific episode it triggered
  optional string object_id = 11;
}

message ListDetectionsRequest {
  optional string camera_id = 1;
  optional google.protobuf.Timestamp from_ts = 2;
  optional google.protobuf.Timestamp to_ts = 3;
  uint32 limit = 4;
  optional string plate_text = 5;
  optional string event_id = 6;
  optional string event_uuid = 7;
  // Restrict the result to these cameras (empty = no restriction). Distinct from camera_id, which
  // selects exactly one: this is the caller's visible set, pushed down so paging stays correct for
  // a user who may see only a few of many cameras.
  repeated string camera_ids = 8;
}

message ListDetectionsResponse {
  repeated Detection detections = 1;
}

message GetDetectionCropRequest {
  int64 id = 1;
}

message GetDetectionCropResponse {
  bytes jpeg = 1;  // empty when the detection has no saved crop
  // Owning camera, so the gateway can apply per-camera permissions without a second lookup.
  // Empty when the detection id is unknown.
  string camera_id = 2;
}

message DetectionIdProbe {
  int64 detection_id = 1;
}

message ArchiveTrackProbe {
  string camera_id = 1;
  int64 track_id = 2;
  google.protobuf.Timestamp ts = 3;
  optional DetectionKind kind = 4;
}

message ImageProbe {
  bytes jpeg = 1;
  DetectionKind kind = 2;
  optional BoundingBox bbox = 3;
  bool detect_first = 4;
}

message SearchSimilarDetectionsRequest {
  oneof probe {
    DetectionIdProbe detection_probe = 1;
    ArchiveTrackProbe archive_probe = 2;
    ImageProbe image_probe = 3;
  }
  google.protobuf.Timestamp from_ts = 10;
  google.protobuf.Timestamp to_ts = 11;
  optional float min_score = 12;
  uint32 limit = 13;
  repeated string camera_ids = 14;
}

message SimilarDetectionHit {
  Detection detection = 1;
  float score = 2;
}

message SearchSimilarDetectionsResponse {
  repeated SimilarDetectionHit hits = 1;
}

message BoundingBox {
  float x = 1;
  float y = 2;
  float width = 3;
  float height = 4;
}

message AnalyticsActivityEntry {
  string camera_id = 1;
  int64 track_id = 2;
  DetectionKind kind = 3;
  float confidence = 4;
  BoundingBox bbox = 5;
  google.protobuf.Timestamp detected_at = 6;
  optional string plate_text = 7;
  bytes crop_jpeg = 8;    // empty unless the watch has attach_debug_crops enabled
  bool persisted = 9;     // false = dropped by debounce/armed check, seen but not stored
  // Re-identification label of the physical object, when known for this track (populated on the
  // live overlay stream once re-id has resolved the track). Absent for unarmed/unresolved tracks.
  optional string object_id = 10;
  // Where the box came from: "cv" (video_a detector) or "onvif" (the camera's own Scene
  // Description). The two number their tracks independently, so the overlay has to key on the
  // source as well or a camera running both would have them overwrite each other.
  string source = 11;
  // The producer's own word for the class, when it says more than `kind` does — "Truck" under
  // VEHICLE, "Bag" under UNSPECIFIED. ONVIF lets cameras report free-form classes alongside its
  // five-value enum, and folding those into the enum would throw the detail away.
  optional string label = 12;
}

// One object the camera reported, in the overlay's coordinate space (0..1, origin top-left) —
// the same geometry the CV detector emits, so both feed one overlay unchanged.
message OnvifDetection {
  string camera_id = 1;
  int64 track_id = 2;
  DetectionKind kind = 3;
  float confidence = 4;
  BoundingBox bbox = 5;
  // When the document arrived, not the camera's own UtcTime: camera clocks are frequently hours
  // off, and the overlay only cares about "now".
  google.protobuf.Timestamp detected_at = 6;
  // Set when the camera ran ANPR on the object itself (tt:LicensePlateInfo/tt:PlateNumber).
  optional string plate_text = 7;
  // The camera's own word for the class when it is narrower than `kind` (tt:OtherTypes).
  optional string label = 8;
  // Which stream the metadata track belonged to. The live overlay ignores it (it keys boxes by
  // camera), but the archive cannot: clips are split per stream, and main/sub must not be crossed.
  string stream_name = 9;
}

message OnvifDetectionBatch {
  repeated OnvifDetection detections = 1;
}

message PushOnvifDetectionsResponse {}

// One thing the camera announced about itself, with no geometry attached.
message LiveEvent {
  string camera_id = 1;
  // Full ONVIF topic, e.g. "tns1:RuleEngine/CellMotionDetector/Motion" — kept verbatim so an
  // operator can match it against the alarm filters, which are written against the same strings.
  string topic = 2;
  // Short human-readable name taken from the last topic segment ("Motion", "Tamper").
  string label = 3;
  // State events carry a boolean: true when the condition started, false when it cleared. Cameras
  // send both edges, and showing the clear is what lets a banner disappear on its own.
  bool active = 4;
  google.protobuf.Timestamp received_at = 5;
  // Whether this event matched one of the camera's alarm filters -- what the operator declared
  // worth noticing. Every event the camera sends reaches this stream now; `matched` is how the
  // monitor tells "the operator asked about this" from "the camera also says this".
  bool matched = 6;
}

message OnvifEventBatch {
  repeated LiveEvent events = 1;
}

message PushOnvifEventsResponse {}

message StreamCameraEventsRequest {
  string camera_id = 1;
}

message GetAnalyticsActivityRequest {
  uint32 limit = 1;
}

message StreamCameraDetectionsRequest {
  string camera_id = 1;
}

message GetAnalyticsActivityResponse {
  repeated AnalyticsActivityEntry events = 1;
}

message EstimateGlobalMotionRequest {
  bytes before_jpeg = 1;
  bytes after_jpeg = 2;
}

message EstimateGlobalMotionResponse {
  bool success = 1;
  string error = 2;
  float dx = 3;
  float dy = 4;
  float rotation = 5;
  float confidence = 6;
}

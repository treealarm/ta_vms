syntax = "proto3";

import "google/protobuf/timestamp.proto";

package vms.analytics;

// VmsAnalytics' own outward-facing API (internal to vms_rec) — not to be confused with
// the vendored analytics.proto contract copied from the video_a repository, which VmsAnalytics
// consumes as a client (see web_vms/VmsAnalytics/proto/analytics.proto).
service VmsAnalyticsService {
  rpc ListDetections(ListDetectionsRequest) returns (ListDetectionsResponse);
  // Debug: recent detection events from the in-memory ring buffer (mirrors VmsFs GetFsActivity) —
  // includes bbox and, when the watch has attach_debug_crops enabled, a JPEG of the object.
  rpc GetAnalyticsActivity(GetAnalyticsActivityRequest) returns (GetAnalyticsActivityResponse);
}

enum DetectionKind {
  DETECTION_KIND_UNSPECIFIED = 0;
  PERSON = 1;
  FACE = 2;
  VEHICLE = 3;
  LICENSE_PLATE = 4;
}

message Detection {
  string camera_id = 1;
  int64 track_id = 3;
  DetectionKind kind = 4;
  float confidence = 5;
  google.protobuf.Timestamp detected_at = 6;
  string crop_ref = 7;
  optional string plate_text = 8;
}

message ListDetectionsRequest {
  string camera_id = 1;
  optional google.protobuf.Timestamp from_ts = 2;
  optional google.protobuf.Timestamp to_ts = 3;
  uint32 limit = 4;
  optional string plate_text = 5;
}

message ListDetectionsResponse {
  repeated Detection detections = 1;
}

message BoundingBox {
  float x = 1;
  float y = 2;
  float width = 3;
  float height = 4;
}

message AnalyticsActivityEntry {
  string camera_id = 1;
  int64 track_id = 2;
  DetectionKind kind = 3;
  float confidence = 4;
  BoundingBox bbox = 5;
  google.protobuf.Timestamp detected_at = 6;
  optional string plate_text = 7;
  bytes crop_jpeg = 8;    // empty unless the watch has attach_debug_crops enabled
  bool persisted = 9;     // false = dropped by debounce/armed check, seen but not stored
}

message GetAnalyticsActivityRequest {
  uint32 limit = 1;
}

message GetAnalyticsActivityResponse {
  repeated AnalyticsActivityEntry events = 1;
}

syntax = "proto3";

import "google/protobuf/timestamp.proto";

package vms.fs;

service FsService {
  rpc IngestClip(IngestClipRequest) returns (OperationStatus);
  rpc RetainEvent(RetainEventRequest) returns (OperationStatus);
  rpc GetRecordings(GetRecordingsFromToRequest) returns (GetRecordingsResponse);
  rpc GetRecordingsAround(GetRecordingsAroundRequest) returns (GetRecordingsResponse);
  rpc GetRecordingRanges(GetRecordingRangesRequest) returns (GetRecordingRangesResponse);
  rpc GetRecordingCoverage(GetRecordingCoverageRequest) returns (GetRecordingCoverageResponse);
  rpc GetRecordingTimeline(GetRecordingTimelineRequest) returns (GetRecordingTimelineResponse);
  rpc GetClipsFrom(GetClipsFromRequest) returns (GetRecordingsResponse);
  rpc GetCameraRetentionStatus(GetCameraRetentionStatusRequest) returns (GetCameraRetentionStatusResponse);
  rpc ListRetentionEvents(ListRetentionEventsRequest) returns (ListRetentionEventsResponse);

  // ── Source liveness ─────────────────────────────────────────────────────────
  // media_server reports current state; VmsFs derives outage intervals from the transitions and
  // from silence. Deliberately not intervals: "no signal" then covers both a dead camera and a dead
  // media server, and nothing can be left half-open by a crash.
  rpc ReportSourceLiveness(ReportSourceLivenessRequest) returns (OperationStatus);
  rpc ListSourceOutages(ListSourceOutagesRequest) returns (ListSourceOutagesResponse);

  rpc StatArchiveTs(StatArchiveTsRequest) returns (StatArchiveTsResponse);
  rpc ReadArchiveTs(ReadArchiveTsRequest) returns (stream ReadArchiveTsChunk);

  // ── Camera-side import exports ──────────────────────────────────────────────
  // mp4 files produced by an edge import with export_to_file. They are deliberately NOT clips:
  // adding them to the clips table would double the camera's timeline coverage and hand them to
  // ClipCleaner. There is no database row at all — the listing is a directory walk, which also
  // means an export survives a media_server restart that drops the in-memory job registry.
  rpc ListExportFiles(ListExportFilesRequest) returns (ListExportFilesResponse);
  rpc StatExportFile(ExportFileRequest) returns (StatExportFileResponse);
  rpc ReadExportFile(ReadExportFileRequest) returns (stream ReadArchiveTsChunk);
  rpc DeleteExportFile(ExportFileRequest) returns (DeleteExportFileResponse);

  rpc GetRecordingByUid(GetRecordingByUidRequest) returns (GetRecordingByUidResponse);

  rpc GetCameraStorage(GetCameraStorageRequest) returns (GetCameraStorageResponse);

  rpc GetClipsForEvent(GetClipsForEventRequest) returns (GetRecordingsResponse);

  rpc GetFsActivity(GetFsActivityRequest) returns (GetFsActivityResponse);

  // Batch fmp4 fragment index for a set of clips, so a manifest is built with one call instead of
  // several file-range reads per clip. VmsFs reads/parses locally and caches the result.
  rpc GetClipIndexes(GetClipIndexesRequest) returns (GetClipIndexesResponse);
}

message OperationStatus {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    SUCCESS = 1;
    RETRYABLE_FAILURE = 2;
    PERMANENT_FAILURE = 3;
  }
  Status status = 1;
  string message = 2;
  string clip_uid = 3;
  // RetainEvent only: the episode (retention_events.event_uuid) this call extended or opened.
  // VmsFs owns episode identity and generates this — the caller never supplies it.
  string event_uuid = 4;
}

message Recording {
  string camera_id  = 1;
  string file_path  = 2;
  google.protobuf.Timestamp start_ts = 3;
  optional google.protobuf.Timestamp end_ts = 4;
  uint64 size_bytes = 5;
  string clip_uid   = 6;
  string storage_id = 7;
  string stream_name = 8;
}

message IngestClipRequest {
  Recording clip = 1;
  // Set by camera-side (edge) import: the operator asked for this range explicitly, so it must be
  // kept regardless of the camera's recording policy. Normal live ingest leaves it unset and lets
  // VmsFs derive retention from the policy and retention events.
  bool force_retained = 2;
}

message RetainEventRequest {
  // Group label supplied by the caller (analytics/onvif/manual). While the latest episode for
  // (event_id, camera_id) is still open it is extended; once closed a new episode is opened under
  // the same event_id. The caller never supplies event_uuid — VmsFs generates it and returns it.
  string event_id = 1;
  string camera_id = 2;
  google.protobuf.Timestamp alarm_start_ts = 3;
  optional google.protobuf.Timestamp alarm_end_ts = 4;
  uint32 timeout_seconds = 7;
  optional string stream_name = 5;
  // Re-identification label of the physical object (analytics only); stored on the episode row.
  optional string object_id = 6;
}

message GetRecordingsFromToRequest {
  string camera_id = 1;
  optional google.protobuf.Timestamp from_ts = 2;
  optional google.protobuf.Timestamp to_ts = 3;
  uint32 limit = 4;
  optional string stream_name = 5;
}

message GetRecordingsAroundRequest {
  string camera_id = 1;
  google.protobuf.Timestamp timestamp = 2;
  uint32 limit = 3;
  optional string stream_name = 4;
}

message GetRecordingRangesRequest {
  string camera_id = 1;
  optional google.protobuf.Timestamp from_ts = 2;
  optional google.protobuf.Timestamp to_ts = 3;
  optional google.protobuf.Timestamp timestamp = 4;
  uint32 limit = 5;
  uint32 gap_tolerance_ms = 6;
  optional string stream_name = 7;
}

message GetClipsFromRequest {
  string camera_id = 1;
  string start_clip_uid = 2;
  uint32 count = 3;
  optional string stream_name = 4;
}

message GetRecordingsResponse {
  repeated Recording recordings = 1;
}

message RecordingRange {
  repeated Recording recordings = 1;
}

message GetRecordingRangesResponse {
  repeated RecordingRange ranges = 1;
}

// Archive coverage as bare wall-clock intervals, for drawing a timeline.
//
// Deliberately NOT GetRecordingRanges: that returns whole clips (a day of continuous recording is
// 1440 of them, ~300 KB of JSON per camera) and caps each range at 3 minutes regardless of
// continuity, so the client would have to re-merge them anyway. Here the merge happens next to the
// data and only the resulting boundaries travel.
message GetRecordingTimelineRequest {
  repeated string camera_ids = 1;
  optional string stream_name = 2;
  google.protobuf.Timestamp from_ts = 3;
  google.protobuf.Timestamp to_ts = 4;
  // Gaps at or below this are treated as continuous. Callers pass the wall time of one screen
  // pixel, so the response size is bounded by the timeline's width rather than by the zoom level.
  uint32 min_gap_ms = 5;
}

message RecordingInterval {
  google.protobuf.Timestamp start_ts = 1;
  google.protobuf.Timestamp end_ts = 2;
}

message RecordingTimelineTrack {
  string camera_id = 1;
  repeated RecordingInterval intervals = 2;
}

message GetRecordingTimelineResponse {
  repeated RecordingTimelineTrack tracks = 1;
}

enum RecordingCoverageGranularity {
  RECORDING_COVERAGE_YEAR = 0;
  RECORDING_COVERAGE_MONTH = 1;
  RECORDING_COVERAGE_DAY = 2;
}

message GetRecordingCoverageRequest {
  string camera_id = 1;
  RecordingCoverageGranularity granularity = 2;
  optional google.protobuf.Timestamp from_ts = 3;
  optional google.protobuf.Timestamp to_ts = 4;
}

message GetRecordingCoverageResponse {
  // "YYYY", "YYYY-MM" or "YYYY-MM-DD" (UTC), depending on requested granularity.
  repeated string buckets = 1;
}

message GetCameraRetentionStatusRequest {
  string camera_id = 1;
}

message GetCameraRetentionStatusResponse {
  bool active_retention_window = 1;                // any active window on the camera
  bool all_streams_retained = 2;                   // an active window with no specific stream => all streams
  repeated string retained_streams = 3;            // specific stream_names with an active window
}

message RetentionEventRow {
  // event_id is the GROUP label; event_uuid is the specific episode (one open->close cycle).
  string event_id = 1;
  string camera_id = 2;
  google.protobuf.Timestamp alarm_start_ts = 3;
  optional google.protobuf.Timestamp alarm_end_ts = 4;
  optional string stream_name = 5;
  string event_uuid = 6;
  optional string object_id = 7;
}

message ListRetentionEventsRequest {
  uint32 limit = 1;
  optional google.protobuf.Timestamp before_alarm_start_ts = 2;
  // When non-empty, return ALL episodes for these event_id groups (ignoring limit/before) so the
  // gateway can complete groups whose episodes straddle the paged window.
  repeated string event_ids = 3;
  // Narrow to one camera. Without it, filtering had to happen client-side after paging, which
  // silently showed a subset of one page instead of that camera's newest events.
  optional string camera_id = 4;
  // Lower bound, so a caller can ask for a window rather than only "everything before X".
  optional google.protobuf.Timestamp from_alarm_start_ts = 5;
}

message ListRetentionEventsResponse {
  repeated RetentionEventRow events = 1;
  bool has_more = 2;
  optional google.protobuf.Timestamp next_before_alarm_start_ts = 3;
}

message GetClipsForEventRequest {
  // Clips are fetched for a specific episode (one row the user selected), not the whole group.
  string event_uuid = 1;
}

message GetClipIndexesRequest {
  repeated string clip_uids = 1;
}

message ClipFragment {
  uint64 offset   = 1;
  uint64 size     = 2;
  double duration = 3;
}

message ClipIndex {
  string clip_uid = 1;
  bool   found    = 2;   // false if the clip is missing or not parseable as fmp4
  uint64 init_size = 3;  // byte length of the ftyp+moov init section (EXT-X-MAP)
  repeated ClipFragment fragments = 4;
}

message GetClipIndexesResponse {
  repeated ClipIndex indexes = 1;
}

message StatArchiveTsRequest {
  string clip_uid = 1;
}

message StatArchiveTsResponse {
  bool exists = 1;
  uint64 size_bytes = 2;
  string message = 3;
  string file_path = 4;
}

message ReadArchiveTsRequest {
  string clip_uid = 1;
  uint64 offset = 2;
  uint64 length = 3;
}

message ReadArchiveTsChunk {
  bytes data = 1;
}

// Export files are addressed by their path relative to VMS_EXPORT_BASE_PATH: "<camera_id>/<job_id>.mp4".
// The camera id is part of the path, which is what lets the gateway authorize a download without
// any stored state.
message ExportFileRequest {
  string rel_path = 1;
}

message ExportFileInfo {
  string rel_path    = 1;
  string camera_id   = 2;
  uint64 size_bytes  = 3;
  google.protobuf.Timestamp created_ts = 4;
}

message ListExportFilesRequest {
  // Empty lists exports for every camera on this node.
  string camera_id = 1;
}

message ListExportFilesResponse {
  repeated ExportFileInfo files = 1;
}

message StatExportFileResponse {
  bool   exists     = 1;
  uint64 size_bytes = 2;
  string message    = 3;
}

message ReadExportFileRequest {
  string rel_path = 1;
  uint64 offset   = 2;
  uint64 length   = 3;
}

message DeleteExportFileResponse {
  bool   success = 1;
  string message = 2;
}

message StorageInfo {
  string storage_id = 1;
  string root_path  = 2;
}

message GetCameraStorageRequest {
  string camera_id = 1;
}

message GetCameraStorageResponse {
  optional StorageInfo storage = 1;
  repeated StorageInfo storages = 2;
}

message GetRecordingByUidRequest {
  repeated string clip_uids = 1;
}

message GetRecordingByUidResponse {
  repeated Recording recordings = 1;
}

message FsFileEvent {
  string clip_uid    = 1;
  string file_path   = 2;
  string camera_id   = 3;
  string stream_name = 4;
  bool   retained    = 5;
  int64  size_bytes  = 6;
  google.protobuf.Timestamp occurred_at = 7;
  string event_type  = 8;
  optional google.protobuf.Timestamp end_ts = 9;
}

message GetFsActivityRequest {
  uint32 limit = 1;
}

message GetFsActivityResponse {
  repeated FsFileEvent events = 1;
}


// One stream's current state. Batched per node: one call instead of one per stream.
message SourceLiveness {
  string camera_id   = 1;
  string stream_name = 2;
  bool   alive       = 3;
  // Last packet actually received. THE boundary of an outage — the report time is never used for
  // that, or every interval would be off by up to one heartbeat period at each end.
  optional google.protobuf.Timestamp last_frame_ts = 4;
  // First packet after the source came back. Where an open outage ends — last_frame_ts cannot say,
  // because it keeps advancing and by report time points at the newest packet, which would stretch
  // the recorded gap by up to one heartbeat period.
  optional google.protobuf.Timestamp recovered_frame_ts = 6;
  // Whether recording was supposed to be running at this moment (recording_policy != off, which
  // already accounts for schedules and overrides). A heartbeat gap with this set is an archive gap;
  // without it, merely a camera that was offline while nothing was being recorded anyway.
  bool   recording_expected = 5;
}

message ReportSourceLivenessRequest {
  string server_id = 1;
  repeated SourceLiveness streams = 2;
}

// One recorded interval of source unavailability. ended_ts unset = happening right now.
// Only streams that were supposed to be recording get one: an outage with recording off costs no
// footage, so it is never written.
message SourceOutageRow {
  string outage_uid  = 1;
  string camera_id   = 2;
  string stream_name = 3;
  google.protobuf.Timestamp started_ts = 4;
  optional google.protobuf.Timestamp ended_ts = 5;
  string cause = 6;                 // link_lost | server_down
  string state = 7;                 // open | filling | filled | exhausted | partial | held | ignored
  int64  filled_ms = 8;             // display-only cache; clips are the source of truth
  int32  attempts  = 9;
  string message   = 10;
}

message ListSourceOutagesRequest {
  optional string camera_id = 1;
  // Window overlap, not containment: an outage that started before `from` and is still open must
  // show up, otherwise the one gap the operator cares about is the one they cannot see.
  optional google.protobuf.Timestamp from_ts = 2;
  optional google.protobuf.Timestamp to_ts = 3;
  uint32 limit = 4;
}

message ListSourceOutagesResponse {
  repeated SourceOutageRow outages = 1;
}

syntax = "proto3";

import "google/protobuf/timestamp.proto";

package vms.fs;

service FsService {
  rpc IngestClip(IngestClipRequest) returns (OperationStatus);
  rpc RetainEvent(RetainEventRequest) returns (OperationStatus);
  rpc GetRecordings(GetRecordingsFromToRequest) returns (GetRecordingsResponse);
  rpc GetRecordingsAround(GetRecordingsAroundRequest) returns (GetRecordingsResponse);
  rpc GetRecordingRanges(GetRecordingRangesRequest) returns (GetRecordingRangesResponse);
  rpc GetClipsFrom(GetClipsFromRequest) returns (GetRecordingsResponse);
  rpc GetCameraRetentionStatus(GetCameraRetentionStatusRequest) returns (GetCameraRetentionStatusResponse);
  rpc ListRetentionEvents(ListRetentionEventsRequest) returns (ListRetentionEventsResponse);

  rpc StatArchiveTs(StatArchiveTsRequest) returns (StatArchiveTsResponse);
  rpc ReadArchiveTs(ReadArchiveTsRequest) returns (stream ReadArchiveTsChunk);

  rpc GetRecordingByUid(GetRecordingByUidRequest) returns (GetRecordingByUidResponse);

  rpc GetCameraStorage(GetCameraStorageRequest) returns (GetCameraStorageResponse);

  rpc GetClipsForEvent(GetClipsForEventRequest) returns (GetRecordingsResponse);
}

message OperationStatus {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    SUCCESS = 1;
    RETRYABLE_FAILURE = 2;
    PERMANENT_FAILURE = 3;
  }
  Status status = 1;
  string message = 2;
  string clip_uid = 3;
}

message Recording {
  string camera_id  = 1;
  string file_path  = 2;
  google.protobuf.Timestamp start_ts = 3;
  optional google.protobuf.Timestamp end_ts = 4;
  uint64 size_bytes = 5;
  string clip_uid   = 6;
  string storage_id = 7;
  string stream_name = 8;
}

message IngestClipRequest {
  Recording clip = 1;
}

message RetainEventRequest {
  string event_id = 1;
  string camera_id = 2;
  google.protobuf.Timestamp alarm_start_ts = 3;
  optional google.protobuf.Timestamp alarm_end_ts = 4;
  uint32 timeout_seconds = 7;
  optional string stream_name = 5;
}

message GetRecordingsFromToRequest {
  string camera_id = 1;
  optional google.protobuf.Timestamp from_ts = 2;
  optional google.protobuf.Timestamp to_ts = 3;
  uint32 limit = 4;
  optional string stream_name = 5;
}

message GetRecordingsAroundRequest {
  string camera_id = 1;
  google.protobuf.Timestamp timestamp = 2;
  uint32 limit = 3;
  optional string stream_name = 4;
}

message GetRecordingRangesRequest {
  string camera_id = 1;
  optional google.protobuf.Timestamp from_ts = 2;
  optional google.protobuf.Timestamp to_ts = 3;
  optional google.protobuf.Timestamp timestamp = 4;
  uint32 limit = 5;
  uint32 gap_tolerance_ms = 6;
  optional string stream_name = 7;
}

message GetClipsFromRequest {
  string camera_id = 1;
  string start_clip_uid = 2;
  uint32 count = 3;
  optional string stream_name = 4;
}

message GetRecordingsResponse {
  repeated Recording recordings = 1;
}

message RecordingRange {
  repeated Recording recordings = 1;
}

message GetRecordingRangesResponse {
  repeated RecordingRange ranges = 1;
}

message GetCameraRetentionStatusRequest {
  string camera_id = 1;
}

message GetCameraRetentionStatusResponse {
  bool active_retention_window = 1;
}

message RetentionEventRow {
  string event_id = 1;
  string camera_id = 2;
  google.protobuf.Timestamp alarm_start_ts = 3;
  optional google.protobuf.Timestamp alarm_end_ts = 4;
  optional string stream_name = 5;
}

message ListRetentionEventsRequest {
  uint32 limit = 1;
  optional google.protobuf.Timestamp before_alarm_start_ts = 2;
}

message ListRetentionEventsResponse {
  repeated RetentionEventRow events = 1;
  bool has_more = 2;
  optional google.protobuf.Timestamp next_before_alarm_start_ts = 3;
}

message GetClipsForEventRequest {
  string event_id = 1;
}

message StatArchiveTsRequest {
  string clip_uid = 1;
}

message StatArchiveTsResponse {
  bool exists = 1;
  uint64 size_bytes = 2;
  string message = 3;
  string file_path = 4;
}

message ReadArchiveTsRequest {
  string clip_uid = 1;
  uint64 offset = 2;
  uint64 length = 3;
}

message ReadArchiveTsChunk {
  bytes data = 1;
}

message StorageInfo {
  string storage_id = 1;
  string root_path  = 2;
}

message GetCameraStorageRequest {
  string camera_id = 1;
}

message GetCameraStorageResponse {
  optional StorageInfo storage = 1;
}

message GetRecordingByUidRequest {
  repeated string clip_uids = 1;
}

message GetRecordingByUidResponse {
  repeated Recording recordings = 1;
}



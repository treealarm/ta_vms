syntax = "proto3";

import "google/protobuf/timestamp.proto";

package vms.control;

service CameraControlService {
  rpc AddCamera(AddCameraRequest) returns (OperationStatus);
  rpc AddArchPlayer(PlayFileRequest) returns (OperationStatus);
  rpc RemoveCamera(CameraRequest) returns (OperationStatus);
  rpc RemoveArchPlayer(PlayFileRequest) returns (OperationStatus);
  rpc ListCameras(ListCamerasRequest) returns (ListCamerasResponse);
  rpc SetCameraState(CameraState) returns (OperationStatus);
  rpc GetCameraState(CameraRequest) returns (CameraState);
  rpc SetPlayerState(PlayFileRequest) returns (OperationStatus);
}

message CameraState {
  string camera_id = 1;
  bool recording = 2;
  bool web_rtc = 3;
}

message AddCameraRequest {
  string camera_id = 1;
  string rtsp_url = 2;
  CameraState state = 3;
  string storage_base_path = 4;
}

message CameraRequest {
  string camera_id = 1;
  string client_id = 2;
}

message PlayFileRequest {
  string camera_id = 1;
  google.protobuf.Timestamp start_time = 2;
  string client_id = 3;
}

message ListCamerasRequest {}

message CameraInfo {
  string camera_id = 1;
  string rtsp_url = 2;
}

message ListCamerasResponse {
  repeated CameraInfo cameras = 1;
}

message OperationStatus {
  bool success = 1;
  string message = 2;
}


syntax = "proto3";

package vms.control;

service CameraControlService {
  rpc AddCamera(AddCameraRequest) returns (OperationStatus);
  rpc AddArchPlayer(PlayFileRequest) returns (OperationStatus);
  rpc ListCameras(ListCamerasRequest) returns (ListCamerasResponse);
  rpc StartRecording(CameraRequest) returns (OperationStatus);
  rpc SetCameraState(SetCameraStateRequest) returns (OperationStatus);
  rpc SetPlayerState(PlayFileRequest) returns (OperationStatus);
  rpc StreamJpegFrames(CameraRequest) returns (stream JpegFrame);
}

message CameraState {
  bool recording = 1;
  bool jpeg_stream = 2;
}

message AddCameraRequest {
  string camera_id = 1;
  string rtsp_url = 2;
  CameraState state = 3;
  string storage_base_path = 4;
}

message SetCameraStateRequest {
  string camera_id = 1;
  CameraState state = 2;
}

message CameraRequest {
  string camera_id = 1;
  string client_id = 2;
}

message PlayFileRequest {
  string camera_id = 1;
  string start_time = 2;
  string client_id = 3;
  optional bool jpeg_stream = 4;
}

message ListCamerasRequest {}

message CameraInfo {
  string camera_id = 1;
  string rtsp_url = 2;
  bool is_recording = 3;
}

message ListCamerasResponse {
  repeated CameraInfo cameras = 1;
}

message OperationStatus {
  bool success = 1;
  string message = 2;
}

message JpegFrame {
  bytes jpeg_data = 1;
  uint64 frame_number = 2;
}

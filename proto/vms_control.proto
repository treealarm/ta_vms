syntax = "proto3";

package vms.control;

service CameraControlService {
  rpc AddCamera(AddCameraRequest) returns (OperationStatus);
  rpc ListCameras(ListCamerasRequest) returns (ListCamerasResponse);
  rpc StartRecording(CameraRequest) returns (OperationStatus);
  rpc StopRecording(CameraRequest) returns (OperationStatus);
  rpc StartPlayFile(PlayFileRequest) returns (OperationStatus);
  rpc StopPlayFile(PlayFileRequest) returns (OperationStatus);
  rpc StartJpegStream(JpegStreamRequest) returns (OperationStatus);
  rpc StopJpegStream(CameraRequest) returns (OperationStatus);
  rpc StreamJpegFrames(CameraRequest) returns (stream JpegFrame);
}

message AddCameraRequest {
  string camera_id = 1;
  string rtsp_url = 2;
  bool start_immediately = 3;
  string storage_base_path = 4;
}

message CameraRequest {
  string camera_id = 1;
}

message PlayFileRequest {
  string camera_id = 1;
  string relative_path = 2;
}

message ListCamerasRequest {}

message CameraInfo {
  string camera_id = 1;
  string rtsp_url = 2;
  bool is_recording = 3;
}

message ListCamerasResponse {
  repeated CameraInfo cameras = 1;
}

message JpegStreamRequest {
  string camera_id = 1;
}

message OperationStatus {
  bool success = 1;
  string message = 2;
}

message JpegFrame {
  bytes jpeg_data = 1;
  uint64 frame_number = 2;
}

syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "vms_cfg.proto";

package vms.control;

service CameraControlService {
  rpc RemoveCamera(SourceRequest) returns (OperationStatus);
  rpc SetCameraState(CameraState) returns (OperationStatus);

  rpc AddArchPlayer(PlayerState) returns (OperationStatus);
  rpc RemoveArchPlayer(SourceRequest) returns (OperationStatus);
  rpc ListPlayers(ListPlayersRequest) returns (ListPlayersResponse);
  rpc SetPlayerState(PlayerState) returns (OperationStatus);  
  rpc GetPlayerProgressState(SourceRequest) returns (PlayerProgressState);
  rpc SendPlayerCommand(PlayerCommand) returns (OperationStatus); 

  rpc GetRecordings(RecordingsRequest) returns (RecordingsResponse);
  rpc GetArchiveFrameJpeg(ArchiveFrameJpegRequest) returns (ArchiveFrameJpegResponse);

}

message OperationStatus {
  bool success = 1;
  string message = 2;
}

message SourceRequest {
  string source_id = 1;
}

message Credentials {
  string user = 1;
  string pass = 2;
}

message CameraState {
  string camera_id = 1;
  vms.cfg.RecordingMode recording_mode = 2;
  bool web_rtc = 3;
  string rtsp_url = 4;
  optional Credentials cred = 5;
  uint32 segment_seconds = 6;
}


message PlayerState {
  string camera_id = 1;
  string client_id = 2;
  optional google.protobuf.Timestamp position_ts = 3;
  optional uint32 position_ms = 4;
}

enum PlayerMode {
  PLAYER_MODE_UNSPECIFIED = 0;
  PLAYING = 1;
  PAUSED = 2;
  STOPPED = 3;
}

message PlayerProgressState {
  string camera_id = 1;
  string client_id = 2;
  optional google.protobuf.Timestamp position_ts = 3;
  optional string file_path = 4;
  optional google.protobuf.Timestamp start_ts = 5;
  uint32 duration_ms = 6;
  uint32 position_ms = 7;
  PlayerMode mode = 8;
}

message PlayerCommand {
  string client_id = 1;

  oneof cmd {
    Play play = 10;
    Pause pause = 11;
    Stop stop = 12;
	Step step = 13;
  }
}

message Play 
{
	optional double speed = 1;
}

message Pause {}
message Stop {}
message Step 
{
	int32 step_frames = 1;
}

message ListPlayersRequest {}

message ListPlayersResponse {
  repeated PlayerProgressState players = 1;
}


message RecordingsRequest {
  string camera_id = 1;
  google.protobuf.Timestamp timestamp = 2;
  uint32 limit = 3;
}

message Recording {
  string file_path = 1;
  google.protobuf.Timestamp start_time = 2;
}
message RecordingsResponse {
  repeated Recording recordings = 1;
  optional Recording nearest = 3;
}
message ArchiveFrameJpegRequest {
  string camera_id = 1;
  google.protobuf.Timestamp timestamp = 2;
}

message ArchiveFrameJpegResponse {
  bool success = 1;
  string message = 2;
  bytes jpeg = 3;
  string mime_type = 4;
}


syntax = "proto3";

import "google/protobuf/timestamp.proto";

package vms.control;

service CameraControlService {
  rpc AddCamera(AddCameraRequest) returns (OperationStatus);
  rpc AddArchPlayer(PlayerState) returns (OperationStatus);
  rpc RemoveCamera(SourceRequest) returns (OperationStatus);
  rpc RemoveArchPlayer(SourceRequest) returns (OperationStatus);
  rpc ListCameras(ListCamerasRequest) returns (ListCamerasResponse);
  rpc SetCameraState(CameraState) returns (OperationStatus);
  rpc GetCameraState(SourceRequest) returns (CameraState);
  rpc SetPlayerState(PlayerState) returns (OperationStatus);
  rpc ListPlayers(ListPlayersRequest) returns (ListPlayersResponse);
}

message OperationStatus {
  bool success = 1;
  string message = 2;
}

message SourceRequest {
  string source_id = 1;
}

message CameraState {
  string camera_id = 1;
  bool recording = 2;
  bool web_rtc = 3;
}

message AddCameraRequest {
  string camera_id = 1;
  string rtsp_url = 2;
  CameraState state = 3;
}

message ListCamerasRequest {}

message CameraInfo {
  string camera_id = 1;
  string rtsp_url = 2;
}

message ListCamerasResponse {
  repeated CameraInfo cameras = 1;
}

message PlayerState {
  string camera_id = 1;
  optional google.protobuf.Timestamp position = 2;
  string client_id = 3;
}


message ListPlayersRequest {}

message ListPlayersResponse {
  repeated PlayerState players = 1;
}
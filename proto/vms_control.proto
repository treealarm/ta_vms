syntax = "proto3";

import "vms_cfg.proto";

package vms.control;

service CameraControlService {
  rpc RemoveCamera(SourceRequest) returns (OperationStatus);
  rpc SetCameraState(CameraState) returns (OperationStatus);

  rpc EnsureWebRtcStreaming(EnsureWebRtcStreamingRequest) returns (OperationStatus);

  rpc GetArchiveFrameJpeg(ArchiveFrameJpegRequest) returns (ArchiveFrameJpegResponse);
}

message OperationStatus {
  bool success = 1;
  string message = 2;
}

message SourceRequest {
  string source_id = 1;
}

message Credentials {
  string user = 1;
  string pass = 2;
}

message CameraState {
  string camera_id              = 1;
  vms.cfg.RecordingMode recording_mode = 2;
  bool   web_rtc                = 3;
  uint32 segment_seconds        = 6;
  string stream_name            = 7;
}


message EnsureWebRtcStreamingRequest {
  string camera_id   = 1;
  string stream_name = 2;
}

message ArchiveFrameJpegRequest {
  string file_path = 1;
  int64 offset_ms = 2;
}

message ArchiveFrameJpegResponse {
  bool success = 1;
  string message = 2;
  bytes jpeg = 3;
  string mime_type = 4;
}


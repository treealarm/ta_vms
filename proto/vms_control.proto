syntax = "proto3";

import "google/protobuf/timestamp.proto";

package vms.control;

service CameraControlService {
  rpc AddCamera(CameraState) returns (OperationStatus);
  rpc AddArchPlayer(PlayerState) returns (OperationStatus);
  rpc RemoveCamera(SourceRequest) returns (OperationStatus);
  rpc RemoveArchPlayer(SourceRequest) returns (OperationStatus);
  rpc ListCameras(ListCamerasRequest) returns (ListCamerasResponse);
  rpc SetCameraState(CameraState) returns (OperationStatus);
  rpc GetCameraState(SourceRequest) returns (CameraState);
  rpc SetPlayerState(PlayerState) returns (OperationStatus);
  rpc GetPlayerState(SourceRequest) returns (PlayerState);
  rpc ListPlayers(ListPlayersRequest) returns (ListPlayersResponse);
  rpc GetRecordings(RecordingsRequest) returns (RecordingsResponse);
}

message OperationStatus {
  bool success = 1;
  string message = 2;
}

message SourceRequest {
  string source_id = 1;
}

message CameraState {
  string camera_id = 1;
  bool recording = 2;
  bool web_rtc = 3;
  string rtsp_url = 4;
}

message ListCamerasRequest {}

message ListCamerasResponse {
  repeated CameraState cameras = 1;
}

message PlayerState {
  string camera_id = 1;
  optional google.protobuf.Timestamp position = 2;
  string client_id = 3;
  optional string file_path = 4;
}

message ListPlayersRequest {}

message ListPlayersResponse {
  repeated PlayerState players = 1;
}


message RecordingsRequest {
  string camera_id = 1;
  google.protobuf.Timestamp timestamp = 2;
  uint32 limit = 3;
}

message Recording {
  string file_path = 1;
  google.protobuf.Timestamp start_time = 2;
  optional google.protobuf.Timestamp end_time = 3;
}
message RecordingsResponse {
  repeated Recording recordings = 1;
  optional Recording nearest = 3;
}
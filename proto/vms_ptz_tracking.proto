syntax = "proto3";

import "google/protobuf/timestamp.proto";
// DetectionKind: the same taxonomy the boxes are drawn as. Carried as the enum rather than as a
// string so this service never grows a second copy of that mapping -- the one place strings exist
// is the browser boundary, and AnalyticsKindMapper in web_vms.Server already owns it.
import "vms_analytics.proto";

package vms.ptztracking;

// Without this the generated namespace would be Vms.Ptztracking: protoc capitalises each dotted
// segment as a whole and cannot know where the words in "ptztracking" divide.
option csharp_namespace = "Vms.PtzTracking";

// Keeping a moving object centred in a PTZ camera's frame.
//
// The loop that does it lives in VmsPtzTrackingSingleton, which reads the same live detection
// stream the monitor's overlay draws (StreamCameraDetections in vms_analytics.proto) and drives the
// camera through the node's PtzService (onvif.proto). This service is only how an operator turns
// that loop on, points it at an object, and asks what it is doing.
service PtzTrackingService {
  // Point a self-guiding camera at one object, or hand it back to its own priorities.
  //
  // Not a switch. Whether a camera guides itself at all is configuration -- PtzTrackingPolicy in
  // vms_cfg.proto -- because it must survive the operator closing the monitor and the service being
  // restarted, and because a mode nothing switches off is worse than one nobody can switch on. A
  // camera with no session refuses this call rather than quietly starting one.
  rpc SetTarget(SetTargetRequest) returns (SetTargetResponse);
  // What every camera is tracking right now. The monitor polls this to light its button and to
  // pick out the followed box; there is no per-camera variant because a wall would then issue one
  // request per tile.
  rpc ListTrackingStates(ListTrackingStatesRequest) returns (ListTrackingStatesResponse);
  // Send a slave to the place a spot in its master's frame maps to, without waiting for an object
  // to walk through it. This is how a survey is checked -- and it goes through this service rather
  // than straight to the camera because this is where the aiming sessions live: a test aim issued
  // elsewhere would be a second thing driving one motor.
  rpc AimAtMasterPoint(AimAtMasterPointRequest) returns (AimAtMasterPointResponse);
  // What the marked points add up to: whether they carry a mapping at all, and how far each one
  // lands from where the others say it should be. Read by the survey wizard after every edit, so
  // it answers from the binding as stored rather than from a session that may not be running.
  rpc GetSlaveBindingFit(GetSlaveBindingFitRequest) returns (GetSlaveBindingFitResponse);
  // Stop a slave aiming itself for a while, so its binding can be marked out by hand. Renewed by
  // the caller while the wizard is open and released when it closes; it also expires on its own, so
  // a browser that went away cannot leave a camera parked.
  rpc HoldForSurvey(HoldForSurveyRequest) returns (HoldForSurveyResponse);
  // Point a placed, geo-calibrated PTZ camera at a place on the map. Here rather than straight to
  // the camera for the same reason as AimAtMasterPoint: this service owns the motor.
  rpc AimAtWorldPoint(AimAtWorldPointRequest) returns (AimAtWorldPointResponse);
  // What a camera's landmark observations add up to, for the calibration wizard: whether they
  // carry a mapping, and how far each one lands from where the others say it should be.
  rpc GetPtzGeoFit(GetPtzGeoFitRequest) returns (GetPtzGeoFitResponse);
  // The same for a fixed camera marked against landmarks in its picture: whether the marks map the
  // picture onto the ground, how far each one lands, and the mapping itself.
  rpc GetGroundFit(GetGroundFitRequest) returns (GetGroundFitResponse);
  // The picture-to-map mappings of every camera whose detections can be shown in a space.
  rpc ListGroundProjections(ListGroundProjectionsRequest) returns (ListGroundProjectionsResponse);
}

// One box on the live overlay.
//
// All three parts are needed to name it. The CV detector and a camera's own Scene Description
// number their tracks independently, so `source` has to be part of the key or a camera running
// both would have them collide; and a person and the face found on that person share a track_id,
// differing only by kind.
message TrackingTarget {
  string source   = 1;  // "cv" | "onvif"
  int64  track_id = 2;
  vms.analytics.DetectionKind kind = 3;
}

message SetTargetRequest {
  string camera_id = 1;
  // Unset hands the camera back to its configured priorities; set names the object the operator
  // picked. Either way the override is temporary: it lapses when the object is finally lost, so a
  // camera nobody is watching goes back to doing its own job.
  optional TrackingTarget target = 2;
}

message SetTargetResponse {
  bool   success = 1;
  string error   = 2;
}

message TrackingState {
  string camera_id = 1;
  bool   active    = 2;
  // Absent while the session is armed but has not acquired anything yet.
  optional TrackingTarget target = 3;
  // The operator named this target. A target picked up automatically -- and one the operator named
  // that was then lost for good -- is not explicit, and may be replaced by whatever appears next.
  bool explicit_target = 4;
  // When the current target was last seen. Lets the monitor show a target going stale before the
  // session gives up on it.
  google.protobuf.Timestamp target_seen_at = 5;
  // Last PTZ failure, so an operator can tell "nothing to follow" from "the camera will not move".
  // Cleared by the next command that succeeds.
  string last_error = 6;
  // Whose picture this camera follows, when it is not its own. The monitor reads it backwards: a
  // camera named here by somebody is a master, and clicking a box on it points that somebody.
  optional string master_camera_id = 7;
}

message ListTrackingStatesRequest {}

message ListTrackingStatesResponse {
  repeated TrackingState states = 1;
}

// ── Master/slave aiming ─────────────────────────────────────────────────────

message AimAtMasterPointRequest {
  string slave_camera_id = 1;
  // A spot in the master's frame, 0..1 from the top-left. The ground is what the survey mapped, so
  // this is a place on the ground -- the same thing the bottom edge of an object's box means.
  float  master_x = 2;
  float  master_y = 3;
}

message AimAtMasterPointResponse {
  bool   success = 1;
  string error   = 2;
  // Where the slave was sent. Which of these is filled depends on the binding's method: a position
  // for absolute, a preset for presets.
  optional float pan  = 3;
  optional float tilt = 4;
  string preset_token = 5;
  string preset_name  = 6;
  // The spot lies outside the marked area, where the mapping continues the measurements rather
  // than interpolating between them. Not a refusal -- a step past the last marked point is aimed
  // at perfectly well -- but worth showing the operator.
  bool   extrapolated = 7;
  // The zoom it was sent with, on a method that commands a position.
  optional float zoom = 8;
}

message GetSlaveBindingFitRequest {
  string slave_camera_id = 1;
}

message GetSlaveBindingFitResponse {
  bool   found = 1;
  // False when the survey cannot carry an interpolation: fewer than three points with a readable
  // position, or all of them on one line. The presets method does not need one, so this is only
  // fatal to the absolute method.
  bool   fitted = 2;
  string error  = 3;
  // Why the binding cannot aim the camera by the method it was given, if it cannot. Separate from
  // `error`, which is only about the interpolation: a survey with no presets fits perfectly well
  // and still cannot drive a camera on the presets method.
  string unusable = 4;
  repeated PtzSlaveBindingResidual residuals = 5;
}

// How far the rest of the survey lands from one marked point when that point is left out of the
// fit. A hand slip cannot be reproduced by the points around it, so it shows up here at the size
// of the slip -- which the fit's own residual does not do, a spline passing through its points by
// construction.
message PtzSlaveBindingResidual {
  // Index into the binding's points, in the order they are stored.
  int32 ordinal = 1;
  // Unset where the survey is too small for the point to be checked at all: three points fix an
  // affine map exactly, and dropping one leaves two, which say nothing.
  optional float residual = 2;
}

message HoldForSurveyRequest {
  string slave_camera_id = 1;
  // Zero releases the hold. Anything else is renewed, not added to: the caller says how much longer
  // it wants, not how much more.
  uint32 seconds = 2;
}

message HoldForSurveyResponse {
  bool   success = 1;
  string error   = 2;
}

// ── Aiming through world coordinates ────────────────────────────────────────
//
// A camera placed on a site (CameraPlacement in vms_cfg.proto) and observed centred on a few
// landmarks (PtzGeoObservation) can be aimed at any point of that site: the observations fit
// pan = a + b * azimuth and tilt = c + d * elevation, with azimuth and elevation measured from the
// camera's position and height to the landmark's.

message AimAtWorldPointRequest {
  string camera_id = 1;
  // The space the point was picked in. It has to share geometry with the space the camera really
  // stands in (the same space, or both in real coordinates); otherwise the point is refused.
  string space_id  = 2;
  double lat       = 3;
  double lon       = 4;
  // Above the floor of that space; its elevation is added here.
  double height_m  = 5;
}

message AimAtWorldPointResponse {
  bool   success       = 1;
  string error         = 2;
  float  pan           = 3;
  float  tilt          = 4;
  // From the camera to the point: compass bearing (0 = north, clockwise), angle above the
  // horizontal (negative is down), straight-line distance.
  double azimuth_deg   = 5;
  double elevation_deg = 6;
  double distance_m    = 7;
  // The direction lies outside the span the landmarks cover, so the fit is continued rather than
  // interpolated. Aimed anyway; worth showing.
  bool   extrapolated  = 8;
  // The zoom it was sent with: from the camera's zoom samples, or 0 (the wide end) without any.
  float  zoom          = 9;
}

message GetPtzGeoFitRequest {
  string camera_id = 1;
}

message GetPtzGeoFitResponse {
  // False when the camera is not placed on a map: there is nothing to measure directions from.
  bool   found    = 1;
  bool   fitted   = 2;
  // Why there is no fit, when there is none.
  string error    = 3;
  repeated PtzGeoResidual residuals = 4;
}

// How far the other observations put this landmark from where the camera was actually pointed,
// when it is left out of the fit -- the same leave-one-out check the slave binding reports, for
// the same reason. In the camera's own units.
message PtzGeoResidual {
  string landmark_id = 1;
  // Unset when the rest cannot be fitted without this one (two observations, or the rest share a
  // direction).
  optional float pan  = 2;
  optional float tilt = 3;
  // From the camera to the landmark, straight-line: what a zoom recorded at it is a sample of.
  double distance_m = 4;
}

// ── A fixed camera's picture on the ground ──────────────────────────────────
//
// A fixed camera marked against landmarks (GroundObservation in vms_cfg.proto) sees the floor
// through a homography. It is handed out as a row-major 3×3 matrix from the normalised frame
// (x, y in 0..1, as detection boxes are given) straight to WGS84: (x, y, 1) maps to
// (lat·w, lon·w, w), and a point with w ≤ 0 is beyond the horizon.

message GetGroundFitRequest {
  string camera_id = 1;
}

message GetGroundFitResponse {
  // False when the camera has no reference placement.
  bool   found  = 1;
  bool   fitted = 2;
  // Why there is no fit, when there are marks but no fit.
  string error  = 3;
  repeated GroundResidual residuals = 4;
  // Nine values when fitted, none otherwise.
  repeated double matrix = 5;
}

// How far the fit of all the marks puts this landmark from where it stands. Not leave-one-out as
// the PTZ fit: see GroundHomography.Residuals.
message GroundResidual {
  string landmark_id = 1;
  // Metres on the ground; unset with exactly four marks, which the fit passes through exactly.
  optional double distance_m = 2;
}

message ListGroundProjectionsRequest {
  string space_id = 1;
}

message ListGroundProjectionsResponse {
  repeated GroundProjection projections = 1;
}

message GroundProjection {
  string camera_id = 1;
  repeated double matrix = 2;
}

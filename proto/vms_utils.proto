syntax = "proto3";
package vms.utils;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service UtilsService {
  rpc GetMediaMtxPathInfo(GetMediaMtxPathInfoRequest) returns (GetMediaMtxPathInfoResponse);
  rpc ListEntityStates(google.protobuf.Empty) returns (ListEntityStatesResponse);
}

message GetMediaMtxPathInfoRequest {
  string camera_id   = 1;
  string stream_name = 2;
}

message GetMediaMtxPathInfoResponse {
  bool  success       = 1;
  int32 readers_count = 2;
  bool  has_source    = 3;
  // Whether the assigned MediaMTX server exposes its control API at all. Without it nobody can be
  // asked who is watching, so reader counts mean nothing and the caller must publish unconditionally
  // rather than infer "no viewers" from silence.
  bool  api_configured = 4;
}

message EntityState {
  string service = 1;
  string entity_type = 2;
  string entity_id = 3;
  string state_json = 4;
  google.protobuf.Timestamp last_seen = 5;
  bool stale = 6;
}

message ListEntityStatesResponse {
  repeated EntityState entities = 1;
}

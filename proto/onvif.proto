syntax = "proto3";

// The rest of this file passes device timestamps around as ISO-8601 strings, because that is what
// the camera itself reports and the UI shows verbatim. MetadataDocument.received_at is different:
// it is our own capture clock — the one that also bounds archive clips — produced in C++ and
// consumed in C#, so it uses the well-known type rather than a format both ends would have to
// parse.
import "google/protobuf/timestamp.proto";

package vms.onvif;

option go_package = "grpc/vmsonvif;vmsonvif";

service OnvifService {
  rpc GetProfiles(CameraRequest) returns (GetProfilesResponse);
  rpc GetStreamUri(StreamUriRequest) returns (StreamUriResponse);
  rpc GetRecentOnvifEvents(GetRecentOnvifEventsRequest) returns (GetRecentOnvifEventsResponse);
  rpc GetAllRecentOnvifEvents(GetAllRecentOnvifEventsRequest) returns (GetAllRecentOnvifEventsResponse);
  rpc GetObservedTopics(GetObservedTopicsRequest) returns (GetObservedTopicsResponse);
  rpc GetVideoEncoderConfigs(CameraRequest) returns (GetVideoEncoderConfigsResponse);
  rpc GetVideoEncoderConfigOptions(VideoEncoderConfigOptionsRequest) returns (VideoEncoderConfigOptionsResponse);
  rpc SetVideoEncoderConfig(SetVideoEncoderConfigRequest) returns (SetVideoEncoderConfigResponse);
  rpc GetAudioEncoderConfigs(CameraRequest) returns (GetAudioEncoderConfigsResponse);
  rpc GetAudioEncoderConfigOptions(AudioEncoderConfigOptionsRequest) returns (AudioEncoderConfigOptionsResponse);
  rpc SetAudioEncoderConfig(SetAudioEncoderConfigRequest) returns (SetAudioEncoderConfigResponse);
  rpc GetDeviceTime(CameraRequest) returns (GetDeviceTimeResponse);
  rpc SyncDeviceTime(CameraRequest) returns (SyncDeviceTimeResponse);
  rpc SetDeviceTime(SetDeviceTimeRequest) returns (SyncDeviceTimeResponse);
  rpc RebootDevice(CameraRequest) returns (RebootDeviceResponse);
  rpc DiscoverDevices(DiscoverDevicesRequest) returns (DiscoverDevicesResponse);
  // Reads ONVIF profiles directly from ip/port/credentials, without the camera being
  // configured in VmsCfg — lets the discovery wizard preview streams before committing.
  rpc GetProfilesByConnection(GetProfilesByConnectionRequest) returns (GetProfilesResponse);
  rpc GetSnapshot(CameraRequest) returns (GetSnapshotResponse);
  rpc GetDeviceInformation(CameraRequest) returns (GetDeviceInformationResponse);
  rpc GetDeviceCapabilities(CameraRequest) returns (GetDeviceCapabilitiesResponse);
  rpc GetImagingSettings(ImagingSettingsRequest) returns (ImagingSettingsResponse);
  rpc GetImagingOptions(ImagingSettingsRequest) returns (ImagingOptionsResponse);
  rpc SetImagingSettings(SetImagingSettingsRequest) returns (SetImagingSettingsResponse);

  // ── Profile G: the camera's own recordings (SD card) ────────────────────────
  // Read RPCs never fail the call for a camera that simply cannot do Profile G — they answer with
  // `message` filled in, so the UI can tell "unsupported" from "service broken".
  rpc GetEdgeCapabilities(CameraRequest) returns (EdgeCapabilitiesResponse);
  rpc GetEdgeRecordingSummary(CameraRequest) returns (EdgeRecordingSummaryResponse);
  rpc ListEdgeRecordings(CameraRequest) returns (ListEdgeRecordingsResponse);
  rpc ListEdgeRecordingIntervals(EdgeIntervalsRequest) returns (EdgeIntervalsResponse);
  rpc GetEdgeReplayUri(EdgeReplayUriRequest) returns (EdgeReplayUriResponse);

  // Write RPCs act on the device and are irreversible; they report failure in `error`.
  rpc ListEdgeRecordingJobs(CameraRequest) returns (EdgeRecordingJobsResponse);
  rpc SetEdgeRecordingJobMode(EdgeSetJobModeRequest) returns (EdgeMutationResponse);
  rpc SetEdgeRecordingConfiguration(EdgeSetRecordingConfigurationRequest) returns (EdgeMutationResponse);
  rpc DeleteEdgeRecording(EdgeRecordingTokenRequest) returns (EdgeMutationResponse);
  rpc DeleteEdgeTrack(EdgeTrackRequest) returns (EdgeMutationResponse);
  rpc DeleteEdgeRecordingJob(EdgeJobRequest) returns (EdgeMutationResponse);

  rpc ListEdgeStorage(CameraRequest) returns (EdgeStorageResponse);
  rpc FormatEdgeStorage(EdgeFormatStorageRequest) returns (EdgeMutationResponse);

  // ── Profile M: the camera's own metadata / analytics ────────────────────────
  // Turning Scene Description on takes two attachments to the streaming profile: a
  // MetadataConfiguration with analytics=true (so the RTSP session carries a metadata track at
  // all) and a VideoAnalyticsConfiguration (the engine whose modules produce the objects).
  rpc GetMetadataConfigs(CameraRequest) returns (MetadataConfigsResponse);
  rpc GetMetadataConfigOptions(MetadataConfigOptionsRequest) returns (MetadataConfigOptionsResponse);
  rpc SetMetadataConfig(SetMetadataConfigRequest) returns (OnvifMutationResponse);
  rpc AttachMetadataConfig(AttachConfigRequest) returns (OnvifMutationResponse);
  rpc DetachMetadataConfig(AttachConfigRequest) returns (OnvifMutationResponse);
  rpc GetAnalyticsConfigs(CameraRequest) returns (AnalyticsConfigsResponse);
  rpc AttachAnalyticsConfig(AttachConfigRequest) returns (OnvifMutationResponse);
  rpc DetachAnalyticsConfig(AttachConfigRequest) returns (OnvifMutationResponse);

  rpc GetSupportedAnalyticsModules(AnalyticsConfigRequest) returns (AnalyticsModuleDescriptionsResponse);
  rpc GetAnalyticsModules(AnalyticsConfigRequest) returns (AnalyticsModulesResponse);
  rpc CreateAnalyticsModule(AnalyticsModuleRequest) returns (OnvifMutationResponse);
  rpc ModifyAnalyticsModule(AnalyticsModuleRequest) returns (OnvifMutationResponse);
  rpc DeleteAnalyticsModule(AnalyticsModuleNameRequest) returns (OnvifMutationResponse);

  rpc GetSupportedRules(AnalyticsConfigRequest) returns (AnalyticsModuleDescriptionsResponse);
  rpc GetRules(AnalyticsConfigRequest) returns (AnalyticsModulesResponse);
  rpc CreateRule(AnalyticsModuleRequest) returns (OnvifMutationResponse);
  rpc ModifyRule(AnalyticsModuleRequest) returns (OnvifMutationResponse);
  rpc DeleteRule(AnalyticsModuleNameRequest) returns (OnvifMutationResponse);

  // Cheap "can this camera draw boxes right now" probe for the monitor's overlay button. Answers
  // from cache and probes missing cameras in the background, so a full monitor never waits on a
  // round of device round-trips.
  rpc GetMetadataStates(MetadataStatesRequest) returns (MetadataStatesResponse);

  // Raw Scene Description documents media_server reassembled off the camera's RTSP metadata track.
  // Parsed here, where the rest of the ONVIF schema knowledge already lives, then forwarded to
  // VmsAnalyticsSingleton as normalized boxes (PushOnvifDetections in vms_analytics.proto).
  // Batched by the caller so a chatty camera costs a few RPCs per second, not one per document.
  rpc PushMetadataDocuments(MetadataDocumentBatch) returns (PushMetadataDocumentsResponse);
}

service PtzService {
  rpc GetCapabilities(PtzCapabilitiesRequest) returns (PtzCapabilitiesResponse);
  // Where the camera says it is pointing. The counterpart of AbsoluteMove, and the only way to
  // record a position the operator has driven to by hand.
  rpc GetStatus(PtzStatusRequest) returns (PtzStatusResponse);
  rpc ContinuousMove(PtzContinuousMoveRequest) returns (PtzResponse);
  rpc AbsoluteMove(PtzAbsoluteMoveRequest) returns (PtzResponse);
  rpc RelativeMove(PtzRelativeMoveRequest) returns (PtzResponse);
  rpc Stop(PtzStopRequest) returns (PtzResponse);
  rpc GetPresets(PtzPresetsRequest) returns (PtzPresetsResponse);
  rpc SetPreset(PtzSetPresetRequest) returns (PtzSetPresetResponse);
  rpc GotoPreset(PtzGotoPresetRequest) returns (PtzResponse);
  rpc RemovePreset(PtzRemovePresetRequest) returns (PtzResponse);
}

message CameraRequest {
  string source_id = 1;
}

message StreamUriRequest {
  string source_id = 1;
  string profile_token = 2; // empty = first available profile
}

message OnvifProfile {
  string token    = 1;
  string name     = 2;
  int32  width    = 3;
  int32  height   = 4;
  string encoding = 5;
}

message GetProfilesByConnectionRequest {
  string ip    = 1;
  int32  port  = 2;
  string user  = 3;
  string pass  = 4;
  // Full device-service URL, if known (e.g. from WS-Discovery) — overrides the standard
  // http://{ip}:{port}/onvif/device_service template when the device uses a different path.
  string xaddr = 5;
}

message GetProfilesResponse {
  repeated OnvifProfile profiles = 1;
}

message StreamUriResponse {
  string rtsp_url = 1;
}

message GetSnapshotResponse {
  bytes  data      = 1;
  string mime_type = 2;
  string error     = 3;
}

message GetDeviceInformationResponse {
  string manufacturer     = 1;
  string model            = 2;
  string firmware_version = 3;
  string serial_number    = 4;
  string hardware_id      = 5;
  string error            = 6;
}

message GetDeviceCapabilitiesResponse {
  bool   has_ptz            = 1;
  bool   has_imaging        = 2;
  bool   has_events         = 3;
  bool   has_audio          = 4;
  string error              = 5;
  bool   has_relay_outputs  = 6;
  bool   has_digital_inputs = 7;
  // Camera keeps its own recordings (Profile G search + replay); gates the Edge Archive UI.
  bool   has_edge_recording = 8;
  // Camera runs its own analytics engine (ver20 Analytics service); gates the Metadata tab.
  // Named for the service, not just "analytics": whether a camera has an enabled CV watch on our
  // side is a different question with a different answer, and the two used to share a name.
  bool   has_analytics_service = 9;
}

message ImagingSettingsRequest {
  string source_id          = 1;
  string video_source_token = 2; // empty = resolve server-side from first profile
}

message ImagingSettingsResponse {
  optional float brightness       = 1;
  optional float contrast         = 2;
  optional float color_saturation = 3;
  optional float sharpness        = 4;
  string         error            = 5;
}

message FloatRange {
  float min = 1;
  float max = 2;
}

message ImagingOptionsResponse {
  FloatRange brightness       = 1;
  FloatRange contrast         = 2;
  FloatRange color_saturation = 3;
  FloatRange sharpness        = 4;
  string     error            = 5;
}

message SetImagingSettingsRequest {
  string         source_id          = 1;
  string         video_source_token = 2;
  optional float brightness         = 3;
  optional float contrast           = 4;
  optional float color_saturation   = 5;
  optional float sharpness          = 6;
}

message SetImagingSettingsResponse {
  bool   success = 1;
  string error   = 2;
}

message PtzContinuousMoveRequest {
  string source_id     = 1;
  string profile_token = 2;
  float  pan           = 3;  // -1..1
  float  tilt          = 4;  // -1..1
  float  zoom          = 5;  // -1..1
}

message PtzAbsoluteMoveRequest {
  string source_id     = 1;
  string profile_token = 2;
  float  pan           = 3;  // -1..1
  float  tilt          = 4;  // -1..1
  float  zoom          = 5;  //  0..1
  float  speed         = 6;  //  0..1, default 0.5
}

message PtzRelativeMoveRequest {
  string source_id     = 1;
  string profile_token = 2;
  float  pan           = 3;  // -1..1
  float  tilt          = 4;  // -1..1
  float  zoom          = 5;  // -1..1
  float  speed         = 6;  //  0..1, default 0.5
}

message PtzStopRequest {
  string source_id     = 1;
  string profile_token = 2;
}

message PtzCapabilitiesRequest {
  string source_id = 1;
}

message PtzCapabilitiesResponse {
  bool absolute_move   = 1;
  bool relative_move   = 2;
  bool continuous_move = 3;
}

message PtzStatusRequest {
  string source_id     = 1;
  string profile_token = 2;
}

message PtzStatusResponse {
  // False when the camera would not answer at all. It answering is not proof the numbers mean
  // anything: firmware exists that reports constants and IDLE while the motor is plainly turning,
  // so a caller that depends on the position must verify it by moving the camera and watching it
  // change -- never by this call succeeding, and never by GetCapabilities.
  bool   available = 1;
  float  pan       = 2;
  float  tilt      = 3;
  float  zoom      = 4;
  // The camera says it is still travelling. Absent move state reads as not moving.
  bool   moving    = 5;
  string error     = 6;
}

message PtzResponse {
  bool   success = 1;
  string error   = 2;
}

message GetRecentOnvifEventsRequest {
  string camera_id = 1;
}

message OnvifEventRecord {
  string received_at = 1;
  string topic       = 2;
  string payload_xml = 3;
  string camera_id   = 4;
}

message GetRecentOnvifEventsResponse {
  repeated OnvifEventRecord events = 1;
}

message GetAllRecentOnvifEventsRequest {}

message GetAllRecentOnvifEventsResponse {
  repeated OnvifEventRecord events = 1;
}

message GetObservedTopicsRequest {
  string camera_id = 1;
}

message ObservedTopicEntry {
  string topic      = 1;
  string first_seen = 2;
  string last_seen  = 3;
}

message GetObservedTopicsResponse {
  repeated ObservedTopicEntry topics = 1;
}

message VideoEncoderConfig {
  string token           = 1;
  string name            = 2;
  string encoding        = 3;
  int32  width           = 4;
  int32  height          = 5;
  int32  frame_rate_limit = 6;
  int32  bitrate_limit   = 7;
  int32  gov_length      = 8;
  string h264_profile    = 9;
  float  quality         = 10;
}

message GetVideoEncoderConfigsResponse {
  repeated VideoEncoderConfig configs = 1;
}

message VideoEncoderConfigOptionsRequest {
  string source_id    = 1;
  string config_token = 2;
}

message ResolutionOption {
  int32 width  = 1;
  int32 height = 2;
}

message VideoEncoderConfigOptions {
  string                  encoding      = 1;
  repeated ResolutionOption resolutions  = 2;
  int32                   min_frame_rate = 3;
  int32                   max_frame_rate = 4;
  int32                   min_bitrate   = 5;
  int32                   max_bitrate   = 6;
  int32                   min_gov_length = 7;
  int32                   max_gov_length = 8;
  repeated string         h264_profiles  = 9;
}

message VideoEncoderConfigOptionsResponse {
  repeated VideoEncoderConfigOptions options = 1;
}

message SetVideoEncoderConfigRequest {
  string             source_id = 1;
  VideoEncoderConfig config    = 2;
}

message SetVideoEncoderConfigResponse {
  bool   success = 1;
  string error   = 2;
}

message AudioEncoderConfig {
  string token       = 1;
  string name        = 2;
  string encoding    = 3;
  int32  bitrate     = 4;
  int32  sample_rate = 5;
}

message GetAudioEncoderConfigsResponse {
  repeated AudioEncoderConfig configs = 1;
}

message AudioEncoderConfigOptionsRequest {
  string source_id    = 1;
  string config_token = 2;
}

message AudioEncoderConfigOptions {
  string         encoding     = 1;
  repeated int32 bitrates     = 2;
  repeated int32 sample_rates = 3;
}

message AudioEncoderConfigOptionsResponse {
  repeated AudioEncoderConfigOptions options = 1;
}

message SetAudioEncoderConfigRequest {
  string             source_id = 1;
  AudioEncoderConfig config    = 2;
}

message SetAudioEncoderConfigResponse {
  bool   success = 1;
  string error   = 2;
}

message GetDeviceTimeResponse {
  string utc_time = 1;
}

message SetDeviceTimeRequest {
  string source_id = 1;
  string utc_time  = 2;
}

message SyncDeviceTimeResponse {
  bool   success = 1;
  string error   = 2;
}

message RebootDeviceResponse {
  bool   success = 1;
  string message = 2;
}

message DiscoverDevicesRequest {
  int32 timeout_seconds = 1; // 0 = default (4s)
}

message DiscoveredDevice {
  string ip            = 1;
  int32  port          = 2;
  string endpoint_uuid = 3;
  repeated string xaddrs = 4;
  string hardware       = 5;
  string name           = 6;
}

message DiscoverDevicesResponse {
  repeated DiscoveredDevice devices = 1;
  // False when no network interface could even send a probe (e.g. multicast join
  // failed everywhere) — lets the caller distinguish "scanned, found nothing" from
  // "couldn't scan at all" instead of treating both as an empty result.
  bool scan_ok = 2;
}

message PtzPreset {
  string token = 1;
  string name  = 2;
}

message PtzPresetsRequest {
  string source_id     = 1;
  string profile_token = 2;
}

message PtzPresetsResponse {
  repeated PtzPreset presets = 1;
}

message PtzSetPresetRequest {
  string source_id     = 1;
  string profile_token = 2;
  string preset_name   = 3;
  string preset_token  = 4;
}

message PtzSetPresetResponse {
  bool   success      = 1;
  string error        = 2;
  string preset_token = 3;
}

message PtzGotoPresetRequest {
  string source_id     = 1;
  string profile_token = 2;
  string preset_token  = 3;
}

message PtzRemovePresetRequest {
  string source_id     = 1;
  string profile_token = 2;
  string preset_token  = 3;
}

// ── Device I/O (digital inputs / relay outputs) ─────────────────────────────
// A separate service from OnvifService/PtzService, same reasoning as PTZ being split out:
// Device I/O is a large, semantically distinct sub-domain.

enum RelayMode {
  MONOSTABLE = 0;
  BISTABLE   = 1;
}

enum IdleState {
  CLOSED = 0;
  OPEN   = 1;
}

service DeviceIoService {
  rpc GetRelayOutputs(CameraRequest) returns (GetRelayOutputsResponse);
  rpc GetRelayOutputOptions(CameraRequest) returns (GetRelayOutputOptionsResponse);
  rpc SetRelayOutputState(SetRelayOutputStateRequest) returns (DeviceIoResponse);
  rpc SetRelayOutputSettings(SetRelayOutputSettingsRequest) returns (DeviceIoResponse);
  rpc GetDigitalInputs(CameraRequest) returns (GetDigitalInputsResponse);
  rpc GetDigitalInputOptions(CameraRequest) returns (GetDigitalInputOptionsResponse);
  rpc SetDigitalInputIdleState(SetDigitalInputIdleStateRequest) returns (DeviceIoResponse);
}

message DeviceIoResponse {
  bool   success = 1;
  string error   = 2;
}

// ONVIF's GetRelayOutputs has no field for the relay's current logical (active/inactive) state —
// only its configured Mode/DelayTime/IdleState (see RelayOutputSettings in onvif.xsd). Live state
// can only be tracked client-side after a command, never polled.
message RelayOutput {
  string    token     = 1;
  RelayMode mode      = 2;
  IdleState idle_state = 3;
  int32     delay_ms  = 4;
}

message GetRelayOutputsResponse {
  repeated RelayOutput relays = 1;
  string               error  = 2;
}

message RelayOutputOptions {
  string         token              = 1;
  repeated RelayMode supported_modes = 2;
  bool           discrete           = 3;
  int32          min_delay_ms       = 4;
  int32          max_delay_ms       = 5;
  repeated int32 discrete_delays_ms = 6;
}

message GetRelayOutputOptionsResponse {
  repeated RelayOutputOptions options = 1;
  string                      error   = 2;
}

message SetRelayOutputStateRequest {
  string source_id = 1;
  string token      = 2;
  bool   active     = 3;
}

message SetRelayOutputSettingsRequest {
  string    source_id = 1;
  string    token      = 2;
  RelayMode mode       = 3;
  IdleState idle_state = 4;
  int32     delay_ms   = 5;
}

// GetDigitalInputs has no live logical-state field either (per onvif.xsd DigitalInput) — only
// the idle-state configuration. has_idle_state is false when the camera didn't report it at all
// (IdleStateSpecified == false on the wire).
message DigitalInput {
  string    token          = 1;
  IdleState idle_state     = 2;
  bool      has_idle_state = 3;
}

message GetDigitalInputsResponse {
  repeated DigitalInput inputs = 1;
  string                error  = 2;
}

message DigitalInputOptions {
  string token                   = 1;
  bool   idle_state_configurable = 2;
}

message GetDigitalInputOptionsResponse {
  repeated DigitalInputOptions options = 1;
  string                       error   = 2;
}

message SetDigitalInputIdleStateRequest {
  string    source_id = 1;
  string    token      = 2;
  IdleState idle_state = 3;
}

// ── Profile G: camera-side ("edge") recordings ────────────────────────────────
// Timestamps are ISO 8601 UTC strings, matching how the device itself reports them; empty means
// "not reported". They are only ever passed through to the UI, never used for arithmetic here.

message EdgeCapabilitiesResponse {
  bool   recording             = 1;
  bool   search                = 2;
  bool   replay                = 3;
  // Recording/DynamicRecordings: CreateRecording and DeleteRecording are available.
  bool   dynamic_recordings    = 4;
  // Recording/DynamicTracks: CreateTrack and DeleteTrack are available.
  bool   dynamic_tracks        = 5;
  // Device service exposes GetStorageConfigurations.
  bool   storage_configuration = 6;
  // Device advertises auxiliary commands, one of which may format local storage.
  bool   auxiliary_commands    = 7;
  // Maximum recordings the device can hold, 0 when not advertised.
  uint32 max_recordings        = 8;
  repeated string supported_auxiliary_commands = 9;
  // Set when probing failed or the camera cannot do Profile G; the UI shows it instead of
  // empty tabs. Not a transport error — the call itself succeeds.
  string message               = 10;
}

message EdgeRecordingSummaryResponse {
  string data_from          = 1;
  string data_until         = 2;
  uint32 number_recordings  = 3;
  bool   supported          = 4;
  string message            = 5;
// Camera clock minus server clock, as measured just now. Absent = the device does not report its
// time, and then every timestamp here is the device's own scale, uncorrected — a caller about to
// fetch footage must refuse rather than guess. Present values mean all timestamps in this message
// have already been converted to server time.
  optional int64 clock_offset_ms = 6;
}

message EdgeTrack {
  string track_token = 1;
  string track_type  = 2; // video | audio | metadata | extended
  string description = 3;
  string data_from   = 4;
  string data_to     = 5;
}

// One recording object on the device; a Profile G recording aggregates many files.
message EdgeRecording {
  string recording_token   = 1;
  string source_name       = 2;
  string source_description = 3;
  string earliest_recording = 4;
  string latest_recording   = 5;
  string content            = 6;
  string recording_status   = 7;
  repeated EdgeTrack tracks = 8;
}

message ListEdgeRecordingsResponse {
  repeated EdgeRecording recordings = 1;
  string message = 2;
  optional int64 clock_offset_ms = 3;
}

message EdgeIntervalsRequest {
  string source_id       = 1;
  // Optional ISO 8601 UTC window; empty values fall back to the recording summary span.
  string start_time      = 2;
  string end_time        = 3;
  // Restrict to one recording; empty searches every recording on the device.
  string recording_token = 4;
  uint32 max_results     = 5;
}

// A contiguous span the device reports as recorded. Spans still being written are closed at the
// search window end so clients can import them.
message EdgeInterval {
  string recording_token = 1;
  string track_token     = 2;
  string start_time      = 3;
  string end_time        = 4;
}

message EdgeIntervalsResponse {
  repeated EdgeInterval intervals = 1;
  // True when the device answered, even if it reported no spans in the window.
  bool   searched = 2;
  string message  = 3;
  optional int64 clock_offset_ms = 4;
}

message EdgeReplayUriRequest {
  string source_id       = 1;
  string recording_token = 2;
  string transport       = 3; // RTSP (default), HTTP or TCP
}

message EdgeReplayUriResponse {
  string uri     = 1;
  string message = 2;
  optional int64 clock_offset_ms = 3;
}

message EdgeRecordingJob {
  string job_token       = 1;
  string recording_token = 2;
  string mode            = 3; // Active | Idle, or the raw device value
  string source_token    = 4;
}

message EdgeRecordingConfiguration {
  string recording_token         = 1;
  string source_id               = 2;
  string source_name             = 3;
  string source_location         = 4;
  string source_description      = 5;
  string source_address          = 6;
  string content                 = 7;
  // ISO 8601 duration; PT0S means unlimited retention on the device.
  string maximum_retention_time  = 8;
}

message EdgeRecordingJobsResponse {
  repeated EdgeRecordingJob jobs = 1;
  repeated EdgeRecordingConfiguration configurations = 2;
  string message = 3;
}

message EdgeSetJobModeRequest {
  string source_id = 1;
  string job_token = 2;
  string mode      = 3; // Active starts the job, Idle stops it
}

message EdgeSetRecordingConfigurationRequest {
  string source_id              = 1;
  string recording_token        = 2;
  string content                = 3;
  string maximum_retention_time = 4;
}

message EdgeRecordingTokenRequest {
  string source_id       = 1;
  string recording_token = 2;
}

message EdgeTrackRequest {
  string source_id       = 1;
  string recording_token = 2;
  string track_token     = 3;
}

message EdgeJobRequest {
  string source_id = 1;
  string job_token = 2;
}

message EdgeStorageConfiguration {
  string token       = 1;
  string type        = 2;
  string local_path  = 3;
  string storage_uri = 4;
  string user        = 5;
}

message EdgeStorageResponse {
  repeated EdgeStorageConfiguration configurations = 1;
  bool   supported        = 2;
  // True when a vendor auxiliary command can format local storage.
  bool   format_supported = 3;
  // The exact auxiliary command a format request would send — shown in the UI before confirming.
  string format_command   = 4;
  string message          = 5;
}

message EdgeFormatStorageRequest {
  string source_id = 1;
  // Auxiliary command to send; empty uses the one reported by ListEdgeStorage.
  string command   = 2;
}

message EdgeMutationResponse {
  bool   success = 1;
  string error   = 2;
}

// ── Profile M: metadata / analytics configuration ─────────────────────────────

message OnvifMutationResponse {
  bool   success = 1;
  string error   = 2;
}

message MetadataConfig {
  string token            = 1;
  string name             = 2;
  // The one flag that matters for the live overlay: without it the metadata track carries no
  // Scene Description, only events/PTZ status.
  bool   analytics        = 3;
  bool   ptz_status       = 4;
  bool   events           = 5;
  bool   geo_location     = 6;
  bool   shape_polygon    = 7;
  string session_timeout  = 8;
  string compression_type = 9;
  // Profile tokens this configuration is currently attached to.
  repeated string attached_profile_tokens = 10;
}

message MetadataConfigsResponse {
  repeated MetadataConfig configs = 1;
  string error = 2;
}

message MetadataConfigOptionsRequest {
  string source_id            = 1;
  string configuration_token  = 2;
}

message MetadataConfigOptionsResponse {
  bool   supports_ptz_status       = 1;
  repeated string compression_types = 2;
  string error                     = 3;
}

message SetMetadataConfigRequest {
  string source_id           = 1;
  string configuration_token = 2;
  // Only the fields present are changed; the rest are read back from the camera and re-sent
  // unchanged, because some firmwares treat an omitted optional field as "reset to default".
  optional bool   analytics        = 3;
  optional bool   ptz_status       = 4;
  optional string session_timeout  = 5;
  optional string compression_type = 6;
}

message AttachConfigRequest {
  string source_id           = 1;
  string profile_token       = 2;
  string configuration_token = 3;
}

message AnalyticsConfig {
  string token = 1;
  string name  = 2;
  // Profile tokens this configuration is currently attached to.
  repeated string attached_profile_tokens = 3;
}

message AnalyticsConfigsResponse {
  repeated AnalyticsConfig configs = 1;
  string error = 2;
}

message AnalyticsConfigRequest {
  string source_id           = 1;
  string configuration_token = 2;
}

message AnalyticsSimpleItem {
  string name  = 1;
  string value = 2;
}

// One structured parameter. The name is the camera's label for the slot ("Field"); the XML inside
// it is a different thing entirely ("Polygon"), so the two travel together — deriving one from the
// other renames the parameter and the camera then rejects or misapplies the Modify.
message AnalyticsElementItem {
  string name = 1;
  string xml  = 2;
}

message AnalyticsModule {
  string name = 1;
  string type = 2;
  repeated AnalyticsSimpleItem simple_items = 3;
  // Structured parameters (polygons, line segments, schedules) as raw XML. They have no fixed
  // schema across vendors, so they travel untouched rather than being modelled here — a Modify
  // that dropped what it did not understand would silently reconfigure the camera.
  repeated AnalyticsElementItem element_items = 5;
}

message AnalyticsModulesResponse {
  repeated AnalyticsModule modules = 1;
  string error = 2;
}

message AnalyticsParameterDescription {
  string name = 1;
  string type = 2;
}

// How a camera lays out its motion-detection cells. An ActiveCells bitmask is a flat run of bits,
// and only these two numbers say which cell is where — without them a UI cannot honestly draw a
// grid. Optional in ONVIF and absent on many firmwares, hence zero when unknown.
message AnalyticsCellLayout {
  int32 columns = 1;
  int32 rows    = 2;
}

message AnalyticsModuleDescription {
  string type          = 1;
  string max_instances = 2;
  repeated AnalyticsParameterDescription parameters = 3;
  // Set only for types with a cell mask, and only when the camera reveals it.
  optional AnalyticsCellLayout cell_layout = 4;
}

message AnalyticsModuleDescriptionsResponse {
  repeated AnalyticsModuleDescription descriptions = 1;
  string error = 2;
}

message AnalyticsModuleRequest {
  string source_id           = 1;
  string configuration_token = 2;
  AnalyticsModule module     = 3;
}

message AnalyticsModuleNameRequest {
  string source_id           = 1;
  string configuration_token = 2;
  string module_name         = 3;
}

message MetadataStatesRequest {
  repeated string camera_ids = 1;
}

message MetadataStatesResponse {
  // camera_id -> "this camera is currently configured to stream object boxes". Cameras still
  // being probed are simply absent rather than reported as false, so the caller can ask again.
  map<string, bool> bbox_capable = 1;
}

// One reassembled ONVIF metadata document, exactly as it came off the wire.
message MetadataDocument {
  string camera_id = 1;
  string stream_name = 2;
  // Wall clock of the first packet that carried the document, taken by the RTSP reader from the
  // same stamping the video packets get — so a box can be placed on the frame it describes. Not
  // the moment reassembly finished, and not the moment it was sent: both come after the camera
  // described the scene, and these boxes are drawn over archived video whose boundaries come off
  // exactly this clock.
  google.protobuf.Timestamp received_at = 3;
  string xml = 4;
  // Video track resolution, so the parser can normalize cameras that emit raw pixel coordinates
  // without a tt:Transformation (Hikvision does this). Zero when unknown.
  int32 frame_width = 5;
  int32 frame_height = 6;
}

message MetadataDocumentBatch {
  repeated MetadataDocument documents = 1;
}

message PushMetadataDocumentsResponse {}

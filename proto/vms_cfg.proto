syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

package vms.cfg;

service CfgService {
  rpc ListCameras(ListCamerasRequest) returns (ListCamerasResponse);
  rpc ListMediaServers(ListMediaServersRequest) returns (ListMediaServersResponse);
  rpc SetupCamera(CameraSetup) returns (OperationStatus);
  rpc RemoveCamera(SourceRequest) returns (OperationStatus);
  rpc GetCamera(SourceRequest) returns (GetCameraResponse);
  rpc ListRecordingProfiles(ListRecordingProfilesRequest) returns (ListRecordingProfilesResponse);
  rpc UpsertRecordingProfile(RecordingProfile) returns (OperationStatus);
  rpc RemoveRecordingProfile(RecordingProfileRequest) returns (OperationStatus);
  rpc SetStreamOverride(SetStreamOverrideRequest) returns (OperationStatus);
  rpc ClearStreamOverride(ClearStreamOverrideRequest) returns (OperationStatus);
  rpc SetStreamRecordingProfile(SetStreamRecordingProfileRequest) returns (OperationStatus);
  // Switches continuous recording on or off across every enabled, recordable stream of one camera
  // in a single transaction. The monitor's record button means "record this camera", not "record
  // whichever stream the tile happens to be showing", and integrations want the same without
  // driving a loop. The per-stream RPCs above stay: external systems still need pin-point control.
  rpc SetCameraContinuousRecording(SetCameraContinuousRecordingRequest) returns (SetCameraContinuousRecordingResponse);
  rpc ActivateAlarmOverride(ActivateAlarmOverrideRequest) returns (ActivateAlarmOverrideResponse);
  // For the schedule ticker in VmsSingleton. All schedule evaluation stays here, where the schema
  // and the evaluator live: the ticker only detects transitions and announces them, so it needs no
  // copy of the rules and no second cache.
  rpc GetRecordingScheduleState(google.protobuf.Empty) returns (RecordingScheduleStateResponse);
  // Announces that these cameras' effective recording state may have changed. Publishing stays here
  // so topic names and the camera→server lookup do not get duplicated in a second service.
  rpc NotifyCamerasChanged(NotifyCamerasChangedRequest) returns (OperationStatus);
  // Clears every alarm recording override whose window has elapsed and answers with the ones it
  // actually cleared. The sweep is driven from VmsSingleton — it is periodic global work — but the
  // clearing itself stays here, over VmsCfg's own table, and is a compare-and-swap, so a caller
  // never sees a row someone else cleared.
  rpc ExpireAlarmOverrides(google.protobuf.Empty) returns (ExpireAlarmOverridesResponse);
  rpc ListRecordingSchedules(ListRecordingSchedulesRequest) returns (ListRecordingSchedulesResponse);
  rpc UpsertRecordingSchedule(RecordingSchedule) returns (OperationStatus);
  rpc RemoveRecordingSchedule(RecordingScheduleRequest) returns (OperationStatus);
  rpc SetCameraSchedules(SetCameraSchedulesRequest) returns (OperationStatus);
  rpc ListMediaMtxServers(ListMediaMtxServersRequest) returns (ListMediaMtxServersResponse);
  rpc UpsertMediaMtxServer(MediaMtxServer) returns (OperationStatus);
  rpc RemoveMediaMtxServer(MediaMtxServerRequest) returns (OperationStatus);
  rpc GetOrAssignMediaMtxServer(SourceRequest) returns (GetOrAssignMediaMtxServerResponse);
  rpc ListMonitors(ListMonitorsRequest) returns (ListMonitorsResponse);
  rpc UpsertMonitor(MonitorSetup) returns (MonitorSetup);
  rpc RemoveMonitor(RemoveMonitorRequest) returns (OperationStatus);
  rpc SetMonitorCameras(SetMonitorCamerasRequest) returns (OperationStatus);
  rpc SetMonitorSlot(SetMonitorSlotRequest) returns (OperationStatus);
  rpc ClearMonitorSlot(ClearMonitorSlotRequest) returns (OperationStatus);
  // Pins a slot to one stream for this operator, or releases it back to automatic with an empty
  // stream_name.
  rpc SetMonitorSlotStream(SetMonitorSlotStreamRequest) returns (OperationStatus);
  rpc CopyMonitor(CopyMonitorRequest) returns (MonitorSetup);
  rpc ListOnvifAlarmFilters(ListOnvifAlarmFiltersRequest) returns (ListOnvifAlarmFiltersResponse);
  rpc UpsertOnvifAlarmFilter(OnvifAlarmFilter) returns (OnvifAlarmFilter);
  rpc RemoveOnvifAlarmFilter(OnvifAlarmFilterRequest) returns (OperationStatus);

  rpc SubscribeOnvifEvents(OnvifSubscriptionRequest) returns (OperationStatus);
  rpc UnsubscribeOnvifEvents(OnvifSubscriptionRequest) returns (OperationStatus);
  rpc ListOnvifSubscriptions(google.protobuf.Empty) returns (OnvifSubscriptionsResponse);
  rpc SetOnvifSubscribed(SetOnvifSubscribedRequest) returns (OperationStatus);
  rpc SetOnvifPollConfig(SetOnvifPollConfigRequest) returns (OperationStatus);

  rpc GetCamState(GetCamStateRequest) returns (GetCamStateResponse);
  rpc SetCamState(SetCamStateRequest) returns (OperationStatus);

  rpc ListAnalyticsWatches(ListAnalyticsWatchesRequest) returns (ListAnalyticsWatchesResponse);
  rpc UpsertAnalyticsWatch(UpsertAnalyticsWatchRequest) returns (OperationStatus);
  rpc RemoveAnalyticsWatch(RemoveAnalyticsWatchRequest) returns (OperationStatus);
  rpc GetCameraAnalyticsSources(CameraAnalyticsSourcesRequest) returns (CameraAnalyticsSourcesResponse);

  rpc GetPtzCalibration(GetPtzCalibrationRequest) returns (GetPtzCalibrationResponse);
  rpc UpsertPtzCalibration(UpsertPtzCalibrationRequest) returns (OperationStatus);
  rpc RemovePtzCalibration(RemovePtzCalibrationRequest) returns (OperationStatus);

  rpc GetPtzTrackingPolicy(GetPtzTrackingPolicyRequest) returns (GetPtzTrackingPolicyResponse);
  rpc UpsertPtzTrackingPolicy(UpsertPtzTrackingPolicyRequest) returns (OperationStatus);
  rpc ListPtzTrackingPolicies(google.protobuf.Empty) returns (ListPtzTrackingPoliciesResponse);

  rpc GetPtzSlaveBinding(GetPtzSlaveBindingRequest) returns (GetPtzSlaveBindingResponse);
  rpc UpsertPtzSlaveBinding(UpsertPtzSlaveBindingRequest) returns (OperationStatus);
  rpc RemovePtzSlaveBinding(RemovePtzSlaveBindingRequest) returns (OperationStatus);
  rpc ListPtzSlaveBindings(google.protobuf.Empty) returns (ListPtzSlaveBindingsResponse);

  rpc ListCameraPermissions(ListCameraPermissionsRequest) returns (ListCameraPermissionsResponse);
  rpc SetUserCameraPermissions(SetUserCameraPermissionsRequest) returns (OperationStatus);
  rpc GetCameraAclMode(google.protobuf.Empty) returns (GetCameraAclModeResponse);
  rpc SetCameraAclMode(SetCameraAclModeRequest) returns (OperationStatus);
}

service StorageService {
  rpc AddStorage(Storage) returns (OperationStatus);
  rpc RemoveStorage(StorageRequest) returns (OperationStatus);
  rpc ListStorages(ListStoragesRequest) returns (ListStoragesResponse);
  rpc SetCameraStorages(SetCameraStoragesRequest) returns (OperationStatus);
  rpc GetCameraStorages(CameraStoragesRequest) returns (GetCameraStoragesResponse);
}

message SourceRequest {
  string source_id = 1;
}

message Credentials {
  string user = 1;
  string pass = 2;
}

message OnvifConnection {
  string ip = 1;
  int32 port = 2;
  // Full device-service URL as discovered via WS-Discovery (e.g.
  // "http://192.168.1.10:8899/onvif/device_service"). Empty = derive it from ip/port using
  // the standard "http://{ip}:{port}/onvif/device_service" template (manual entry case).
  string xaddr = 3;
}

enum RecordingMode {
  RECORDING_OFF = 0;
  RECORDING_CONTINUOUS = 1;
  RECORDING_PREALARM = 2;
}

message RecordingProfile {
  string id                  = 1;
  string name                = 2;
  RecordingMode mode         = 3;
  uint32 pre_record_seconds  = 4;
  uint32 post_record_seconds = 5;
  uint32 segment_seconds     = 6;
  bool   is_override_preset  = 7;
  bool   is_builtin          = 8;
}

enum ScheduleWindowKind {
  SCHEDULE_WINDOW_WEEKLY = 0;
  SCHEDULE_WINDOW_DATE   = 1;
}

// One recording window. Seconds are counted from local midnight in the schedule's timezone (so
// 0..86400); end_second is exclusive and end_second <= start_second means the window wraps past
// midnight.
message ScheduleWindow {
  ScheduleWindowKind kind = 1;
  uint32 day_of_week  = 2;  // 0=Sunday..6=Saturday, WEEKLY only
  string date         = 3;  // "YYYY-MM-DD", DATE only
  uint32 start_second = 4;
  uint32 end_second   = 5;
}

message RecordingSchedule {
  string id       = 1;
  string name     = 2;
  string timezone = 3;         // IANA id, e.g. "Europe/Moscow"
  // How many seconds before a window starts recording is switched on, so that the keyframe wait
  // and the notification round-trip are absorbed and recording is already running at start_second.
  uint32 lead_in_seconds = 4;
  repeated ScheduleWindow windows = 5;
}

message CameraStream {
  string stream_name                       = 1;
  string profile_token                     = 2;
  string path                              = 3;
  bool   web_rtc                           = 4;
  optional RecordingProfile recording_profile  = 5;
  optional RecordingProfile override_profile   = 6;
  optional bool disabled                   = 7;
  // "Available for recording", orthogonal to web_rtc: watching and archiving are separate
  // decisions. Optional rather than a plain bool on purpose — proto3 would default a plain bool to
  // false, the opposite of the column's default, so any producer that forgot to set it would
  // silently make every stream unrecordable. Unset therefore means true.
  optional bool recordable                 = 8;
  // Resolution as the camera declares it for this stream's ONVIF profile; 0 when not declared.
  // A seed for the monitor's adaptive stream choice, never the truth: an observed measurement wins,
  // because the real resolution can change without the configuration being edited.
  int32 declared_width                     = 9;
  int32 declared_height                    = 10;
  // What media_server last measured on this stream. Absent means nothing was measured recently —
  // the snapshot carries a TTL in the state store, so expiry and absence are the same thing and no
  // consumer has to judge an age.
  optional StreamStats stats               = 11;
}

// Observed parameters of a running stream. A snapshot of the last known state, not configuration
// and not a history: it says what the camera is sending now, which is the only thing that can tell
// a main stream from a sub-stream when the configuration says nothing about resolution.
message StreamStats {
  int32  width          = 1;
  int32  height         = 2;
  string codec          = 3;
  double fps            = 4;
  int64  bitrate_bps    = 5;
  // Unix milliseconds; 0 when the publisher could not say.
  int64  observed_at_ms = 6;
  // Which encoder the WebRTC path re-compresses this stream with, in the vocabulary
  // VMS_VIDEO_ENCODER accepts ("vaapi", "x264"), so the word shown is the word an operator would
  // type to force it. Empty means nothing is being re-encoded: either nobody is watching, or the
  // camera already publishes H.264 and the packets are copied through untouched.
  string transcode_encoder = 7;
}

message CameraSetup {
  string camera_id = 1;
  string server_id = 2;
  optional Credentials cred = 5;
  optional OnvifConnection onvif_conn = 6;
  repeated CameraStream streams = 9;
  optional string media_mtx_server_id = 10;
  bool onvif_events_enabled = 11;
  bool has_onvif_filters    = 12;
  bool onvif_managed        = 13;
  optional bool disabled    = 14;
  int32 onvif_poll_timeout_seconds = 15;
  int32 onvif_message_limit        = 16;
  string name = 17;
  // Recording schedules assigned to this camera (for the admin UI).
  repeated string schedule_ids = 18;
  // Whether any assigned schedule window is open right now — computed by VmsCfg when the setup is
  // read, never stored. While true the camera records continuously, overriding both the base
  // profile and any manual/alarm override.
  bool schedule_active = 19;
  // Read-only mirror of the assigned media router's stun_url, so the browser can build its ICE
  // config from the camera alone. Unset = no router assigned; empty = no STUN (LAN only).
  optional string effective_webrtc_stun_url = 20;
  // Which of this camera's streams to recover from the camera's own storage when its archive has a
  // gap; empty disables it. Camera-level because the card holds ONE archive: the camera records
  // either its main or its sub stream, chosen in the camera itself, and ONVIF does not say which.
  string edge_backfill_stream = 21;
  // Re-encode this camera's finished clips with ROI, keeping the detector's
  // boxes sharp and spending fewer bits on the rest. Camera-level rather than
  // per-stream because the boxes are the camera's: analytics watches the camera,
  // not one of its encodings, and a box has no meaning outside the frame it was
  // found in.
  bool roi_transcode = 22;

  // How long after a clip closes before it may be re-encoded, in hours; 0 means
  // as soon as the pass notices it. Per camera because how long fresh footage
  // must stay untouched is a property of what the camera watches, not of the
  // node. Fractional on purpose: useful values here are minutes as often as
  // hours.
  double roi_delay_hours = 23;

  // The band of ROI coverage -- the share of a clip's duration that has boxes on
  // it -- within which re-encoding is worth doing. Below the floor the detector
  // saw almost nothing, and degrading the whole clip on that word is a bad
  // trade; above the ceiling there is almost no background left to squeeze, so
  // the clip costs a generation of quality and returns nothing.
  //
  // Per camera because the band follows what is being watched: a corridor is
  // empty most of the day, a checkout counter never is, and one pair of numbers
  // cannot be right for both.
  double roi_min_coverage = 24;
  double roi_max_coverage = 25;

  // Ignore the object boxes this camera puts in its own RTSP metadata track.
  //
  // Not the same as switching analytics off on the device (that is the ONVIF metadata
  // configuration, and there is a control for it in the camera's ONVIF settings). This is
  // ours: the camera keeps sending, and we drop the documents before they are parsed --
  // nothing reaches the archive, the live overlay, or the ROI pass.
  //
  // It exists because a camera that reports boxes without saying what they are is worse
  // than one that reports nothing, once a real detector is running beside it. Ours sends
  // ten thousand boxes an hour, all classed "unknown" at confidence 1.0, and the ROI pass
  // prefers that source over the classified one purely because its timestamps are better.
  //
  // Per camera because it depends on the firmware in front of you: a camera that does fill
  // in tt:Class is worth listening to, and one deployment can have both.
  bool onvif_metadata_disabled = 26;

  // This camera really can move, and may be driven -- manually or by object tracking.
  //
  // Deliberately an administrator's word rather than the device's. A camera advertises the ONVIF
  // PTZ service whenever its firmware was built with one, motor or no motor, and
  // GetCapabilitiesSummaryAsync can only repeat what it is told. Acting on that answer puts a
  // joystick on a fixed camera and lets object tracking issue moves nothing will ever carry out.
  //
  // So the live probe stays for diagnostics -- the ONVIF settings page still shows what the camera
  // claims, which is how you check one before ticking this -- and every control that actually
  // drives the camera is gated on this flag instead.
  bool has_telemetry = 27;
}

message RecordingProfileRequest {
  string id = 1;
}

message SetStreamOverrideRequest {
  string camera_id   = 1;
  string stream_name = 2;
  string profile_id  = 3;
}

message ClearStreamOverrideRequest {
  string camera_id   = 1;
  string stream_name = 2;
}

message SetStreamRecordingProfileRequest {
  string camera_id   = 1;
  string stream_name = 2;
  string profile_id  = 3;
}

message SetCameraContinuousRecordingRequest {
  string camera_id = 1;
  bool   on        = 2;
}

message SetCameraContinuousRecordingResponse {
  bool   success = 1;
  string message = 2;
  // Streams whose base profile actually changed — the caller refreshes exactly these.
  repeated string changed_streams = 3;
}

message ListRecordingProfilesRequest {}

message ListRecordingProfilesResponse {
  repeated RecordingProfile profiles = 1;
}

message RecordingScheduleRequest {
  string id = 1;
}

message ListRecordingSchedulesRequest {}

message ListRecordingSchedulesResponse {
  repeated RecordingSchedule schedules = 1;
}

// Everything the schedule ticker needs in one answer, resolved against the wall clock here.
message RecordingScheduleStateResponse {
  // Cameras with at least one schedule assigned. A camera that drops off this list has lost its
  // last assignment, and the ticker forgets it so a re-assignment reads as a fresh transition.
  repeated string scheduled_camera_ids = 1;
  // Of those, the ones whose window is open right now.
  repeated string active_camera_ids = 2;
  // Earliest upcoming boundary across every assigned schedule; absent when none is scheduled.
  optional google.protobuf.Timestamp next_transition = 3;
}

message NotifyCamerasChangedRequest {
  repeated string camera_ids = 1;
}

message ExpiredAlarmOverride {
  string camera_id = 1;
  string stream_name = 2;
}

message ExpireAlarmOverridesResponse {
  repeated ExpiredAlarmOverride expired = 1;
}

message SetCameraSchedulesRequest {
  string camera_id = 1;
  repeated string schedule_ids = 2;
}

message GetCameraResponse {
  CameraSetup setup = 1;
  bool found = 2;
}

message MediaServerNode {
  string server_id = 1;
  string status    = 2;
  string fs_id     = 3;
  // The VmsOnvif instance that shares this node's camera network. ONVIF reaches cameras over the
  // same local subnet RTSP does, so a call for a camera must go to its own node's instance — a
  // central one has no route to it.
  string onvif_id  = 4;
  // The VmsLogger instance that can read this node's log files. Logs are written to local disk, so
  // one instance only ever sees the machine it runs on.
  string logger_id = 5;
  // The roi-transcode-svc instance that can reach this node's storage. It is handed absolute paths
  // to clips on local disk, so a central instance would either find nothing there or — worse — find
  // a different node's file at the same path and overwrite it.
  //
  // Empty means this node does not re-compress: the ROI service is genuinely optional, unlike the
  // three above.
  string roi_id    = 6;
}

message ListMediaServersRequest {}

message ListMediaServersResponse {
  repeated MediaServerNode servers = 1;
}

message ListCamerasRequest {
  string server_id = 1;
}

message ListCamerasResponse {
  repeated CameraSetup cameras = 1;
}

message OperationStatus {
  bool success = 1;
  string message = 2;
}

message Storage {
  string storage_id     = 1;
  string root_path      = 2;
  uint64 reserved_bytes = 3;
  // A disabled storage is kept, with its camera assignments, but takes no new recordings —
  // a disk pulled for maintenance rather than one removed from the system. Existing clips on
  // it stay readable: playback, export and cleanup all still resolve paths through it.
  //
  // Deliberately not expressed by deleting the row: that would drop the assignments too, and
  // putting the disk back would mean reassigning every camera by hand.
  bool   disabled       = 4;
  // How many cameras record here. Deleting the storage takes their assignments with it —
  // the foreign key cascades — so the operator is told the cost before paying it.
  uint32 camera_count   = 5;
}

message CameraStorageAssignment {
  string camera_id  = 1;
  string storage_id = 2;
  int32  priority   = 3;
}

message StorageRequest {
  string storage_id = 1;
}

message CameraStoragesRequest {
  string camera_id = 1;
}

message ListStoragesRequest {}

message ListStoragesResponse {
  repeated Storage storages = 1;
}

message SetCameraStoragesRequest {
  string camera_id = 1;
  repeated CameraStorageAssignment assignments = 2;
}

message GetCameraStoragesResponse {
  repeated CameraStorageAssignment assignments = 1;
}

message MediaMtxServer {
  string id          = 1;
  string name        = 2;
  string host        = 3;
  string webrtc_host = 4;  // optional; empty = browser uses window.location.hostname
  int32  rtsp_port   = 5;
  int32  webrtc_port = 6;
  int32  api_port    = 7;
  // STUN server the browser uses when negotiating WHEP playback. Empty = no STUN at all,
  // i.e. host candidates only (LAN-only viewing, no public server round-trip).
  string stun_url    = 8;
  // The media server node this MediaMTX serves. Empty means shared — it answers for any node,
  // which is what a single-box installation wants. Cameras are only assigned a server that is
  // either theirs or shared: the push travels from media_server to MediaMTX, so a cross-node
  // assignment would carry video over whatever link separates the two.
  string server_id   = 9;
  // RTSP publish account used by media_server. Empty user means unauthenticated publish.
  string publish_user = 10;
  string publish_pass = 11;
  // Read account used by WHEP and the MediaMTX Control API. Empty user means unauthenticated read.
  string read_user    = 12;
  string read_pass    = 13;
  // Re-encode HEVC cameras to H.264 before publishing them here. Off by default: MediaMTX carries
  // H.265 over WebRTC, so a browser that decodes it gets the camera's own stream with no encoder in
  // the way -- cheaper than any hardware acceleration, because nothing is encoded at all.
  //
  // Turn it on where the viewers cannot play passthrough, and there are two separate reasons:
  // the browser (Firefox has no HEVC in WebRTC; Chrome's depends on platform and decoder), and the
  // stream (WebRTC refuses H.265 carrying B-frames outright, whatever the browser supports).
  //
  // It lives on the router rather than on the camera because it describes how streams are prepared
  // for the people watching through it -- the same reason stun_url is here and not on a camera.
  bool transcode_hevc = 14;
}

message MediaMtxServerRequest {
  string id = 1;
}

message ListMediaMtxServersRequest {}

message ListMediaMtxServersResponse {
  repeated MediaMtxServer servers = 1;
}

message GetOrAssignMediaMtxServerResponse {
  bool          found  = 1;
  MediaMtxServer server = 2;
}

message MonitorSlot {
  int32  slot_index = 1;
  string camera_id  = 2;
  // Which stream this slot is pinned to for the caller, empty for automatic. Unlike camera_id this
  // is per operator: a shared wall is watched by several people, and one of them pinning a stream
  // must not change what the others see.
  string stream_name = 3;
}

message MonitorSetup {
  string           monitor_id = 1;
  string           name       = 2;
  string           layout     = 3;
  repeated string  camera_ids = 4;
  repeated MonitorSlot slots  = 5;
  // "wall" (shared, admin-managed) or "investigation" (private to owner).
  string           kind       = 6;
  // Keycloak preferred_username of the owner, empty when authentication is disabled. Always taken
  // from the caller's token by web_vms — never trusted from a client-supplied body.
  string           owner      = 7;
}

// owner scopes the answer: walls are returned to everyone, investigation boards only to their
// owner. It is the access boundary, so it is applied in SQL rather than by the caller.
message ListMonitorsRequest {
  string owner = 1;
}

message ListMonitorsResponse {
  repeated MonitorSetup monitors = 1;
}

message RemoveMonitorRequest {
  string monitor_id = 1;
  string owner      = 2;
}

message SetMonitorCamerasRequest {
  string          monitor_id = 1;
  repeated string camera_ids = 2;
  string          owner      = 3;
}

message SetMonitorSlotStreamRequest {
  string monitor_id  = 1;
  int32  slot_index  = 2;
  // Empty releases the pin, putting the slot back on automatic selection.
  string stream_name = 3;
  string owner       = 4;
}

message SetMonitorSlotRequest {
  string monitor_id = 1;
  int32  slot_index  = 2;
  string camera_id  = 3;
  string owner      = 4;
}

// Empties one cell. Separate from SetMonitorSlot rather than an empty camera_id there: "no camera
// in this cell" is a deletion, and an upsert with a blank id is exactly the kind of write that
// silently creates junk rows when a caller forgets to fill something in.
message ClearMonitorSlotRequest {
  string monitor_id = 1;
  int32  slot_index = 2;
  string owner      = 3;
}

// Sharing a board is a copy, not a grant: the recipient becomes the owner of an independent board
// and can edit or delete it without affecting the original.
message CopyMonitorRequest {
  string monitor_id   = 1;
  string owner        = 2;
  string target_owner = 3;
}

message ActivateAlarmOverrideRequest {
  string camera_id                    = 1;
  optional string stream_name         = 2;
  google.protobuf.Timestamp until     = 3;
}

message ActivateAlarmOverrideResponse {
  bool activated = 1;
}

message OnvifAlarmFilter {
  string id              = 1;
  string camera_id       = 2;
  string filter_text     = 3;
  int32  timeout_seconds = 4;
  string text_filter     = 5;
}

message ListOnvifAlarmFiltersRequest {
  string camera_id = 1;
}

message ListOnvifAlarmFiltersResponse {
  repeated OnvifAlarmFilter filters = 1;
}

message OnvifAlarmFilterRequest {
  string id = 1;
}

message OnvifSubscriptionRequest {
  string camera_id = 1;
}

message OnvifCameraEntry {
  string camera_id  = 1;
  bool   subscribed = 2;
  int32  poll_timeout_seconds = 3;
  int32  message_limit        = 4;
}

message OnvifSubscriptionsResponse {
  repeated OnvifCameraEntry cameras = 1;
}

// Whether VmsOnvif keeps a pull-point subscription open for this camera. Named for what it does:
// it writes onvif_event_subscription.subscribed and has nothing to do with arming, which is
// camera-wide and lives in camera_states.
message SetOnvifSubscribedRequest {
  string camera_id  = 1;
  bool   subscribed = 2;
}

message SetOnvifPollConfigRequest {
  string camera_id           = 1;
  int32  poll_timeout_seconds = 2;
  int32  message_limit        = 3;
}

message GetCamStateRequest {
  string camera_id = 1;
}

message GetCamStateResponse {
  bool armed = 1;
}

message SetCamStateRequest {
  string camera_id = 1;
  bool   armed     = 2;
}

message AnalyticsWatch {
  string camera_id       = 1;  // PK; also the watch_id sent to video_a
  string stream_name     = 2;
  bool   enabled          = 3;
  repeated string classes = 4;  // "person"/"face"/"vehicle"/"license_plate"
  float  min_confidence   = 5;
  uint32 sample_fps       = 6;
  bool   armed            = 7;  // read-only; populated from camera_states.armed on read
  bool   attach_debug_crops = 8;  // debug: video_a attaches a JPEG of each detection to the event
  // Seconds of recording kept after the last detection before the retention event closes itself.
  // Mirrors OnvifAlarmFilter.timeout_seconds — the same knob for the analytics source.
  uint32 timeout_seconds  = 9;
  // Persist this camera's detection embeddings for forensic similarity search.
  bool   store_embeddings = 10;
}

message ListAnalyticsWatchesRequest {
  optional string camera_id = 1;
}

message ListAnalyticsWatchesResponse {
  repeated AnalyticsWatch watches = 1;
}

message UpsertAnalyticsWatchRequest {
  AnalyticsWatch watch = 1;
}

message RemoveAnalyticsWatchRequest {
  string camera_id = 1;
}

// ── PTZ calibration (per camera, 1:1) ────────────────────────────────────────
// Maps normalized pan/tilt commands to image-space motion. Used by object tracking
// on cameras mounted in arbitrary orientations.

enum PtzCalibrationMethod {
  PTZ_CALIBRATION_METHOD_UNSPECIFIED = 0;
  PTZ_CALIBRATION_AUTO   = 1;
  PTZ_CALIBRATION_WIZARD = 2;
}

message PtzCalibration {
  string camera_id = 1;
  // Image-space motion caused by a unit pan+ command (normalized frame coords).
  float pan_dx  = 2;
  float pan_dy  = 3;
  // Image-space motion caused by a unit tilt+ command.
  float tilt_dx = 4;
  float tilt_dy = 5;
  float confidence = 6;
  google.protobuf.Timestamp calibrated_at = 7;
  PtzCalibrationMethod method = 8;
}

message GetPtzCalibrationRequest {
  string camera_id = 1;
}

message GetPtzCalibrationResponse {
  bool found = 1;
  PtzCalibration calibration = 2;
}

message UpsertPtzCalibrationRequest {
  PtzCalibration calibration = 1;
}

message RemovePtzCalibrationRequest {
  string camera_id = 1;
}

// ── Self-guidance: a camera that follows objects without an operator ─────────

// Whether this camera tracks objects on its own, and which ones it should prefer.
//
// The mode belongs to the camera rather than to a monitor session: a camera with it on keeps
// tracking whether or not anyone is watching, and comes back tracking after a restart. An operator
// looking at the monitor may still take over and name a particular object, but that override is
// held in memory by the tracking service and lapses when the object is finally lost.
//
// Master/slave is master_camera_id below: the same policy, reading its objects from somewhere
// else. What to follow (kinds, sources) means the same thing either way, which is why it is one
// message and not two -- only where the boxes come from differs, and with it which control law
// runs (closed loop on one's own picture, open loop through a binding on another's).
message PtzTrackingPolicy {
  string camera_id = 1;
  bool   enabled   = 2;
  // Object kinds in priority order: the first kind on this list that is present in the picture is
  // the one followed. Empty means any object will do. The words are the ones on the wire --
  // "person", "face", "vehicle", "license_plate", "animal" -- rather than the DetectionKind enum,
  // which lives in vms_analytics.proto and is not worth importing for five strings.
  // AnalyticsWatch.classes above is spelled the same way for the same reason.
  repeated string kinds = 3;
  // Which producers of boxes to follow: "cv" (the detector) and/or "onvif" (the camera's own
  // metadata track). Empty means either will do.
  repeated string sources = 4;
  // Whose objects to follow. Unset means this camera's own -- it finds the objects and moves its
  // own motor. Set names a stationary master with analytics, and this camera becomes a slave that
  // is aimed through PtzSlaveBinding below; it needs no analytics of its own, and usually cannot
  // see what it is being pointed at until it gets there.
  optional string master_camera_id = 5;
}

message GetPtzTrackingPolicyRequest {
  string camera_id = 1;
}

message GetPtzTrackingPolicyResponse {
  // False when the camera has no policy row, which reads as switched off.
  bool found = 1;
  PtzTrackingPolicy policy = 2;
}

message UpsertPtzTrackingPolicyRequest {
  PtzTrackingPolicy policy = 1;
}

// Only the cameras that have a row. The tracking service asks for this on startup and after every
// configuration change to work out which sessions should exist, and going camera by camera would
// be one round trip per camera in the deployment to learn that almost none of them track.
message ListPtzTrackingPoliciesResponse {
  repeated PtzTrackingPolicy policies = 1;
}

// ── Master/slave: aiming one camera at another camera's objects ──────────────

// How a point in the master's picture becomes a place for the slave to look.
//
// There are no geo-coordinates in this system, so the only thing tying the pair together is a
// handful of correspondences an operator marked by hand: "this spot in the master's frame is this
// position of the slave". Everything between the marked spots is interpolated.
//
// A point in an image is a ray, not a direction: how far along it the object is decides where the
// slave should look, and no calibration can recover that. The assumption that closes the gap is
// that objects stand on the ground -- so the aiming point is the bottom edge of the object's box,
// where it meets the ground, and the operator marks points on the ground too.
message PtzSlaveBinding {
  // One motor, one source of hints: a slave belongs to exactly one master.
  string slave_camera_id  = 1;
  string master_camera_id = 2;
  PtzSlaveBindingMethod method = 3;
  google.protobuf.Timestamp calibrated_at = 4;
  repeated PtzSlaveBindingPoint points = 5;
}

enum PtzSlaveBindingMethod {
  // Interpolate between the marked positions and command the slave there. Needs a camera that
  // actually executes AbsoluteMove -- which GetCapabilities cannot be trusted about, so the
  // wizard verifies it by moving the camera and watching the picture change.
  PTZ_SLAVE_BINDING_ABSOLUTE = 0;
  // Drive to the preset of the nearest marked point. Coarser, and the only thing that works on a
  // camera whose absolute positioning is a stub.
  PTZ_SLAVE_BINDING_PRESETS  = 1;
}

// One correspondence: a place in the master's frame, and where the slave was pointing when the
// operator marked it.
//
// A point may carry a position, a preset, or both, and both is the normal case rather than
// redundancy: the operator drives the slave to the spot once, and from that one position the
// coordinates can be read for free (GetStatus) and a preset recorded with one button (SetPreset
// stores wherever the camera currently points). Storing whatever was obtainable is what lets the
// method be changed afterwards without marking the zones out again -- and it is why a camera whose
// GetStatus answers zeroes does not spoil the survey: its points simply have no coordinates.
message PtzSlaveBindingPoint {
  // Where in the master's frame, 0..1 from the top-left -- the bottom edge of the object's box.
  float master_x = 1;
  float master_y = 2;
  // Where the slave looked, in whatever space the camera answers in. Deliberately not interpreted:
  // both reading and commanding happen in the camera's own space, and the interpolation is fitted
  // to the measurements, so degrees and normalised -1..1 work out the same.
  optional float pan  = 3;
  optional float tilt = 4;
  // The preset standing at the same position, if the operator picked or made one.
  string preset_token = 5;
  // Carried so the list can name the preset without asking the camera on every render.
  string preset_name  = 6;
}

message GetPtzSlaveBindingRequest {
  string slave_camera_id = 1;
}

message GetPtzSlaveBindingResponse {
  bool found = 1;
  PtzSlaveBinding binding = 2;
}

// Replaces the binding whole, points included. A survey is edited as one thing -- adding a point
// changes what every other point interpolates to -- so there is no per-point RPC to get half-
// applied.
message UpsertPtzSlaveBindingRequest {
  PtzSlaveBinding binding = 1;
}

message RemovePtzSlaveBindingRequest {
  string slave_camera_id = 1;
}

message ListPtzSlaveBindingsResponse {
  repeated PtzSlaveBinding bindings = 1;
}

// ── Analytics sources, aggregated per camera ─────────────────────────────────

// One camera's analytics configuration across every source that can raise a detection for it.
// Read-only aggregate over tables VmsCfg already owns. Writes stay on the per-source RPCs above:
// each carries its own side effects (cache invalidation, the camera-state-changed topic, the
// analytics control plane), and a fan-out write has no sane meaning when three of four parts
// succeed -- the form would have nothing honest to show.
message CameraAnalyticsSources {
  string camera_id = 1;
  // Unset = no analytics_watch row at all. Different from "exists and is switched off".
  optional AnalyticsWatch cv = 2;
  OnvifMetadataSourceState onvif_metadata = 3;
  OnvifEventsSourceState   onvif_events   = 4;
}

// camera_setup.onvif_metadata_disabled, inverted -- named for what it enables, so all three
// sources read the same way round. Whether the device actually emits boxes is device state and
// lives in VmsOnvif; the gateway merges it.
message OnvifMetadataSourceState {
  bool accepted = 1;
}

message OnvifEventsSourceState {
  bool  managed              = 1;  // a row exists in onvif_event_subscription
  bool  subscribed           = 2;
  int32 poll_timeout_seconds = 3;
  int32 message_limit        = 4;
  int32 filter_count         = 5;  // count, not the filters: the tab summarises, the panel edits
}

message CameraAnalyticsSourcesRequest {
  repeated string camera_ids = 1;  // empty = every camera
}

message CameraAnalyticsSourcesResponse {
  repeated CameraAnalyticsSources cameras = 1;
}

// ── Per-camera user permissions ──────────────────────────────────────────────
// Grants are keyed by Keycloak preferred_username, the same identity string monitor.owner uses.
// The admin role bypasses all of this, and so does the 'open' ACL mode.

message CameraPermissionFlags {
  bool view_live    = 1;
  bool view_archive = 2;
  bool ptz          = 3;
  bool control      = 4;  // arming, recording overrides, manual retention, relay outputs
  bool export       = 5;  // downloading a clip as a file
}

message CameraPermission {
  string camera_id = 1;
  CameraPermissionFlags flags = 2;
}

// Effective permission on a camera is the OR of all_cameras and the matching cameras entry.
message UserCameraPermissions {
  string username = 1;
  optional CameraPermissionFlags all_cameras = 2;  // unset = no blanket grant
  repeated CameraPermission cameras = 3;
}

// Empty username = every user holding any grant (admin UI); set = one user (gateway cache fill).
message ListCameraPermissionsRequest {
  optional string username = 1;
}

message ListCameraPermissionsResponse {
  repeated UserCameraPermissions users = 1;
}

// Replaces that user's grants wholesale — the admin UI edits the whole matrix and applies it.
message SetUserCameraPermissionsRequest {
  UserCameraPermissions permissions = 1;
}

enum CameraAclMode {
  // Pre-ACL behaviour: every authenticated user reaches every camera.
  CAMERA_ACL_OPEN     = 0;
  CAMERA_ACL_ENFORCED = 1;
}

message GetCameraAclModeResponse {
  CameraAclMode mode = 1;
}

message SetCameraAclModeRequest {
  CameraAclMode mode = 1;
}

syntax = "proto3";

package vms.cfg;

service CfgService {
  rpc ListCameras(ListCamerasRequest) returns (ListCamerasResponse);
  rpc ListMediaServers(ListMediaServersRequest) returns (ListMediaServersResponse);
  rpc RegisterMediaServer(MediaServerNode) returns (OperationStatus);
  rpc SetupCamera(CameraSetup) returns (OperationStatus);
  rpc SetCameraState(CameraState) returns (OperationStatus);
  rpc RemoveCamera(SourceRequest) returns (OperationStatus);
  rpc GetCameraState(SourceRequest) returns (CameraStateResponse);
}

message SourceRequest {
  string source_id = 1;
}

message Credentials {
  string user = 1;
  string pass = 2;
}

message OnvifConnection {
  string ip = 1;
  int32 port = 2;
}

message OnvifState {
  string rtsp_url = 4;
}

message PreAlarmRecordingSettings {
  uint32 pre_record_seconds = 1;
  uint32 post_record_seconds = 2;
  uint32 segment_seconds = 3;
}

enum RecordingMode {
  RECORDING_OFF = 0;
  RECORDING_CONTINUOUS = 1;
  RECORDING_PREALARM = 2;
}

message CameraState {
  string camera_id = 1;
  RecordingMode recording_mode = 2;
  bool web_rtc = 3;
}

message CameraSetup {
  string camera_id = 1;
  string server_id = 2;
  string rtsp_url = 4;
  optional Credentials cred = 5;
  optional OnvifConnection onvif_conn = 6;
  optional CameraState state = 7;
  optional PreAlarmRecordingSettings pre_alarm = 8;
}

message MediaServerNode {
  string server_id = 1;
  string status = 2;
}

message ListMediaServersRequest {}

message ListMediaServersResponse {
  repeated MediaServerNode servers = 1;
}

message ListCamerasRequest {
  string server_id = 1;
}

message ListCamerasResponse {
  repeated CameraSetup cameras = 1;
}

message OperationStatus {
  bool success = 1;
  string message = 2;
}

message CameraStateResponse {
  CameraState state = 1;
  CameraSetup setup = 3;
  bool found = 2;
}

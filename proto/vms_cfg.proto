syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

package vms.cfg;

service CfgService {
  rpc ListCameras(ListCamerasRequest) returns (ListCamerasResponse);
  rpc ListMediaServers(ListMediaServersRequest) returns (ListMediaServersResponse);
  rpc SetupCamera(CameraSetup) returns (OperationStatus);
  rpc RemoveCamera(SourceRequest) returns (OperationStatus);
  rpc GetCamera(SourceRequest) returns (GetCameraResponse);
  rpc ListRecordingProfiles(ListRecordingProfilesRequest) returns (ListRecordingProfilesResponse);
  rpc UpsertRecordingProfile(RecordingProfile) returns (OperationStatus);
  rpc RemoveRecordingProfile(RecordingProfileRequest) returns (OperationStatus);
  rpc SetStreamOverride(SetStreamOverrideRequest) returns (OperationStatus);
  rpc ClearStreamOverride(ClearStreamOverrideRequest) returns (OperationStatus);
  rpc SetStreamRecordingProfile(SetStreamRecordingProfileRequest) returns (OperationStatus);
  rpc ActivateAlarmOverride(ActivateAlarmOverrideRequest) returns (ActivateAlarmOverrideResponse);
  rpc ListRecordingSchedules(ListRecordingSchedulesRequest) returns (ListRecordingSchedulesResponse);
  rpc UpsertRecordingSchedule(RecordingSchedule) returns (OperationStatus);
  rpc RemoveRecordingSchedule(RecordingScheduleRequest) returns (OperationStatus);
  rpc SetCameraSchedules(SetCameraSchedulesRequest) returns (OperationStatus);
  rpc ListMediaMtxServers(ListMediaMtxServersRequest) returns (ListMediaMtxServersResponse);
  rpc UpsertMediaMtxServer(MediaMtxServer) returns (OperationStatus);
  rpc RemoveMediaMtxServer(MediaMtxServerRequest) returns (OperationStatus);
  rpc GetOrAssignMediaMtxServer(SourceRequest) returns (GetOrAssignMediaMtxServerResponse);
  rpc ListMonitors(ListMonitorsRequest) returns (ListMonitorsResponse);
  rpc UpsertMonitor(MonitorSetup) returns (MonitorSetup);
  rpc RemoveMonitor(RemoveMonitorRequest) returns (OperationStatus);
  rpc SetMonitorCameras(SetMonitorCamerasRequest) returns (OperationStatus);
  rpc SetMonitorSlot(SetMonitorSlotRequest) returns (OperationStatus);
  rpc ClearMonitorSlot(ClearMonitorSlotRequest) returns (OperationStatus);
  rpc CopyMonitor(CopyMonitorRequest) returns (MonitorSetup);
  rpc ListOnvifAlarmFilters(ListOnvifAlarmFiltersRequest) returns (ListOnvifAlarmFiltersResponse);
  rpc UpsertOnvifAlarmFilter(OnvifAlarmFilter) returns (OnvifAlarmFilter);
  rpc RemoveOnvifAlarmFilter(OnvifAlarmFilterRequest) returns (OperationStatus);

  rpc SubscribeOnvifEvents(OnvifSubscriptionRequest) returns (OperationStatus);
  rpc UnsubscribeOnvifEvents(OnvifSubscriptionRequest) returns (OperationStatus);
  rpc ListOnvifSubscriptions(google.protobuf.Empty) returns (OnvifSubscriptionsResponse);
  rpc SetOnvifArmed(SetOnvifArmedRequest) returns (OperationStatus);
  rpc SetOnvifPollConfig(SetOnvifPollConfigRequest) returns (OperationStatus);

  rpc GetCamState(GetCamStateRequest) returns (GetCamStateResponse);
  rpc SetCamState(SetCamStateRequest) returns (OperationStatus);

  rpc ListAnalyticsWatches(ListAnalyticsWatchesRequest) returns (ListAnalyticsWatchesResponse);
  rpc UpsertAnalyticsWatch(UpsertAnalyticsWatchRequest) returns (OperationStatus);
  rpc RemoveAnalyticsWatch(RemoveAnalyticsWatchRequest) returns (OperationStatus);

  rpc ListCameraPermissions(ListCameraPermissionsRequest) returns (ListCameraPermissionsResponse);
  rpc SetUserCameraPermissions(SetUserCameraPermissionsRequest) returns (OperationStatus);
  rpc GetCameraAclMode(google.protobuf.Empty) returns (GetCameraAclModeResponse);
  rpc SetCameraAclMode(SetCameraAclModeRequest) returns (OperationStatus);
}

service StorageService {
  rpc AddStorage(Storage) returns (OperationStatus);
  rpc RemoveStorage(StorageRequest) returns (OperationStatus);
  rpc ListStorages(ListStoragesRequest) returns (ListStoragesResponse);
  rpc SetCameraStorages(SetCameraStoragesRequest) returns (OperationStatus);
  rpc GetCameraStorages(CameraStoragesRequest) returns (GetCameraStoragesResponse);
}

message SourceRequest {
  string source_id = 1;
}

message Credentials {
  string user = 1;
  string pass = 2;
}

message OnvifConnection {
  string ip = 1;
  int32 port = 2;
  // Full device-service URL as discovered via WS-Discovery (e.g.
  // "http://192.168.1.10:8899/onvif/device_service"). Empty = derive it from ip/port using
  // the standard "http://{ip}:{port}/onvif/device_service" template (manual entry case).
  string xaddr = 3;
}

enum RecordingMode {
  RECORDING_OFF = 0;
  RECORDING_CONTINUOUS = 1;
  RECORDING_PREALARM = 2;
}

message RecordingProfile {
  string id                  = 1;
  string name                = 2;
  RecordingMode mode         = 3;
  uint32 pre_record_seconds  = 4;
  uint32 post_record_seconds = 5;
  uint32 segment_seconds     = 6;
  bool   is_override_preset  = 7;
  bool   is_builtin          = 8;
}

enum ScheduleWindowKind {
  SCHEDULE_WINDOW_WEEKLY = 0;
  SCHEDULE_WINDOW_DATE   = 1;
}

// One recording window. Seconds are counted from local midnight in the schedule's timezone (so
// 0..86400); end_second is exclusive and end_second <= start_second means the window wraps past
// midnight.
message ScheduleWindow {
  ScheduleWindowKind kind = 1;
  uint32 day_of_week  = 2;  // 0=Sunday..6=Saturday, WEEKLY only
  string date         = 3;  // "YYYY-MM-DD", DATE only
  uint32 start_second = 4;
  uint32 end_second   = 5;
}

message RecordingSchedule {
  string id       = 1;
  string name     = 2;
  string timezone = 3;         // IANA id, e.g. "Europe/Moscow"
  // How many seconds before a window starts recording is switched on, so that the keyframe wait
  // and the notification round-trip are absorbed and recording is already running at start_second.
  uint32 lead_in_seconds = 4;
  repeated ScheduleWindow windows = 5;
}

message CameraStream {
  string stream_name                       = 1;
  string profile_token                     = 2;
  string path                              = 3;
  bool   web_rtc                           = 4;
  optional RecordingProfile recording_profile  = 5;
  optional RecordingProfile override_profile   = 6;
  optional bool disabled                   = 7;
}

message CameraSetup {
  string camera_id = 1;
  string server_id = 2;
  optional Credentials cred = 5;
  optional OnvifConnection onvif_conn = 6;
  repeated CameraStream streams = 9;
  optional string media_mtx_server_id = 10;
  bool onvif_events_enabled = 11;
  bool has_onvif_filters    = 12;
  bool onvif_managed        = 13;
  optional bool disabled    = 14;
  int32 onvif_poll_timeout_seconds = 15;
  int32 onvif_message_limit        = 16;
  string name = 17;
  // Recording schedules assigned to this camera (for the admin UI).
  repeated string schedule_ids = 18;
  // Whether any assigned schedule window is open right now — computed by VmsCfg when the setup is
  // read, never stored. While true the camera records continuously, overriding both the base
  // profile and any manual/alarm override.
  bool schedule_active = 19;
  // Read-only mirror of the assigned media router's stun_url, so the browser can build its ICE
  // config from the camera alone. Unset = no router assigned; empty = no STUN (LAN only).
  optional string effective_webrtc_stun_url = 20;
  // Which of this camera's streams to recover from the camera's own storage when its archive has a
  // gap; empty disables it. Camera-level because the card holds ONE archive: the camera records
  // either its main or its sub stream, chosen in the camera itself, and ONVIF does not say which.
  string edge_backfill_stream = 21;
}

message RecordingProfileRequest {
  string id = 1;
}

message SetStreamOverrideRequest {
  string camera_id   = 1;
  string stream_name = 2;
  string profile_id  = 3;
}

message ClearStreamOverrideRequest {
  string camera_id   = 1;
  string stream_name = 2;
}

message SetStreamRecordingProfileRequest {
  string camera_id   = 1;
  string stream_name = 2;
  string profile_id  = 3;
}

message ListRecordingProfilesRequest {}

message ListRecordingProfilesResponse {
  repeated RecordingProfile profiles = 1;
}

message RecordingScheduleRequest {
  string id = 1;
}

message ListRecordingSchedulesRequest {}

message ListRecordingSchedulesResponse {
  repeated RecordingSchedule schedules = 1;
}

message SetCameraSchedulesRequest {
  string camera_id = 1;
  repeated string schedule_ids = 2;
}

message GetCameraResponse {
  CameraSetup setup = 1;
  bool found = 2;
}

message MediaServerNode {
  string server_id = 1;
  string status    = 2;
  string fs_id     = 3;
  // The VmsOnvif instance that shares this node's camera network. ONVIF reaches cameras over the
  // same local subnet RTSP does, so a call for a camera must go to its own node's instance — a
  // central one has no route to it.
  string onvif_id  = 4;
}

message ListMediaServersRequest {}

message ListMediaServersResponse {
  repeated MediaServerNode servers = 1;
}

message ListCamerasRequest {
  string server_id = 1;
}

message ListCamerasResponse {
  repeated CameraSetup cameras = 1;
}

message OperationStatus {
  bool success = 1;
  string message = 2;
}

message Storage {
  string storage_id     = 1;
  string root_path      = 2;
  uint64 reserved_bytes = 3;
}

message CameraStorageAssignment {
  string camera_id  = 1;
  string storage_id = 2;
  int32  priority   = 3;
}

message StorageRequest {
  string storage_id = 1;
}

message CameraStoragesRequest {
  string camera_id = 1;
}

message ListStoragesRequest {}

message ListStoragesResponse {
  repeated Storage storages = 1;
}

message SetCameraStoragesRequest {
  string camera_id = 1;
  repeated CameraStorageAssignment assignments = 2;
}

message GetCameraStoragesResponse {
  repeated CameraStorageAssignment assignments = 1;
}

message MediaMtxServer {
  string id          = 1;
  string name        = 2;
  string host        = 3;
  string webrtc_host = 4;  // optional; empty = browser uses window.location.hostname
  int32  rtsp_port   = 5;
  int32  webrtc_port = 6;
  int32  api_port    = 7;
  // STUN server the browser uses when negotiating WHEP playback. Empty = no STUN at all,
  // i.e. host candidates only (LAN-only viewing, no public server round-trip).
  string stun_url    = 8;
  // The media server node this MediaMTX serves. Empty means shared — it answers for any node,
  // which is what a single-box installation wants. Cameras are only assigned a server that is
  // either theirs or shared: the push travels from media_server to MediaMTX, so a cross-node
  // assignment would carry video over whatever link separates the two.
  string server_id   = 9;
}

message MediaMtxServerRequest {
  string id = 1;
}

message ListMediaMtxServersRequest {}

message ListMediaMtxServersResponse {
  repeated MediaMtxServer servers = 1;
}

message GetOrAssignMediaMtxServerResponse {
  bool          found  = 1;
  MediaMtxServer server = 2;
}

message MonitorSlot {
  int32  slot_index = 1;
  string camera_id  = 2;
}

message MonitorSetup {
  string           monitor_id = 1;
  string           name       = 2;
  string           layout     = 3;
  repeated string  camera_ids = 4;
  repeated MonitorSlot slots  = 5;
  // "wall" (shared, admin-managed) or "investigation" (private to owner).
  string           kind       = 6;
  // Keycloak preferred_username of the owner, empty when authentication is disabled. Always taken
  // from the caller's token by web_vms — never trusted from a client-supplied body.
  string           owner      = 7;
}

// owner scopes the answer: walls are returned to everyone, investigation boards only to their
// owner. It is the access boundary, so it is applied in SQL rather than by the caller.
message ListMonitorsRequest {
  string owner = 1;
}

message ListMonitorsResponse {
  repeated MonitorSetup monitors = 1;
}

message RemoveMonitorRequest {
  string monitor_id = 1;
  string owner      = 2;
}

message SetMonitorCamerasRequest {
  string          monitor_id = 1;
  repeated string camera_ids = 2;
  string          owner      = 3;
}

message SetMonitorSlotRequest {
  string monitor_id = 1;
  int32  slot_index  = 2;
  string camera_id  = 3;
  string owner      = 4;
}

// Empties one cell. Separate from SetMonitorSlot rather than an empty camera_id there: "no camera
// in this cell" is a deletion, and an upsert with a blank id is exactly the kind of write that
// silently creates junk rows when a caller forgets to fill something in.
message ClearMonitorSlotRequest {
  string monitor_id = 1;
  int32  slot_index = 2;
  string owner      = 3;
}

// Sharing a board is a copy, not a grant: the recipient becomes the owner of an independent board
// and can edit or delete it without affecting the original.
message CopyMonitorRequest {
  string monitor_id   = 1;
  string owner        = 2;
  string target_owner = 3;
}

message ActivateAlarmOverrideRequest {
  string camera_id                    = 1;
  optional string stream_name         = 2;
  google.protobuf.Timestamp until     = 3;
}

message ActivateAlarmOverrideResponse {
  bool activated = 1;
}

message OnvifAlarmFilter {
  string id              = 1;
  string camera_id       = 2;
  string filter_text     = 3;
  int32  timeout_seconds = 4;
  string text_filter     = 5;
}

message ListOnvifAlarmFiltersRequest {
  string camera_id = 1;
}

message ListOnvifAlarmFiltersResponse {
  repeated OnvifAlarmFilter filters = 1;
}

message OnvifAlarmFilterRequest {
  string id = 1;
}

message OnvifSubscriptionRequest {
  string camera_id = 1;
}

message OnvifCameraEntry {
  string camera_id  = 1;
  bool   subscribed = 2;
  int32  poll_timeout_seconds = 3;
  int32  message_limit        = 4;
}

message OnvifSubscriptionsResponse {
  repeated OnvifCameraEntry cameras = 1;
}

message SetOnvifArmedRequest {
  string camera_id = 1;
  bool   armed     = 2;
}

message SetOnvifPollConfigRequest {
  string camera_id           = 1;
  int32  poll_timeout_seconds = 2;
  int32  message_limit        = 3;
}

message GetCamStateRequest {
  string camera_id = 1;
}

message GetCamStateResponse {
  bool armed = 1;
}

message SetCamStateRequest {
  string camera_id = 1;
  bool   armed     = 2;
}

message AnalyticsWatch {
  string camera_id       = 1;  // PK; also the watch_id sent to video_a
  string stream_name     = 2;
  bool   enabled          = 3;
  repeated string classes = 4;  // "person"/"face"/"vehicle"/"license_plate"
  float  min_confidence   = 5;
  uint32 sample_fps       = 6;
  bool   armed            = 7;  // read-only; populated from camera_states.armed on read
  bool   attach_debug_crops = 8;  // debug: video_a attaches a JPEG of each detection to the event
  // Seconds of recording kept after the last detection before the retention event closes itself.
  // Mirrors OnvifAlarmFilter.timeout_seconds — the same knob for the analytics source.
  uint32 timeout_seconds  = 9;
}

message ListAnalyticsWatchesRequest {
  optional string camera_id = 1;
}

message ListAnalyticsWatchesResponse {
  repeated AnalyticsWatch watches = 1;
}

message UpsertAnalyticsWatchRequest {
  AnalyticsWatch watch = 1;
}

message RemoveAnalyticsWatchRequest {
  string camera_id = 1;
}

// ── Per-camera user permissions ──────────────────────────────────────────────
// Grants are keyed by Keycloak preferred_username, the same identity string monitor.owner uses.
// The admin role bypasses all of this, and so does the 'open' ACL mode.

message CameraPermissionFlags {
  bool view_live    = 1;
  bool view_archive = 2;
  bool ptz          = 3;
  bool control      = 4;  // arming, recording overrides, manual retention, relay outputs
  bool export       = 5;  // downloading a clip as a file
}

message CameraPermission {
  string camera_id = 1;
  CameraPermissionFlags flags = 2;
}

// Effective permission on a camera is the OR of all_cameras and the matching cameras entry.
message UserCameraPermissions {
  string username = 1;
  optional CameraPermissionFlags all_cameras = 2;  // unset = no blanket grant
  repeated CameraPermission cameras = 3;
}

// Empty username = every user holding any grant (admin UI); set = one user (gateway cache fill).
message ListCameraPermissionsRequest {
  optional string username = 1;
}

message ListCameraPermissionsResponse {
  repeated UserCameraPermissions users = 1;
}

// Replaces that user's grants wholesale — the admin UI edits the whole matrix and applies it.
message SetUserCameraPermissionsRequest {
  UserCameraPermissions permissions = 1;
}

enum CameraAclMode {
  // Pre-ACL behaviour: every authenticated user reaches every camera.
  CAMERA_ACL_OPEN     = 0;
  CAMERA_ACL_ENFORCED = 1;
}

message GetCameraAclModeResponse {
  CameraAclMode mode = 1;
}

message SetCameraAclModeRequest {
  CameraAclMode mode = 1;
}

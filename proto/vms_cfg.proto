syntax = "proto3";

import "google/protobuf/timestamp.proto";

package vms.cfg;

service CfgService {
  rpc ListCameras(ListCamerasRequest) returns (ListCamerasResponse);
  rpc ListMediaServers(ListMediaServersRequest) returns (ListMediaServersResponse);
  rpc RegisterMediaServer(MediaServerNode) returns (OperationStatus);
  rpc SetupCamera(CameraSetup) returns (OperationStatus);
  rpc RemoveCamera(SourceRequest) returns (OperationStatus);
  rpc GetCamera(SourceRequest) returns (GetCameraResponse);
  rpc ListRecordingProfiles(ListRecordingProfilesRequest) returns (ListRecordingProfilesResponse);
  rpc UpsertRecordingProfile(RecordingProfile) returns (OperationStatus);
  rpc RemoveRecordingProfile(RecordingProfileRequest) returns (OperationStatus);
  rpc SetStreamOverride(SetStreamOverrideRequest) returns (OperationStatus);
  rpc ClearStreamOverride(ClearStreamOverrideRequest) returns (OperationStatus);
  rpc ActivateAlarmOverride(ActivateAlarmOverrideRequest) returns (ActivateAlarmOverrideResponse);
  rpc ClearAlarmOverride(ClearAlarmOverrideRequest) returns (OperationStatus);
  rpc ListAlarmOverrideStreams(ListAlarmOverrideStreamsRequest) returns (ListAlarmOverrideStreamsResponse);
  rpc ListMediaMtxServers(ListMediaMtxServersRequest) returns (ListMediaMtxServersResponse);
  rpc UpsertMediaMtxServer(MediaMtxServer) returns (OperationStatus);
  rpc RemoveMediaMtxServer(MediaMtxServerRequest) returns (OperationStatus);
  rpc GetOrAssignMediaMtxServer(SourceRequest) returns (GetOrAssignMediaMtxServerResponse);
  rpc ListMonitors(ListMonitorsRequest) returns (ListMonitorsResponse);
  rpc UpsertMonitor(MonitorSetup) returns (MonitorSetup);
  rpc RemoveMonitor(SourceRequest) returns (OperationStatus);
  rpc SetMonitorCameras(SetMonitorCamerasRequest) returns (OperationStatus);
  rpc SetMonitorSlot(SetMonitorSlotRequest) returns (OperationStatus);
}

service StorageService {
  rpc AddStorage(Storage) returns (OperationStatus);
  rpc RemoveStorage(StorageRequest) returns (OperationStatus);
  rpc ListStorages(ListStoragesRequest) returns (ListStoragesResponse);
  rpc SetCameraStorages(SetCameraStoragesRequest) returns (OperationStatus);
  rpc GetCameraStorages(CameraStoragesRequest) returns (GetCameraStoragesResponse);
}

message SourceRequest {
  string source_id = 1;
}

message Credentials {
  string user = 1;
  string pass = 2;
}

message OnvifConnection {
  string ip = 1;
  int32 port = 2;
}

enum RecordingMode {
  RECORDING_OFF = 0;
  RECORDING_CONTINUOUS = 1;
  RECORDING_PREALARM = 2;
}

message RecordingProfile {
  string id                  = 1;
  string name                = 2;
  RecordingMode mode         = 3;
  uint32 pre_record_seconds  = 4;
  uint32 post_record_seconds = 5;
  uint32 segment_seconds     = 6;
  bool   is_override_preset  = 7;
  bool   is_builtin          = 8;
}

message CameraStream {
  string stream_name                       = 1;
  string profile_token                     = 2;
  string rtsp_url                          = 3;
  bool   web_rtc                           = 4;
  optional RecordingProfile recording_profile  = 5;
  optional RecordingProfile override_profile   = 6;
}

message CameraSetup {
  string camera_id = 1;
  string server_id = 2;
  optional Credentials cred = 5;
  optional OnvifConnection onvif_conn = 6;
  repeated CameraStream streams = 9;
  optional string media_mtx_server_id = 10;
}

message RecordingProfileRequest {
  string id = 1;
}

message SetStreamOverrideRequest {
  string camera_id   = 1;
  string stream_name = 2;
  string profile_id  = 3;
}

message ClearStreamOverrideRequest {
  string camera_id   = 1;
  string stream_name = 2;
}

message ListRecordingProfilesRequest {}

message ListRecordingProfilesResponse {
  repeated RecordingProfile profiles = 1;
}

message GetCameraResponse {
  CameraSetup setup = 1;
  bool found = 2;
}

message MediaServerNode {
  string server_id = 1;
  string status = 2;
}

message ListMediaServersRequest {}

message ListMediaServersResponse {
  repeated MediaServerNode servers = 1;
}

message ListCamerasRequest {
  string server_id = 1;
}

message ListCamerasResponse {
  repeated CameraSetup cameras = 1;
}

message OperationStatus {
  bool success = 1;
  string message = 2;
}

message Storage {
  string storage_id     = 1;
  string root_path      = 2;
  uint64 reserved_bytes = 3;
}

message CameraStorageAssignment {
  string camera_id  = 1;
  string storage_id = 2;
  int32  priority   = 3;
}

message StorageRequest {
  string storage_id = 1;
}

message CameraStoragesRequest {
  string camera_id = 1;
}

message ListStoragesRequest {}

message ListStoragesResponse {
  repeated Storage storages = 1;
}

message SetCameraStoragesRequest {
  string camera_id = 1;
  repeated CameraStorageAssignment assignments = 2;
}

message GetCameraStoragesResponse {
  repeated CameraStorageAssignment assignments = 1;
}

message MediaMtxServer {
  string id         = 1;
  string name       = 2;
  string rtsp_url   = 3;
  string webrtc_url = 4;
}

message MediaMtxServerRequest {
  string id = 1;
}

message ListMediaMtxServersRequest {}

message ListMediaMtxServersResponse {
  repeated MediaMtxServer servers = 1;
}

message GetOrAssignMediaMtxServerResponse {
  bool          found  = 1;
  MediaMtxServer server = 2;
}

message MonitorSlot {
  int32  slot_index = 1;
  string camera_id  = 2;
}

message MonitorSetup {
  string           monitor_id = 1;
  string           name       = 2;
  string           layout     = 3;
  repeated string  camera_ids = 4;
  repeated MonitorSlot slots  = 5;
}

message ListMonitorsRequest {}

message ListMonitorsResponse {
  repeated MonitorSetup monitors = 1;
}

message SetMonitorCamerasRequest {
  string          monitor_id = 1;
  repeated string camera_ids = 2;
}

message SetMonitorSlotRequest {
  string monitor_id = 1;
  int32  slot_index  = 2;
  string camera_id  = 3;
}

message ActivateAlarmOverrideRequest {
  string camera_id                    = 1;
  optional string stream_name         = 2;
  google.protobuf.Timestamp until     = 3;
}

message ActivateAlarmOverrideResponse {
  bool activated = 1;
}

message ClearAlarmOverrideRequest {
  string camera_id   = 1;
  string stream_name = 2;
}

message AlarmOverrideStream {
  string camera_id   = 1;
  string stream_name = 2;
}

message ListAlarmOverrideStreamsRequest {}

message ListAlarmOverrideStreamsResponse {
  repeated AlarmOverrideStream streams = 1;
}

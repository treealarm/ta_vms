syntax = "proto3";

package vms.cfg;

service CfgService {
  rpc ListCameras(ListCamerasRequest) returns (ListCamerasResponse);
  rpc GetCameraOnvifUri(SourceRequest) returns (OnvifState);
  rpc AddCamera(CameraState) returns (OperationStatus);
  rpc SetCameraState(CameraState) returns (OperationStatus);
  rpc RemoveCamera(SourceRequest) returns (OperationStatus);
  rpc GetCameraState(SourceRequest) returns (CameraStateResponse);
}

message SourceRequest {
  string source_id = 1;
}

message Credentials {
  string user = 1;
  string pass = 2;
}

message OnvifConnection {
  string ip = 1;
  int32 port = 2;
}

message OnvifState {
  string rtsp_url = 4;
}

message CameraState {
  string camera_id = 1;
  bool recording = 2;
  bool web_rtc = 3;
  string rtsp_url = 4;
  optional Credentials cred = 5;
  optional OnvifConnection onvif_conn = 6;
}

message ListCamerasRequest {}

message ListCamerasResponse {
  repeated CameraState cameras = 1;
}

message OperationStatus {
  bool success = 1;
  string message = 2;
}

message CameraStateResponse {
  CameraState camera = 1;
  bool found = 2;
}

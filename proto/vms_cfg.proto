syntax = "proto3";

package vms.cfg;

service CfgService {
  rpc ListCameras(ListCamerasRequest) returns (ListCamerasResponse);
  rpc ListMediaServers(ListMediaServersRequest) returns (ListMediaServersResponse);
  rpc RegisterMediaServer(MediaServerNode) returns (OperationStatus);
  rpc SetupCamera(CameraSetup) returns (OperationStatus);
  rpc RemoveCamera(SourceRequest) returns (OperationStatus);
  rpc GetCamera(SourceRequest) returns (GetCameraResponse);
  rpc ListRecordingProfiles(ListRecordingProfilesRequest) returns (ListRecordingProfilesResponse);
  rpc UpsertRecordingProfile(RecordingProfile) returns (OperationStatus);
  rpc RemoveRecordingProfile(RecordingProfileRequest) returns (OperationStatus);
}

service StorageService {
  rpc AddStorage(Storage) returns (OperationStatus);
  rpc RemoveStorage(StorageRequest) returns (OperationStatus);
  rpc ListStorages(ListStoragesRequest) returns (ListStoragesResponse);
  rpc SetCameraStorages(SetCameraStoragesRequest) returns (OperationStatus);
  rpc GetCameraStorages(CameraStoragesRequest) returns (GetCameraStoragesResponse);
}

message SourceRequest {
  string source_id = 1;
}

message Credentials {
  string user = 1;
  string pass = 2;
}

message OnvifConnection {
  string ip = 1;
  int32 port = 2;
}

enum RecordingMode {
  RECORDING_OFF = 0;
  RECORDING_CONTINUOUS = 1;
  RECORDING_PREALARM = 2;
}

message RecordingProfile {
  string id                  = 1;
  string name                = 2;
  RecordingMode mode         = 3;
  uint32 pre_record_seconds  = 4;
  uint32 post_record_seconds = 5;
  uint32 segment_seconds     = 6;
}

message CameraStream {
  string stream_name                    = 1;
  string profile_token                  = 2;
  string rtsp_url                       = 3;
  bool   web_rtc                        = 4;
  optional RecordingProfile recording_profile = 5;
}

message CameraSetup {
  string camera_id = 1;
  string server_id = 2;
  optional Credentials cred = 5;
  optional OnvifConnection onvif_conn = 6;
  repeated CameraStream streams = 9;
}

message RecordingProfileRequest {
  string id = 1;
}

message ListRecordingProfilesRequest {}

message ListRecordingProfilesResponse {
  repeated RecordingProfile profiles = 1;
}

message GetCameraResponse {
  CameraSetup setup = 1;
  bool found = 2;
}

message MediaServerNode {
  string server_id = 1;
  string status = 2;
}

message ListMediaServersRequest {}

message ListMediaServersResponse {
  repeated MediaServerNode servers = 1;
}

message ListCamerasRequest {
  string server_id = 1;
}

message ListCamerasResponse {
  repeated CameraSetup cameras = 1;
}

message OperationStatus {
  bool success = 1;
  string message = 2;
}

message Storage {
  string storage_id     = 1;
  string root_path      = 2;
  uint64 reserved_bytes = 3;
}

message CameraStorageAssignment {
  string camera_id  = 1;
  string storage_id = 2;
  int32  priority   = 3;
}

message StorageRequest {
  string storage_id = 1;
}

message CameraStoragesRequest {
  string camera_id = 1;
}

message ListStoragesRequest {}

message ListStoragesResponse {
  repeated Storage storages = 1;
}

message SetCameraStoragesRequest {
  string camera_id = 1;
  repeated CameraStorageAssignment assignments = 2;
}

message GetCameraStoragesResponse {
  repeated CameraStorageAssignment assignments = 1;
}

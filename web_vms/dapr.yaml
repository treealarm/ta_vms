# Multi-App Run template for local Dapr sidecars (node 1).
# Sidecars only — no `command`: start apps from Visual Studio / `dotnet` / Cursor.
#
# From this directory:
#   dapr run -f .
#   dapr stop -f .
# From the repo root:
#   dapr run -f web_vms/dapr.yaml
#
# Ports and app-ids match .vscode/tasks.json. Node-2 sidecars are not listed here.
# Redis (and the rest of the shared Square stack) must already be up.
version: 1
common:
  resourcesPath: ../init_files/dapr_components
apps:
  - appID: web-vms
    appDirPath: ./web_vms.Server
    appProtocol: http
    appPort: 5134
    daprHTTPPort: 3600
    daprGRPCPort: 51001
    metricsPort: 9190
    daprInternalGRPCPort: 19011
    daprdLogDestination: console

  - appID: vmscfg
    appDirPath: ./VmsCfg
    appProtocol: grpc
    appPort: 5135
    daprHTTPPort: 3601
    daprGRPCPort: 51002
    metricsPort: 9191
    daprInternalGRPCPort: 19012
    daprdLogDestination: console

  - appID: vmsutils
    appDirPath: ./VmsUtils
    appProtocol: grpc
    appPort: 5139
    daprHTTPPort: 3606
    daprGRPCPort: 51007
    metricsPort: 9196
    daprInternalGRPCPort: 19017
    daprdLogDestination: console

  - appID: vmsonvif
    appDirPath: ./VmsOnvif
    appProtocol: grpc
    appPort: 5136
    daprHTTPPort: 3602
    daprGRPCPort: 51003
    metricsPort: 9192
    daprInternalGRPCPort: 19013
    # Windows `dapr init` publishes placement as host:6050 -> container:50005 (Linux stays on 50005).
    placementHostAddress: localhost:6050
    daprdLogDestination: console

  - appID: vmsonvif-actors
    appDirPath: ./VmsOnvifActors

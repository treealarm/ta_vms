# Pinned here rather than derived from the checkout directory: it fixes the built image prefix
# (ta_vms-<service>, which ../ta_install/scripts/push-images.sh re-tags) and the container names no
# matter what the folder is called or which cwd compose is invoked from.
name: ta_vms

x-data-volume: &data-volume
  - "${PWD}/data:/data"

# Same network Square/multitenant_admin use. Renaming compose's own implicit "default" network
# this way puts every ta_vms service on it with no per-service changes needed — but it also means
# our network *key* is "default" while Square/multitenant_admin declare theirs under the key
# "shared_network". Compose stamps the key into the com.docker.compose.network label and refuses
# to adopt a network whose label disagrees, so the only way to share one network across projects
# with different keys is to mark it external here. Consequence: multitenant_admin (or Square) must
# be up first — the network is theirs to create. ta_vms no longer borrows anything else from that
# stack: its state store is its own postgres and its bus is its own rabbitmq, both below.
networks:
  default:
    name: common_app_network
    external: true

services:
  # Part of the "app" profile, not of the infra services started by a bare `docker compose up`:
  # actor placement for locally debugged (F5) services is already provided by the host's
  # `dapr init` placement on 50005, and a second one cannot bind that port. Reached over the
  # shared network by service name instead of a published host port for the same reason — this
  # way the fully dockerized stack and a host `dapr init` can coexist.
  dapr-placement:
    profiles: [app]
    image: daprio/dapr:latest
    command: ["./placement", "-port", "50005"]

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_CFG_DB:-ta_cfg}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # No docker-entrypoint-initdb.d mount: that hook only fires when the data directory is
    # initialised from empty, so it could never create a database added later, and a hardcoded
    # list of names is wrong anyway once databases are stamped per tenant. The db-init service
    # below is the single thing that creates them, and it reads their names from the environment.
    volumes:
      - ./data/postgres:/var/lib/postgresql

  # Creates the service databases that docker-entrypoint-initdb.d cannot: that hook only runs
  # when the data directory is initialised from empty, so on every deployment past the first a
  # newly added database would never appear. Deliberately outside the "app" profile — a bare
  # `docker compose up` brings up the infra, and the databases are part of the infra being
  # ready. Runs to completion and exits; idempotent, so repeating it on every start is free.
  # Also invocable on its own: docker compose run --rm db-init
  # (add --check to report without creating anything).
  db-init:
    image: postgres:latest
    env_file:
      - .env
    environment:
      # .env says localhost, which is right for services debugged on the host but not from
      # inside the network — same override the vmscfg/vmsfs/vmsanalyticssingleton services make.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    # Kept in scripts/ rather than init_files/postgres/ so it can never be picked up by
    # docker-entrypoint-initdb.d, which executes *.sh too: running there would mean running
    # during initdb, before the server accepts TCP connections.
    volumes:
      - ./scripts:/init:ro
      # Read-only, and only to compare: the state store's connection string is a literal (Dapr
      # does not expand environment variables in component metadata), so it is the one place
      # where the database name and credentials are duplicated. The script fails here rather
      # than letting Dapr discover the drift as a state store that never worked.
      - ./init_files/dapr_components:/components:ro
    # Invoked through bash rather than executed directly: the exec bit does not survive a bind
    # mount from a Windows host.
    entrypoint: ["bash", "/init/prepare-databases.sh"]
    working_dir: /init
    restart: "no"
    depends_on:
      - postgres

  # The Dapr pub/sub broker. Ours, and no longer multitenant_admin's redis: the state store had
  # already moved to our own postgres above, and this was the last thing ta_vms borrowed from
  # Square's stack. Redis also has no native Windows build, which blocks the eventual Docker-free
  # installer; RabbitMQ covers docker, Kubernetes and a plain machine alike.
  # Nothing about the bus semantics changes — see init_files/dapr_components/orderpubsub.yaml.
  rabbitmq:
    image: rabbitmq:management
    environment:
      # The built-in "guest" is refused from anywhere but localhost, so a sidecar in a container
      # could never use it. These must match the credentials in the orderpubsub components.
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-vms}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-vms}"
    ports:
      # Published for the sidecars of services debugged on the host (F5). Not on 5672/15672:
      # this developer machine already runs another RabbitMQ there — same reasoning as the
      # mediamtx note above, the host port namespace is shared with every other project.
      - "${RABBITMQ_PORT:-5674}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15674}:15672"
    volumes:
      # Queues are durable and are meant to hold events across a subscriber restart; without a
      # volume they would be re-created empty on every `docker compose up`.
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  # The shared network above is still required, but only for Dapr service invocation into Square
  # (SQUARE_INTEGRATION_SINK_APP_ID). ta_vms no longer keeps any data of its own in a container it
  # does not own: the state store is the postgres above, the bus is the rabbitmq above.

  mediamtx:
    image: bluenviron/mediamtx:latest
    # No container_name on purpose: that namespace is global to the docker host, and the older
    # vms_rec project (/mnt/wdblue/seenaptec/vms_rec) pins the same "mediamtx" name, so whichever
    # stack came up last used to fail. Services reach it by its compose service name anyway
    # (VMS_MTX_HOST=mediamtx resolves through the network alias, not the container name).
    # Passwords for the vms_publish / vms_read accounts declared in mediamtx.yml. MediaMTX merges
    # these into the yml entries by index, so the file keeps the users and permissions while the
    # secrets stay in .env. Both ports below now require one of those accounts.
    environment:
      MTX_AUTHINTERNALUSERS_0_PASS: "${VMS_MEDIAMTX_PUBLISH_PASS}"
      MTX_AUTHINTERNALUSERS_1_PASS: "${VMS_MEDIAMTX_READ_PASS}"
    # Every port here now demands one of the accounts above — MediaMTX has no anonymous access.
    ports:
      - "8889:8889"       # WHEP — published because in dev the backend runs on the host and
                          # proxies to localhost:8889 (see .vscode/launch.json VMS_MTX_HOST)
      - "8554:8554"       # RTSP
      - "9997:9997"       # Control API — VmsUtils polls reader counts through it, and in dev it
                          # runs on the host, so it needs the port too (see UtilsServiceImpl)
      - "8189:8189/udp"  # ICE/UDP медиапоток — идёт прямо на браузер, минуя gateway
    volumes:
      - ./init_files/config/mediamtx.yml:/mediamtx.yml

  vmsutils:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsUtils/Dockerfile
    env_file:
      - .env
    environment:
      APP_ID: vmsutils
    volumes: *data-volume
    # Waits for the infrastructure even though this service has no database of its own: its Dapr
    # sidecar loads every component in /components — state store and pub/sub alike — and daprd
    # exits when a component fails to initialise (spec.ignoreErrors is false by default), without
    # retrying. Started before ta_state exists or before the broker accepts connections, the
    # sidecar would simply die. The sidecars inherit this wait through their depends_on on the
    # app, so the rule is: every app service waits for db-init and rabbitmq, directly or through
    # another service that does.
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  vmsutils-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsutils"
      - "-app-port"
      - "${UTILS_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmsutils"
    depends_on:
      - vmsutils

  vmssingleton:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsSingleton/Dockerfile
    env_file:
      - .env
    environment:
      APP_ID: vmssingleton
    # Exactly one instance, always — see CLAUDE.md. It runs work that must not happen twice and
    # aggregates pub/sub reports in memory, which a second replica would split rather than share.
    volumes: *data-volume
    # For its sidecar's components, not for itself — see vmsutils above.
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  vmssingleton-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmssingleton"
      - "-app-port"
      - "${SINGLETON_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmssingleton"
    depends_on:
      - vmssingleton

  vmssquaresingleton:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsSquareSingleton/Dockerfile
    env_file:
      - .env
    environment:
      APP_ID: vmssquaresingleton
    # Exactly one instance: its startup resync pushes every camera into Square, and a second copy
    # would push the whole tree again. See CLAUDE.md.
    volumes: *data-volume
    depends_on:
      - vmscfg

  vmssquaresingleton-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmssquaresingleton"
      - "-app-port"
      - "${SQUARE_SINGLETON_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmssquaresingleton"
    depends_on:
      - vmssquaresingleton

  vmsptztrackingsingleton:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsPtzTrackingSingleton/Dockerfile
    env_file:
      - .env
    environment:
      APP_ID: vmsptztrackingsingleton
    # Exactly one instance: a camera must have exactly one control loop, or two of them send the
    # motor opposing commands. See CLAUDE.md.
    volumes: *data-volume
    depends_on:
      - vmscfg

  vmsptztrackingsingleton-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsptztrackingsingleton"
      - "-app-port"
      - "${PTZ_TRACKING_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmsptztrackingsingleton"
    depends_on:
      - vmsptztrackingsingleton

  vmslogger:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsLogger/Dockerfile
    env_file:
      - .env
    environment:
      APP_ID: vmslogger
    volumes: *data-volume
    # For its sidecar's components, not for itself — see vmsutils above.
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  vmslogger-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmslogger"
      - "-app-port"
      - "${LOGGER_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmslogger"
    depends_on:
      - vmslogger

  vmscfg:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsCfg/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      APP_ID: vmscfg
    volumes: *data-volume
    # Waits for db-init to finish, not just for postgres to be up: without the database this
    # service now fails fast with a clear message instead of retrying, so starting it early
    # would turn a working deployment into a crash loop.
    depends_on:
      postgres:
        condition: service_started
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  vmscfg-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmscfg"
      - "-app-port"
      - "5135"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmscfg"
    depends_on:
      - vmscfg

  vmsonvif:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsOnvif/Dockerfile
    env_file:
      - .env
    environment:
      APP_ID: vmsonvif
      # The node whose camera subnet this instance shares. Must match the server_id side of
      # this node's MEDIA_SERVER_PAIRS entry: ONVIF only reaches a camera from its own node.
      OWN_SERVER_ID: vms
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # NOTE: WS-Discovery (camera scan) needs real LAN access to receive multicast
    # replies, which this bridge-networked container doesn't have. It works when
    # VmsOnvif runs as a native process (local dev via launch.json). Running it
    # in this container only sees the camera LAN if the container is given host
    # networking on a real Linux Docker Engine host — not on Docker Desktop,
    # where "host" networking is the Desktop VM's network, not the LAN.
    volumes: *data-volume
    depends_on:
      - vmscfg

  vmsonvif-actors:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsOnvifActors/Dockerfile
    env_file:
      - .env
    environment:
      APP_ID: vmsonvif-actors
      # The node whose camera subnet this instance shares. Must match the server_id side of
      # this node's MEDIA_SERVER_PAIRS entry: ONVIF only reaches a camera from its own node.
      OWN_SERVER_ID: vms
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: *data-volume
    depends_on:
      - vmscfg

  vmsfs:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsFs/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      APP_ID: vmsfs
    volumes: *data-volume
    depends_on:
      postgres:
        condition: service_started
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  vmsfs-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsfs"
      - "-app-port"
      - "${FS_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmsfs"
    depends_on:
      - vmsfs

  vmsanalyticssingleton:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsAnalyticsSingleton/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      APP_ID: vmsanalyticssingleton
    volumes: *data-volume
    depends_on:
      postgres:
        condition: service_started
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      vmscfg:
        condition: service_started

  vmsanalyticssingleton-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsanalyticssingleton"
      - "-app-port"
      - "${ANALYTICS_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmsanalyticssingleton"
    depends_on:
      - vmsanalyticssingleton

  vmsonvif-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsonvif"
      - "-app-port"
      - "5136"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-placement-host-address"
      - "dapr-placement:50005"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmsonvif"
    depends_on:
      - vmsonvif

  vmsonvif-actors-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsonvif-actors"
      - "-app-port"
      - "5141"
      - "-app-protocol"
      - "http"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
      - "-placement-host-address"
      - "dapr-placement:50005"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmsonvif-actors"
    depends_on:
      - vmsonvif-actors

  vms:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${GRPC_VMS_PORT}:${GRPC_VMS_PORT}"
    env_file:
      - .env
    environment:
      APP_ID: vms
    depends_on:
      - vmscfg
      - vmsonvif
      - vmsfs
      - mediamtx
    volumes: *data-volume

  roitrc:
    profiles: [app]
    # The service is ours; the encoder it wraps is the customer's deliverable and comes
    # in as the roitrc/sve submodule. Context is the repository root because the build
    # needs both roitrc/ and proto/. Its base image, roi-deps, is built from the
    # submodule -- see build-and-run.sh.
    build:
      context: .
      dockerfile: roitrc/Dockerfile
    env_file:
      - .env
    environment:
      APP_ID: roitrc
    # The only service in the stack that touches the GPU -- and it does not ask
    # for one here. `devices:` is resolved by the daemon when the container is
    # created, so naming a device the host lacks fails the create outright: the
    # in-process fallback to libx264 never gets to run, because no process ever
    # starts. Compose has no optional device, and dev does not need the speed.
    #
    # It cannot work here anyway when Docker Desktop is the daemon: that runs in
    # a VM with no /dev/dri, so even --privileged finds nothing to pass through.
    #
    # On a native Linux host with an Intel iGPU, opt in with an untracked
    # docker-compose.override.yml (compose merges it automatically); see
    # ../ta_install/docker-compose.gpu.yml.example for the block.
    volumes: *data-volume
    depends_on:
      - vmscfg

  roitrc-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "roitrc"
      - "-app-port"
      - "${GRPC_ROI_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    # Shares the app's network namespace, so it must not also get the device.
    network_mode: "service:roitrc"
    depends_on:
      - roitrc

  vms-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vms"
      - "-app-port"
      - "50051"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vms"
    depends_on:
      - vms

  web_vms:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/web_vms.Server/Dockerfile
    ports:
      - "${WEB_VMS_PORT}:${WEB_VMS_PORT}"
    depends_on:
      - vms
      - vmscfg
      - vmsfs
    env_file:
      - .env

  web_vms-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "web-vms"
      - "-app-port"
      - "${WEB_VMS_PORT}"
      - "-app-protocol"
      - "http"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:web_vms"
    depends_on:
      - web_vms


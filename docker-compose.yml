# Pinned here rather than derived from the checkout directory: it fixes the built image prefix
# (ta_vms-<service>, which ../ta_install/scripts/push-images.sh re-tags) and the container names no
# matter what the folder is called or which cwd compose is invoked from.
name: ta_vms

x-data-volume: &data-volume
  - "${PWD}/data:/data"

# Same network Square/multitenant_admin use. Renaming compose's own implicit "default" network
# this way puts every ta_vms service on it with no per-service changes needed — but it also means
# our network *key* is "default" while Square/multitenant_admin declare theirs under the key
# "shared_network". Compose stamps the key into the com.docker.compose.network label and refuses
# to adopt a network whose label disagrees, so the only way to share one network across projects
# with different keys is to mark it external here. Consequence: multitenant_admin (or Square) must
# be up first — which is required anyway, ta_vms has no redis of its own and uses theirs.
networks:
  default:
    name: common_app_network
    external: true

services:
  # Part of the "app" profile, not of the infra services started by a bare `docker compose up`:
  # actor placement for locally debugged (F5) services is already provided by the host's
  # `dapr init` placement on 50005, and a second one cannot bind that port. Reached over the
  # shared network by service name instead of a published host port for the same reason — this
  # way the fully dockerized stack and a host `dapr init` can coexist.
  dapr-placement:
    profiles: [app]
    image: daprio/dapr:latest
    command: ["./placement", "-port", "50005"]

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_CFG_DB:-ta_cfg}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
      - ./init_files/postgres:/docker-entrypoint-initdb.d:ro

  # No own redis service: ta_vms now shares one network (common_app_network, see above) with
  # Square/multitenant_admin, and reuses multitenant_admin's "redis" for all of ta_vms's Dapr
  # pub/sub and state store too — running two same-named "redis" containers on one network makes
  # Docker's embedded DNS round-robin connections randomly between them (verified empirically),
  # so there can only be one. This means ta_vms no longer starts standalone without
  # Square/multitenant_admin's stack also running — an explicit, accepted trade-off.

  mediamtx:
    image: bluenviron/mediamtx:latest
    # No container_name on purpose: that namespace is global to the docker host, and the older
    # vms_rec project (/mnt/wdblue/seenaptec/vms_rec) pins the same "mediamtx" name, so whichever
    # stack came up last used to fail. Services reach it by its compose service name anyway
    # (VMS_MTX_HOST=mediamtx resolves through the network alias, not the container name).
    # Passwords for the vms_publish / vms_read accounts declared in mediamtx.yml. MediaMTX merges
    # these into the yml entries by index, so the file keeps the users and permissions while the
    # secrets stay in .env. Both ports below now require one of those accounts.
    environment:
      MTX_AUTHINTERNALUSERS_0_PASS: "${VMS_MEDIAMTX_PUBLISH_PASS}"
      MTX_AUTHINTERNALUSERS_1_PASS: "${VMS_MEDIAMTX_READ_PASS}"
    # Every port here now demands one of the accounts above — MediaMTX has no anonymous access.
    ports:
      - "8889:8889"       # WHEP — published because in dev the backend runs on the host and
                          # proxies to localhost:8889 (see .vscode/launch.json VMS_MTX_HOST)
      - "8554:8554"       # RTSP
      - "9997:9997"       # Control API — VmsUtils polls reader counts through it, and in dev it
                          # runs on the host, so it needs the port too (see UtilsServiceImpl)
      - "8189:8189/udp"  # ICE/UDP медиапоток — идёт прямо на браузер, минуя gateway
    volumes:
      - ./init_files/config/mediamtx.yml:/mediamtx.yml

  vmsutils:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsUtils/Dockerfile
    env_file:
      - .env
    environment:
      APP_ID: vmsutils
    volumes: *data-volume

  vmsutils-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsutils"
      - "-app-port"
      - "${UTILS_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmsutils"
    depends_on:
      - vmsutils

  vmssingleton:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsSingleton/Dockerfile
    env_file:
      - .env
    environment:
      APP_ID: vmssingleton
    # Exactly one instance, always — see CLAUDE.md. It runs work that must not happen twice and
    # aggregates pub/sub reports in memory, which a second replica would split rather than share.
    volumes: *data-volume

  vmssingleton-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmssingleton"
      - "-app-port"
      - "${SINGLETON_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmssingleton"
    depends_on:
      - vmssingleton

  vmssquaresingleton:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsSquareSingleton/Dockerfile
    env_file:
      - .env
    environment:
      APP_ID: vmssquaresingleton
    # Exactly one instance: its startup resync pushes every camera into Square, and a second copy
    # would push the whole tree again. See CLAUDE.md.
    volumes: *data-volume
    depends_on:
      - vmscfg

  vmssquaresingleton-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmssquaresingleton"
      - "-app-port"
      - "${SQUARE_SINGLETON_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmssquaresingleton"
    depends_on:
      - vmssquaresingleton

  vmslogger:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsLogger/Dockerfile
    env_file:
      - .env
    environment:
      APP_ID: vmslogger
    volumes: *data-volume

  vmslogger-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmslogger"
      - "-app-port"
      - "${LOGGER_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmslogger"
    depends_on:
      - vmslogger

  vmscfg:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsCfg/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      APP_ID: vmscfg
    volumes: *data-volume
    depends_on:
      - postgres

  vmscfg-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmscfg"
      - "-app-port"
      - "5135"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmscfg"
    depends_on:
      - vmscfg

  vmsonvif:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsOnvif/Dockerfile
    env_file:
      - .env
    environment:
      APP_ID: vmsonvif
      # The node whose camera subnet this instance shares. Must match the server_id side of
      # this node's MEDIA_SERVER_PAIRS entry: ONVIF only reaches a camera from its own node.
      OWN_SERVER_ID: vms
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # NOTE: WS-Discovery (camera scan) needs real LAN access to receive multicast
    # replies, which this bridge-networked container doesn't have. It works when
    # VmsOnvif runs as a native process (local dev via launch.json). Running it
    # in this container only sees the camera LAN if the container is given host
    # networking on a real Linux Docker Engine host — not on Docker Desktop,
    # where "host" networking is the Desktop VM's network, not the LAN.
    volumes: *data-volume
    depends_on:
      - vmscfg

  vmsonvif-actors:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsOnvifActors/Dockerfile
    env_file:
      - .env
    environment:
      APP_ID: vmsonvif-actors
      # The node whose camera subnet this instance shares. Must match the server_id side of
      # this node's MEDIA_SERVER_PAIRS entry: ONVIF only reaches a camera from its own node.
      OWN_SERVER_ID: vms
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: *data-volume
    depends_on:
      - vmscfg

  vmsfs:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsFs/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      APP_ID: vmsfs
    volumes: *data-volume
    depends_on:
      - postgres

  vmsfs-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsfs"
      - "-app-port"
      - "${FS_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmsfs"
    depends_on:
      - vmsfs

  vmsanalyticssingleton:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsAnalyticsSingleton/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      APP_ID: vmsanalyticssingleton
    volumes: *data-volume
    depends_on:
      - postgres
      - vmscfg

  vmsanalyticssingleton-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsanalyticssingleton"
      - "-app-port"
      - "${ANALYTICS_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmsanalyticssingleton"
    depends_on:
      - vmsanalyticssingleton

  vmsonvif-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsonvif"
      - "-app-port"
      - "5136"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-placement-host-address"
      - "dapr-placement:50005"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmsonvif"
    depends_on:
      - vmsonvif

  vmsonvif-actors-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsonvif-actors"
      - "-app-port"
      - "5141"
      - "-app-protocol"
      - "http"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
      - "-placement-host-address"
      - "dapr-placement:50005"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmsonvif-actors"
    depends_on:
      - vmsonvif-actors

  vms:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${GRPC_VMS_PORT}:${GRPC_VMS_PORT}"
    env_file:
      - .env
    environment:
      APP_ID: vms
    depends_on:
      - vmscfg
      - vmsonvif
      - vmsfs
      - mediamtx
    volumes: *data-volume

  vms-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vms"
      - "-app-port"
      - "50051"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vms"
    depends_on:
      - vms

  web_vms:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/web_vms.Server/Dockerfile
    ports:
      - "${WEB_VMS_PORT}:${WEB_VMS_PORT}"
    depends_on:
      - vms
      - vmscfg
      - vmsfs
    env_file:
      - .env

  web_vms-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "web-vms"
      - "-app-port"
      - "${WEB_VMS_PORT}"
      - "-app-protocol"
      - "http"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:web_vms"
    depends_on:
      - web_vms


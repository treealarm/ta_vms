
services:
  vms:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${GRPC_VMS_PORT}:${GRPC_VMS_PORT}"
    env_file:
      - .env
    depends_on:
      - mediamtx
    volumes:
      - "${PWD}/data:/data"
      
  web_vms:
    build:
      context: .
      dockerfile: web_vms/web_vms.Server/Dockerfile  
    ports:
      - "${WEB_VMS_PORT}:${WEB_VMS_PORT}"  
    depends_on:
      - vms
    env_file:
      - .env

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    ports:
      - "8889:8889"       # WebRTC UI доступен с хоста
      - "8554:8554"       # RTSP
      - "8000:8000"       # HTTP API (опционально)
      - "8189:8189/udp"  # ICE/UDP медиапоток

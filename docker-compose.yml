x-data-volume: &data-volume
  - "${PWD}/data:/data"

services:
  dapr-placement:
    image: daprio/dapr:latest
    command: ["./placement", "-port", "50005"]
    ports:
      - "50005:50005"

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_CFG_DB:-ta_cfg}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
      - ./init_files/postgres:/docker-entrypoint-initdb.d:ro

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:-admin@admin.com}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:-admin123}"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres

  redis:
    image: redis:latest

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    ports:
      - "8889:8889"       # WebRTC UI доступен с хоста
      - "8554:8554"       # RTSP
      - "8000:8000"       # HTTP API (опционально)
      - "8189:8189/udp"  # ICE/UDP медиапоток
    volumes:
      - ./init_files/config/mediamtx.yml:/mediamtx.yml

  vmsutils:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsUtils/Dockerfile
    env_file:
      - .env
    environment:
      APP_ID: vmsutils
    volumes: *data-volume

  vmsutils-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsutils"
      - "-app-port"
      - "${UTILS_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmsutils"
    depends_on:
      - vmsutils
      - redis

  vmslogger:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsLogger/Dockerfile
    env_file:
      - .env
    environment:
      APP_ID: vmslogger
    volumes: *data-volume

  vmslogger-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmslogger"
      - "-app-port"
      - "${LOGGER_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmslogger"
    depends_on:
      - vmslogger
      - redis

  vmscfg:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsCfg/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      APP_ID: vmscfg
    volumes: *data-volume
    depends_on:
      - postgres

  vmscfg-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmscfg"
      - "-app-port"
      - "5135"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmscfg"
    depends_on:
      - vmscfg
      - redis

  vmsonvif:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsOnvif/Dockerfile
    env_file:
      - .env
    environment:
      APP_ID: vmsonvif
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: *data-volume
    depends_on:
      - vmscfg

  vmsonvif-actors:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsOnvifActors/Dockerfile
    env_file:
      - .env
    environment:
      APP_ID: vmsonvif-actors
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: *data-volume
    depends_on:
      - vmscfg

  vmsfs:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsFs/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      APP_ID: vmsfs
    volumes: *data-volume
    depends_on:
      - postgres

  vmsfs-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsfs"
      - "-app-port"
      - "${FS_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmsfs"
    depends_on:
      - vmsfs
      - redis

  vmsonvif-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsonvif"
      - "-app-port"
      - "5136"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-placement-host-address"
      - "host.docker.internal:50005"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmsonvif"
    depends_on:
      - vmsonvif
      - redis

  vmsonvif-actors-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsonvif-actors"
      - "-app-port"
      - "5141"
      - "-app-protocol"
      - "http"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
      - "-placement-host-address"
      - "host.docker.internal:50005"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmsonvif-actors"
    depends_on:
      - vmsonvif-actors

  vms:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${GRPC_VMS_PORT}:${GRPC_VMS_PORT}"
    env_file:
      - .env
    environment:
      APP_ID: vms
    depends_on:
      - vmscfg
      - vmsonvif
      - vmsfs
      - mediamtx
    volumes: *data-volume

  vms-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vms"
      - "-app-port"
      - "50051"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vms"
    depends_on:
      - vms
      - redis

  web_vms:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/web_vms.Server/Dockerfile
    ports:
      - "${WEB_VMS_PORT}:${WEB_VMS_PORT}"
    depends_on:
      - vms
      - vmscfg
      - vmsfs
    env_file:
      - .env

  web_vms-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "web-vms"
      - "-app-port"
      - "${WEB_VMS_PORT}"
      - "-app-protocol"
      - "http"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:web_vms"
    depends_on:
      - web_vms
      - redis


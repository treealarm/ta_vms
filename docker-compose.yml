x-data-volume: &data-volume
  - "${PWD}/data:/data"

# Same network Square/multitenant_admin use (neither marks it external — whichever stack starts
# first creates it, the rest just attach by name). Renaming compose's own implicit "default"
# network this way puts every vms_rec service on it with no per-service changes needed.
networks:
  default:
    name: common_app_network

services:
  dapr-placement:
    image: daprio/dapr:latest
    command: ["./placement", "-port", "50005"]
    ports:
      - "50005:50005"

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_CFG_DB:-ta_cfg}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
      - ./init_files/postgres:/docker-entrypoint-initdb.d:ro

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:-admin@admin.com}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:-admin123}"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./init_files/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres

  # No own redis service: vms_rec now shares one network (common_app_network, see above) with
  # Square/multitenant_admin, and reuses multitenant_admin's "redis" for all of vms_rec's Dapr
  # pub/sub and state store too — running two same-named "redis" containers on one network makes
  # Docker's embedded DNS round-robin connections randomly between them (verified empirically),
  # so there can only be one. This means vms_rec no longer starts standalone without
  # Square/multitenant_admin's stack also running — an explicit, accepted trade-off.

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    ports:
      - "8889:8889"       # WebRTC UI доступен с хоста
      - "8554:8554"       # RTSP
      - "8000:8000"       # HTTP API (опционально)
      - "8189:8189/udp"  # ICE/UDP медиапоток
    volumes:
      - ./init_files/config/mediamtx.yml:/mediamtx.yml

  vmsutils:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsUtils/Dockerfile
    env_file:
      - .env
    environment:
      APP_ID: vmsutils
    volumes: *data-volume

  vmsutils-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsutils"
      - "-app-port"
      - "${UTILS_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmsutils"
    depends_on:
      - vmsutils

  vmslogger:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsLogger/Dockerfile
    env_file:
      - .env
    environment:
      APP_ID: vmslogger
    volumes: *data-volume

  vmslogger-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmslogger"
      - "-app-port"
      - "${LOGGER_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmslogger"
    depends_on:
      - vmslogger

  vmscfg:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsCfg/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      APP_ID: vmscfg
    volumes: *data-volume
    depends_on:
      - postgres

  vmscfg-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmscfg"
      - "-app-port"
      - "5135"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmscfg"
    depends_on:
      - vmscfg

  vmsonvif:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsOnvif/Dockerfile
    env_file:
      - .env
    environment:
      APP_ID: vmsonvif
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # NOTE: WS-Discovery (camera scan) needs real LAN access to receive multicast
    # replies, which this bridge-networked container doesn't have. It works when
    # VmsOnvif runs as a native process (local dev via launch.json). Running it
    # in this container only sees the camera LAN if the container is given host
    # networking on a real Linux Docker Engine host — not on Docker Desktop,
    # where "host" networking is the Desktop VM's network, not the LAN.
    volumes: *data-volume
    depends_on:
      - vmscfg

  vmsonvif-actors:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsOnvifActors/Dockerfile
    env_file:
      - .env
    environment:
      APP_ID: vmsonvif-actors
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: *data-volume
    depends_on:
      - vmscfg

  vmsfs:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsFs/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      APP_ID: vmsfs
    volumes: *data-volume
    depends_on:
      - postgres

  vmsfs-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsfs"
      - "-app-port"
      - "${FS_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmsfs"
    depends_on:
      - vmsfs

  vmsanalytics:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/VmsAnalytics/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      APP_ID: vmsanalytics
    volumes: *data-volume
    depends_on:
      - postgres
      - vmscfg

  vmsanalytics-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsanalytics"
      - "-app-port"
      - "${ANALYTICS_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmsanalytics"
    depends_on:
      - vmsanalytics

  vmsonvif-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsonvif"
      - "-app-port"
      - "5136"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-placement-host-address"
      - "host.docker.internal:50005"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmsonvif"
    depends_on:
      - vmsonvif

  vmsonvif-actors-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsonvif-actors"
      - "-app-port"
      - "5141"
      - "-app-protocol"
      - "http"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
      - "-placement-host-address"
      - "host.docker.internal:50005"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vmsonvif-actors"
    depends_on:
      - vmsonvif-actors

  vms:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${GRPC_VMS_PORT}:${GRPC_VMS_PORT}"
    env_file:
      - .env
    environment:
      APP_ID: vms
    depends_on:
      - vmscfg
      - vmsonvif
      - vmsfs
      - mediamtx
    volumes: *data-volume

  vms-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "vms"
      - "-app-port"
      - "50051"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:vms"
    depends_on:
      - vms

  web_vms:
    profiles: [app]
    build:
      context: .
      dockerfile: web_vms/web_vms.Server/Dockerfile
    ports:
      - "${WEB_VMS_PORT}:${WEB_VMS_PORT}"
    depends_on:
      - vms
      - vmscfg
      - vmsfs
    env_file:
      - .env

  web_vms-dapr:
    profiles: [app]
    image: "daprio/daprd:latest"
    command:
      - "./daprd"
      - "-app-id"
      - "web-vms"
      - "-app-port"
      - "${WEB_VMS_PORT}"
      - "-app-protocol"
      - "http"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
    volumes:
      - "./init_files/dapr_components/docker:/components"
    network_mode: "service:web_vms"
    depends_on:
      - web_vms


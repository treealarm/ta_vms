
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_CFG_DB:-ta_cfg}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  vmscfg:
    build:
      context: .
      dockerfile: web_vms/VmsCfg/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      - postgres

  vmscfg-dapr:
    image: "daprio/daprd:1.14.4"
    command:
      - "./daprd"
      - "-app-id"
      - "vmscfg"
      - "-app-port"
      - "5135"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
    network_mode: "service:vmscfg"
    depends_on:
      - vmscfg

  vmsonvif:
    build:
      context: .
      dockerfile: web_vms/VmsOnvif/Dockerfile
    env_file:
      - .env
    depends_on:
      - vmscfg

  vmsonvif-actors:
    build:
      context: .
      dockerfile: web_vms/VmsOnvifActors/Dockerfile
    env_file:
      - .env
    depends_on:
      - vmscfg

  vmsfs:
    build:
      context: .
      dockerfile: web_vms/VmsFs/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - "${PWD}/data:/data"
    depends_on:
      - postgres

  vmsfs-dapr:
    image: "daprio/daprd:1.14.4"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsfs"
      - "-app-port"
      - "${FS_VMS_PORT}"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
    network_mode: "service:vmsfs"
    depends_on:
      - vmsfs

  vmsonvif-dapr:
    image: "daprio/daprd:1.14.4"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsonvif"
      - "-app-port"
      - "5136"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-placement-host-address"
      - "host.docker.internal:50005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: "service:vmsonvif"
    depends_on:
      - vmsonvif

  vmsonvif-actors-dapr:
    image: "daprio/daprd:1.14.4"
    command:
      - "./daprd"
      - "-app-id"
      - "vmsonvif-actors"
      - "-app-port"
      - "5141"
      - "-app-protocol"
      - "http"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-components-path"
      - "/components"
      - "-placement-host-address"
      - "host.docker.internal:50005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "./init_files/dapr_components/vmsonvif-actors:/components"
    network_mode: "service:vmsonvif-actors"
    depends_on:
      - vmsonvif-actors

  vms:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${GRPC_VMS_PORT}:${GRPC_VMS_PORT}"
    env_file:
      - .env
    depends_on:
      - vmscfg
      - vmsonvif
      - vmsfs
      - mediamtx
    volumes:
      - "${PWD}/data:/data"

  vms-dapr:
    image: "daprio/daprd:1.14.4"
    command:
      - "./daprd"
      - "-app-id"
      - "vms"
      - "-app-port"
      - "50051"
      - "-app-protocol"
      - "grpc"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
    network_mode: "service:vms"
    depends_on:
      - vms
      
  web_vms:
    build:
      context: .
      dockerfile: web_vms/web_vms.Server/Dockerfile  
    ports:
      - "${WEB_VMS_PORT}:${WEB_VMS_PORT}"  
    depends_on:
      - vms
      - vmscfg
      - vmsfs
    env_file:
      - .env

  web_vms-dapr:
    image: "daprio/daprd:1.14.4"
    command:
      - "./daprd"
      - "-app-id"
      - "web-vms"
      - "-app-port"
      - "${WEB_VMS_PORT}"
      - "-app-protocol"
      - "http"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
    network_mode: "service:web_vms"
    depends_on:
      - web_vms

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    ports:
      - "8889:8889"       # WebRTC UI доступен с хоста
      - "8554:8554"       # RTSP
      - "8000:8000"       # HTTP API (опционально)
      - "8189:8189/udp"  # ICE/UDP медиапоток

volumes:
  postgres-data:

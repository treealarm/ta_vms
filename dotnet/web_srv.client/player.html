<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<title>MediaMTX Stream</title>

<style>
body{
    background:#1e1e1e;
    color:white;
    font-family:Arial;
    text-align:center;
    padding-top:40px;
}

#container{
    width:660px;
    margin:auto;
}

iframe{
    width:640px;
    height:360px;
    border:2px solid #444;
    background:black;
}

button{
    margin-top:20px;
    padding:10px 25px;
    font-size:16px;
}
</style>

</head>

<body>

<div id="container">

<h2>Stream: mystream</h2>

<iframe id="player"></iframe>
<br>
<button id="btn">Start</button>

</div>

<script>

let running = false;
const btn = document.getElementById("btn");
const player = document.getElementById("player");

btn.onclick = () => {

    if(!running){
        player.src = "http://localhost:8889/mystream/";
        btn.innerText = "Stop";
    }else{
        player.src = "";
        btn.innerText = "Start";
    }

    running = !running;
};

</script>
<!-- ./ffmpeg -re -stream_loop -1 -i input.mp4 -c:v libx264 -preset veryfast -tune zerolatency -bf 0 -pix_fmt yuv420p -an -f rtsp rtsp://localhost:8554/mystream -->
</body>
</html>

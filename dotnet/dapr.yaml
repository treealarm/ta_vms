# Multi-App Run template for local Dapr sidecars (node 1).
# Sidecars only — no `command`: start apps from Visual Studio / `dotnet` / Cursor.
#
# From this directory:
#   dapr run -f .
#   dapr stop -f .
# From the repo root:
#   dapr run -f dotnet/dapr.yaml
#
# Ports and app-ids match .vscode/tasks.json. Node-2 sidecars are not listed here.
# The infra from docker compose (rabbitmq for the bus, postgres for the state store) must
# already be up; so must Square's stack, for service invocation into it.
version: 1
common:
  resourcesPath: ../init_files/dapr_components
# `fileAndConsole`, not `console`: the console copy is what the VS Code problem matcher reads to
# decide the background task is up, and the file copy is the only thing left to read afterwards.
# With console alone a sidecar that failed took its explanation with it when the terminal closed,
# and `<appDirPath>/.dapr/logs/` sat there empty. Logs land beside each app.
apps:
  - appID: web-vms
    appDirPath: ./web_srv.Server
    appProtocol: http
    appPort: 5134
    daprHTTPPort: 3600
    daprGRPCPort: 51001
    metricsPort: 9190
    daprInternalGRPCPort: 19011
    daprdLogDestination: fileAndConsole

  - appID: vmscfg
    appDirPath: ./VmsCfg
    appProtocol: grpc
    appPort: 5135
    daprHTTPPort: 3601
    daprGRPCPort: 51002
    metricsPort: 9191
    daprInternalGRPCPort: 19012
    daprdLogDestination: fileAndConsole

  - appID: vmsutils
    appDirPath: ./VmsUtils
    appProtocol: grpc
    appPort: 5139
    daprHTTPPort: 3606
    daprGRPCPort: 51007
    metricsPort: 9196
    daprInternalGRPCPort: 19017
    daprdLogDestination: fileAndConsole

  - appID: vmsonvif
    appDirPath: ./VmsOnvif
    appProtocol: grpc
    appPort: 5136
    daprHTTPPort: 3602
    daprGRPCPort: 51003
    metricsPort: 9192
    daprInternalGRPCPort: 19013
    # Hostname without a port on purpose: the CLI appends the platform's own default — 6050 on
    # Windows, where `dapr init` publishes placement there, 50005 everywhere else. Pinning either
    # number here leaves the actor sidecar with "placement: disconnected" on the other OS.
    placementHostAddress: localhost
    daprdLogDestination: fileAndConsole

  - appID: vmsonvif-actors
    appDirPath: ./VmsOnvifActors

apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: orderpubsub
spec:
  # In-network twin of ../orderpubsub.yaml — that file carries the full rationale for RabbitMQ
  # over Redis and for the queue limits. The only differences are the host ("rabbitmq" is the
  # compose service name) and the port (5672 inside the network; the host-side twin uses the
  # published one, because 5672 is taken there).
  type: pubsub.rabbitmq
  version: v1
  metadata:
  # User and password must match RABBITMQ_DEFAULT_USER/RABBITMQ_DEFAULT_PASS in .env; db-init
  # compares them. "guest" would not work at all — RabbitMQ accepts it only from localhost.
  - name: connectionString
    value: "amqp://vms:vms@rabbitmq:5672/"
  # Not the defaults (durable=false, deletedWhenUnused=true), and the host-side twin explains at
  # length why: with the defaults the queue is deleted the moment the subscriber disconnects, so
  # a service misses every event published while it was restarting.
  - name: durable
    value: "true"
  - name: deletedWhenUnused
    value: "false"
  # The caps that go with keeping a queue alive, see the host-side twin.
  - name: maxLen
    value: "10000"
  - name: ttlInSeconds
    value: "3600"
